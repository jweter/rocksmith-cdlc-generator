next_continuation:
  priority: "P0-current-milestone normal-path blocker fix, PR open for fresh CI"
  action: "This run's PR (stale score-arrangements next-action text fix, branch claude/nice-einstein-cuu6ok) is open as a draft and awaiting fresh independent CI (CI, Windows Desktop) on its exact head SHA; do not merge until both are green and reviewed. After merge, two remaining #304 findings still need a fix pass: (1) the Bass-mapping review queue shows FAIL rows while the selected-review panel says 'No persisted validation findings are currently queued' (2026-08-20 comment) -- a UI/state-mismatch defect, not yet investigated; (2) the packaged Bass validation regeneration retest is a separate waiting human lane (see human_decision_required). Independently, the dark-first UI (#345) and NEXT REQUIRED ACTION cue (#345/#348) still need a packaged Product Reality screenshot pass (main shell + Song Workspace, build identity visible; click-track labeling/behavior; dark semantic-state readability; Score & Mappings tab now reachable)."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work. A human-only Product Reality gate blocks only dependent work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
