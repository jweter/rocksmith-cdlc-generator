  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-19T17:15:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  important_open_issues:
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      relevance: "Verified 2026-08-18: backend contract, Song Workspace controller/status models, Arrangement Preview UI wiring, and every listed related Product Reality finding (percussion role filter, warning/validation-root-cause summaries, BPM display, pending-selection preservation, review queue summary) are merged and covered by tests. No further gap was found this run; consider closing after a human confirms no residual behavior gap."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      relevance: "Verified 2026-08-19: anchors, bounded refit preview/acceptance, promotion, per-role projection, and a read-only reviewed Rocksmith XML render/handoff bridge are merged. A prior run closed the routing gap: authoring_export.py (used by desktop_xml_export.export_project_arrangement_xml for Bass/Lead/Rhythm) checks for analysis/reviewed_score_timing.json and, when present, routes notes/timing/positions through reviewed_rocksmith_xml_render.py instead of charts/<role>_source.json, failing closed rather than silently falling back. This run closed the remaining UI-affordance follow-on: AuthoringExportManifest/GuitarAuthoringExportManifest (authoring_export.py) now carry a structured `timing_source` field (`reviewed_score_anchors`/`legacy_chart`, manifest schema_version bumped 1->2) instead of that fact being discoverable only via free-text assumptions, and the desktop Rocksmith XML Export window (desktop_xml_export_window.py) reads it back from eof/export_manifest.json / eof/<arrangement>_export_manifest.json to label each arrangement's post-export status line, degrading gracefully to the prior plain 'Exported: <path>' text if the manifest is missing/unreadable/older-shaped. Regression tests added/extended in tests/test_authoring_export_reviewed_routing.py and tests/test_desktop_xml_export_state.py. No further gap identified for #241 at this time."
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-19 (this run): implemented the Lead/Rhythm slice of the downstream-consumer integration recorded as a candidate design in the prior run. shared_guitar.py's _build_project_shared_guitar_chart_locked now consumes score_role_composition_fanout_review's composed multi-track note stream when a role's composition selects more than one track and a current composed fan-out record exists for it, materializing that composed stream as an ordinary single-track ImportedSource (score-level fields cross-checked for exact agreement across every contributing track, failing closed on disagreement) so every existing downstream consumer (reviewed positions/event-timing/techniques/chords, build_guitar_authoring_chart) accepts it unchanged. The prior fail-closed guard (_reject_unconsumed_multi_track_composition) is retired in favor of _current_composed_record_for_role, which still fails closed with an actionable message when a multi-track composition selection has no current composed record yet, or when a previously composed record is stale. Lock re-entrancy (Trap 1 from the prior run's design sketch) is closed by calling score_role_composition_fanout_review's private lock-assuming _load_current_locked from inside the already-held score_mapping_transaction. SharedGuitarDraftManifest gained composed_source_track_indices/composed_fanout_record_sha256 so load_current_shared_guitar_draft can independently detect a composed draft going stale when the composition selection changes. Trap 2 (Bass derivative invalidation binding to (score_sha256, track_index) alone) does not apply to this slice and remains open for the deferred Bass slice. Regression coverage added in tests/test_shared_guitar_timeline.py. Full local test suite (1144 tests, including optional beat/librosa extras) and scripts/check_automation_readiness.py pass. Remaining #232 work, in order: (1) Bass fan-out consumption in score_fanout.py -- must close Trap 2 first, then apply the same materialize-as-single-track strategy, as its own PR; (2) re-verify the full audit checklist of other source_track_index==/track_index== call sites against the now-landed Lead/Rhythm design; (3) Song Workspace/CLI status surfacing of composed vs. single-track draft provenance. Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: Lead/Rhythm (landed)' section. Still should not interrupt Product Reality Gate v1 unless single-track mapping blocks or produces materially wrong output."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Engineering-memory anchor for recurring failure classes. No new recurring-defect instance found this run."

