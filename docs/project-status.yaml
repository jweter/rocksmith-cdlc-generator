automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-23T02:40:00Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot. IMPORTANT for the next run: PR #383 (#379-#382) was merged directly to main (commit 26b3e63) roughly 4 minutes after it was opened -- CI was green and it was mergeable, but an automated Codex review had just posted 4 P1 findings on it (0 resolved) and the PR's head branch (feature/product-reality-live-review-379-382) was deleted by the merge before any of them were addressed. This run fixed all 4 findings directly against main's content on a fresh branch (fix/p383-p1-findings, pushed to origin) since the original PR/branch no longer exist to push follow-up commits onto; see active_pr. This is the same merge-before-review-fix pattern already recorded below for #360/#361 -- see important_open_issues #193."
  recently_merged_pr:
    number: 383
    title: "Product Reality: live review controls, latency, playability, and human marks (#379-#382)"
    merged_at: "2026-08-23T02:13:34Z, merged to main as 26b3e63 (head branch feature/product-reality-live-review-379-382, deleted on merge)"
    behavior_change: "Delivered #379-#382 on the EOF/Rocksmith-inspired Arrangement Preview: local Play/Pause/Stop/+-5s/First-note/Next-note transport controls reusing the existing ProjectAudioTransport; suppressed expensive hidden-tab Timeline redraws plus a live render/clock-delta latency diagnostic; conservative simultaneous-chord playability validation (open strings excluded, 7+ fret span blocks, 5-6 requires review); and click-to-select note/chord review with persistent questionable/wrong/clear human marks that immediately re-run Lead/Rhythm guitar validation."
    known_residual_defects: "PR #383 was merged ~4 minutes after opening -- CI green and mergeable -- but an automated Codex review had just posted 4 unresolved P1 findings, none addressed before merge: (1) a `wrong` mark on a Bass event updated nothing in validation.validate_project(), so Bass (unlike Lead/Rhythm) still passed the packaging gate after being marked wrong; (2) load_current_human_review_layer() keyed marks on source_sha256 alone, so a confirmed role-mapping or composed multi-track selection change -- which replaces an arrangement's note stream without changing the score's own SHA256 -- could leave a stale mark loading as current and attaching to an unrelated event; (3) marking a Lead/Rhythm event wrong after a package was already staged/registered updated validation but left the existing build/staging directory and psarc_receipt.json in place, so a stale receipt could keep reporting safe_for_manual_installation: true for content the reviewer had just rejected; (4) this project-status.yaml itself was not updated for #379-#382. All 4 are fixed; see active_fix_branch."
  active_fix_branch:
    branch: "fix/p383-p1-findings"
    base: "main (26b3e63)"
    pr_number: null
    lane: "Fix the 4 P1 findings from PR #383's automated Codex review (see recently_merged_pr.known_residual_defects). PR #383's own head branch no longer exists (deleted on merge), so this is a fresh branch off main rather than a push to the original PR."
    behavior_change: "(1) validation.py gained a Bass counterpart to guitar_validation.py's _validate_human_marks, wired into validate_project(), so a Bass `wrong` mark now blocks packaging the same way Lead/Rhythm already do. (2) human_review_marks.py's HumanNoteReviewLayer now also binds to the current score fan-out manifest's own path/content-hash (load_current_human_review_layer), and a new current_marks_for_arrangement() additionally verifies each mark's stored (MIDI, onset) against the arrangement's live current event at that index -- resolved through any composed multi-track selection override -- before a mark is allowed to gate validation; guitar_validation.py's Lead/Rhythm path was switched to the same helper. (3) live_review_enhancements.py's _mark_selected now calls package_generation.invalidate_package_state() (bumps the package-generation token and removes build/staging + build/dlcbuilder) whenever a `wrong` mark is recorded, for every arrangement including Bass. (4) this file."
    regression_tests: "New: tests/test_human_review_marks_identity.py (role-remap invalidates a stale mark without a score SHA change; a composed-selection-style note-stream change at a fixed index is caught by the per-event signature check even though the fan-out manifest hash is unchanged; an unaffected mark still applies); tests/test_live_review_enhancements.py (a `wrong` mark invalidates an existing staged package for Lead/Rhythm and for Bass, a `questionable` mark does not, and Bass now dispatches to validation.validate_project_to_disk instead of being silently ignored). Extended: tests/test_validation.py (Bass `wrong` mark blocks packaging via human_mark_wrong FAIL; Bass `questionable` mark warns without blocking). Full suite: python -m pytest -q -> 1347 passed before these additions -> 1357 passed after, on Python 3.12 with dev+beat extras (python3-tk installed for local sandbox verification only)."
    safety_boundary: "No change to what a human mark means or to any existing FAIL/WARNING semantics for Lead/Rhythm; Bass gains the same already-established human_mark_wrong/human_mark_questionable gate Lead/Rhythm had. Marks that no longer match current arrangement content are dropped from validation rather than misapplied to an unrelated event -- they are never silently promoted to block or pass content they were never actually placed on. package_generation.invalidate_package_state() is the same existing mechanism score_fanout.py already uses for this exact class of staged-package invalidation."
    fix_status: "Pushed to origin as fix/p383-p1-findings. Not opened as a PR and not merged -- the operator running this fix explicitly left PR creation, fresh CI, and the merge decision to a human/the next scheduled run. Next step: open a PR from this branch against main, then follow the standard required-fresh-CI-then-merge rule before merging."
  important_open_issues:
    - number: 379
      relevance: "Closed by #383 (see roadmap_issue_queue). Local playback controls landed; no known residual defect specific to this issue."
    - number: 380
      relevance: "Closed by #383. Latency diagnostics/hidden-tab redraw suppression landed; no known residual defect specific to this issue."
    - number: 381
      relevance: "Closed by #383. Conservative chord-span playability validation landed; no known residual defect specific to this issue."
    - number: 382
      relevance: "Closed by #383, but 3 of the 4 P1 findings fixed on active_fix_branch are on this issue's human-review-marks feature specifically (Bass gating, mark identity binding, staged-package invalidation). Treat as still needing verification until active_fix_branch merges with fresh CI."
    - number: 360
      relevance: "Closed by #361, but #361 merged with two known residual correctness bugs (see recently_merged_pr for #383 above superseded that slot; #360/#361's own recently_merged_pr/active_pr detail was current as of the prior update and is preserved in this entry and in roadmap_issue_queue). Follow-up fix was open as PR #362 against main as of the prior update; re-verify live state before assuming it is still open."
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) have merged code fixes; #360's follow-up fix (active_pr) is the current active #304 item. The waiting-human packaged-Windows retest lane described in human_decision_required remains outstanding and is not a repo-wide blocker on parallel #305 work."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation (#340), design-token adoption in the validation dashboard (#341), dark-first visible adoption (#345), click-track discoverability/placement (#351), Score & Mappings role-status (#352), Review Queue severity-status (#353), Track trust panel status (#354), Song Workspace header health/progress-indicator (#356), and the dark-theme contrast fix for the #352/#354 status labels (#359) are merged. Remaining #305 'Areas to review' items not yet adopted in real screens: Song Workspace layout/information-density, source audio and score/tab import cards (song_workspace_ui.py's Sources tab still renders rights/provenance review status as one plain unstyled text blob -- a good candidate for the next slice), error/empty/loading states, and High-DPI/Windows-11-scaling behavior (unconfirmable without packaged human testing). Deferred behind #360's follow-up this run per portfolio priority (existing PR/defect work outranks new roadmap work)."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor. Worth watching: a human merging a PR at its CI-green head without waiting for an in-flight automated-review fix is a process gap, not a code defect -- if it recurs, it belongs here as a tracked pattern about merge timing versus review-finding remediation, not just a one-off."
    - number: 46
      relevance: "Later optional metadata capability."

