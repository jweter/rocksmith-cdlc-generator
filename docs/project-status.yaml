  checked_at: "2026-08-22T23:18:16Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot. This run found the prior snapshot stale: the #305 dark-theme contrast fix previously tracked as active_branch_work (claude/nice-einstein-vkr9da) had already merged to main as PR #359 (head 87d2bc5) by the time this run started. This run's own default-branch base is 87d2bc5."
  recently_merged_pr:
    number: 359
    title: "Fix dark-theme contrast on Score & Mappings and track-trust status labels (#305) (#359)"
    merged_at: "2026-08-22T (see live PR history; verified via git log on default branch, head 87d2bc5)"
    behavior_change: "desktop_app.py's Score & Mappings role-status labels (#352) and track_trust_workspace_ui.py's Track trust panel status label (#354) now resolve their foreground through the new shared desktop_theme.status_dark_foreground helper instead of the light-background design_tokens.status_style(...).foreground, fixing low-to-illegible contrast against the dark desktop theme."
    pending_verification: "None outstanding for #359; it is merged."
  active_pr:
    number: 361
    branch: "agent/fix-360-recording-boundary"
    lane: "#304/#360 Product Reality remediation: bound shared-score Bass projection to the authoritative recording duration"
    behavior_change: "Fixes Product Reality blocker #360 (packaged Windows end-to-end test of the representative 'For Whom the Bell Tolls' project): shared-score Bass projection was materializing trailing score notes beyond the authoritative recording end, and validation then emitted one FAIL per mapped note and flooded the Review Queue with ~3000 findings. reconcile_bass_sources now accepts recording_duration_seconds; symbolic notes whose projected onset falls at/after the recording end are omitted rather than materialized as playable Bass notes, notes that begin inside the recording but sustain past the end are clipped to the remaining recording span, and audio-only reconciliation evidence is likewise bounded. The original structured score is unchanged; omitted trailing symbolic material is recorded as provenance metadata (omitted_trailing_symbolic_count, first_omitted_projected_time_seconds), and validation surfaces the structural mismatch as one concise WARNING instead of per-note FAIL spam."
    this_run_additional_fixes: "The initial PR (deb3cd8) passed CI but an automated Codex review flagged two real correctness bugs in the boundary logic, both now fixed on this branch (commit pending push): (1) P1 -- _nearest_unmatched_audio had no boundary awareness, so a symbolic note just inside the recording could still be verified against audio evidence just outside it (within onset_tolerance_seconds), letting out-of-recording audio grant symbolic_verified status and bypass human review -- exactly the trust boundary this fix exists to protect. Fixed by passing recording_duration_seconds into _nearest_unmatched_audio and excluding any audio candidate at/after the boundary from matching, not just from the later unmatched-audio sweep. (2) P2 -- both duration-clipping sites (symbolic-note path and audio-only path) clipped duration to the remaining recording span with min(...), then re-expanded it back up to a 0.001s floor with max(0.001, ...), which could push a note's end past the recording boundary again when the clipped remainder was under 1ms. Fixed by removing the re-expansion; the prior '<= 0' check already guarantees a strictly positive duration at that point, satisfying the model's gt=0 constraint without re-violating the boundary. Both fixes verified with new regression tests in tests/test_reconciliation.py (test_recording_boundary_rejects_audio_evidence_outside_boundary, test_recording_boundary_clip_is_not_reexpanded_past_boundary), reasoned through by hand to confirm each fails without its corresponding fix. Full suite verified on this change: python -m pytest tests/ -q -> 1313 passed (1309 baseline + 2 new boundary regression tests, net +3 vs PR's own baseline after accounting for the 2 tests the PR itself already added for #360) with dev+beat extras installed on Python 3.12 (python3-tk installed for local verification only, matching established sandbox-verification precedent); python -m compileall -q src tests, cdlc --help, and python scripts/check_automation_readiness.py all pass locally."
    third_codex_finding: "A third Codex finding (P1) noted this file was left describing the pre-#360 state. Addressed in this same change."
    safety_boundary: "No change to the human-review gate model: notes are still marked review_required based on evidence strength; this run's fixes make that gate strictly stronger (out-of-boundary audio can no longer satisfy it) and do not weaken any existing check. The original structured score remains untouched; only which projected notes become playable arrangement material changes, and that change is provenance-recorded."
    pr_status: "Open (not draft). CI and Windows Desktop were green on the pre-fix head (deb3cd8); both required workflows must re-run and pass on the new head before merge, per this repo's newly-opened-PR-requires-fresh-CI policy. Left for fresh independent CI; not merged in this run."
  important_open_issues:
    - number: 360
      relevance: "Current-milestone Product Reality blocker. Fix open as PR #361 (see active_pr above); do not merge until fresh CI passes on the post-fix head and no unresolved review threads remain."
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) have merged code fixes; #360 is the current active #304 defect (see active_pr). The waiting-human packaged-Windows retest lane described in human_decision_required remains outstanding and is not a repo-wide blocker on parallel #305 work."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation (#340), design-token adoption in the validation dashboard (#341), dark-first visible adoption (#345), click-track discoverability/placement (#351), Score & Mappings role-status (#352), Review Queue severity-status (#353), Track trust panel status (#354), Song Workspace header health/progress-indicator (#356), and the dark-theme contrast fix for the #352/#354 status labels (#359) are merged. Remaining #305 'Areas to review' items not yet adopted in real screens: Song Workspace layout/information-density, source audio and score/tab import cards (song_workspace_ui.py's Sources tab still renders rights/provenance review status as one plain unstyled text blob -- a good candidate for the next slice), error/empty/loading states, and High-DPI/Windows-11-scaling behavior (unconfirmable without packaged human testing). Deferred behind #360 this run per portfolio priority (existing PR/defect work outranks new roadmap work)."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor. No new recurring-pattern cross-link needed this run; the #360 boundary-matching and duration-clipping defects fixed here are specific to reconciliation.py's new recording-boundary logic, not yet an observed repeat of an existing tracked pattern."
    - number: 46
      relevance: "Later optional metadata capability."

