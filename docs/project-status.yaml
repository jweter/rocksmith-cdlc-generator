next_continuation:
  priority: "P1-current-milestone #305 slice, PR #356 open with merge conflict and stale continuity snapshot both reconciled this run, awaiting fresh CI; #304's remaining work is a waiting-human lane, not a blocker"
  action: "PR #356 (branch claude/nice-einstein-t12rr5; adds song_workspace_health_presentation.py and wires symbol+label health text plus dark-theme-aware progress-bar status styling into SongWorkspaceWindow's header) had a merge conflict against main in this file (caused by #354 landing after the branch was created) and one unresolved P1 review finding (this file describing an earlier, since-fixed implementation). Both are reconciled on this run's merge commit. Do not merge until fresh CI (CI, Windows Desktop) on the exact new head SHA is green and mergeability/review state are re-verified live. #304's known code-fixable defects are all merged; its only remaining work is the waiting-human packaged-Windows retest lane in human_decision_required, which this and prior automated runs cannot perform (no live Rocksmith installation, no Windows desktop, no human) and which does not block further #305 work. The next scheduled run should: (1) query live PR/issue state first as always; (2) if PR #356 is GREEN with no unresolved review threads, merge it, then continue #305 by adopting the shared design tokens/semantic-status styles in one more real screen from the still-open 'Areas to review' list noted in important_open_issues (e.g. Song Workspace layout/information-density, source/score import cards, or error/empty/loading states) as one small reviewable slice; (3) if a human has since performed the #304 packaged retest and reported results, act on those findings first (new #304 comments/child issues if defects were found, or explicit #304 closure evaluation per PROJECT_PLAN.md if it passed cleanly) ahead of further #305 work."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

