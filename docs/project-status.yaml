      disposition: "official TAB image acceptance"
      action: "Confirm a lawful private phone-camera TAB image renders upright, manual rotation works, and orientation persists without committing the image."
    - issue: 435
      disposition: "private reference mapping acceptance"
      action: "After timing is stable, confirm one lawful private page can serve every applicable arrangement without duplicate image imports."
