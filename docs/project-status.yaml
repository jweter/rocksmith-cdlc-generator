  controls: "Input bounds; RAM preadmission and during-run floor; RSS and wall-clock stop conditions; on-limit process-tree kill attempt"
  constraints: "Process RSS is sampled not OS-enforced and excludes child tree/GPU; no real separator run; no network isolation established"
