  limitations: "No independent OS network sandbox; environment offline hints are NOT guaranteed download prevention. No continuous memory watchdog, GPU/child peak memory, calibrated separator quality, real-song note F1, guitar role separation or Rocksmith gameplay proof"
  next: "Finish automated safety tests and independent review, then choose an explicitly approved offline-capable model with license, dependency manifest and measured RAM before a short synthetic model trial"

synthetic_resource_telemetry:
