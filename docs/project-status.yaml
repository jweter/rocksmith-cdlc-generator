next_continuation:
  priority: "P0-current-milestone normal-path/state-clarity fix, PR open for fresh CI"
  action: "This run's PR (Review Queue detail-panel stale empty-message fix, branch claude/nice-einstein-1x4v6x) is open and awaiting fresh independent CI (CI, Windows Desktop) on its exact head SHA; do not merge until both are green and reviewed. After merge, all known #304 comment defects have code fixes merged; the remaining #304 work is entirely the waiting human lane: (1) regenerate Bass mapping/validation in the same packaged Windows representative project and confirm the audio_only-mapping fix (#322) and stale-artifact detection (#342) actually resolve the originally reported unmapped_bass_note FAILs end to end; (2) packaged Product Reality retest of the Score & Mappings tab reachability fix (#348) on the same 1600x960 viewport; (3) packaged Product Reality screenshot pass of the dark-first UI (#345) and NEXT REQUIRED ACTION cue, plus confirming the next-action text (#349) and Review Queue detail label (this run) read correctly in the real packaged app. If that human retest surfaces new reproducible defects, they become new #304 comments/child issues; if it passes cleanly, the next scheduled run should consider #304 substantially remediated and evaluate starting #305's next authoring-workspace slice or closing the Product Reality Gate v1 milestone per PROJECT_PLAN.md."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work. A human-only Product Reality gate blocks only dependent work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
