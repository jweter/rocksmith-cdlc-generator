next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness (see verified_repository_state.active_pr.fix_status). As of this file's last edit: a draft PR from branch claude/nice-einstein-bv37nl (#305 guided-shell next-action callout fix) was about to be opened against main. Re-check its live number/state: if still open, wait for fresh CI on both required workflows and an unresolved-review-thread check before merging; if already merged, re-check its post-merge automated-review threads too (per #193's prevention rule -- do this even though #388 just came back clean, since the pattern could recur on any PR) and then move to the next bullet. Next unstarted work after that PR resolves: pick another #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density more broadly, or other error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence."
  action: "This run queried live GitHub state first and found 0 open PRs, so per selection_rule it checked the automated-review threads on the most recently merged PR (#388) before picking new work -- found only one advisory, explicitly non-blocking Codex usage-limit comment and 0 unresolved review threads; both required workflows were green on #388's merged head SHA. The four-run merge-before-review-fix-gap streak (#361->#362, #383->#384, #385/#386->#387, #387->#388) did not recur on #388. With no existing broken/pending/blocked work and no unresolved post-merge finding to fix, this run selected the next #305 roadmap slice per PROJECT_PLAN.md's evidence-driven-slices order: the guided desktop shell (the real cdlc-desktop entry point via LiveDiagnosticsGuidedDesktopApp -> GuidedDesktopApp) was stacking a raw 'Next action' callout -- blank before any project is open, duplicate of the curated 'Song progress' panel afterward -- directly beneath that panel, both driven by the identical workflow-plan next-step. Fixed by hiding the redundant base callout only in the guided shell (desktop_app.py, guided_desktop.py), added 3 regression tests against the real _build_layout chain using this repo's established no-display-server fake-widget convention, documented the defect/fix/verification in docs/product-reality/issue-305-redundant-next-action-callout.md, ran the full test suite locally (1375 passed, 0 failed, Python 3.12 with dev+beat extras), and opened this as a draft PR against main -- explicitly not merged in this same run, left for fresh CI per the standard rule. The next run (or Jeremy) should: (1) query live PR/issue state first as always, including automated-review threads on anything merged very recently; (2) once CI is green on this PR and it is mergeable with no unresolved review threads, merge it; (3) then pick another #305 'Areas to review' item or re-check #304's human-only lane; (4) keep watching for any recurrence of the merge-before-review-fix-gap pattern even though it did not recur on #388."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking the most recently merged PR's review threads is part of querying live state, not optional -- do this even when 0 PRs are open, and even when the previous run's check came back clean. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true (or is explicitly flagged for re-verification) whether read a minute or a week later, after the PR opens, and after it merges."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

