  - "Guitar Pro 3-5 and MusicXML complete-score intake"
  - "Explicit Bass/Lead/Rhythm mapping and shared score-to-recording timing"
  - "Reviewed timing and provenance-aware arrangement editing"
  - "Rocksmith XML authoring, DLC Builder staging, and PSARC registration/verification"
  - "Packaged Windows desktop executable and Song Workspace"
  - "Transactional provenance-aware undo/redo across accepted review layers"
  - "Human-confirmed multiple source tracks per arrangement role"
  - "Optional Editor on Fire external reference bridge"
  - "Deterministic EOF compatibility evidence and project-local discrepancy reports"
  - "Read-only pitch-correct fretboard candidate/source-position diagnostics"
  - "Project-bound Bass/Lead/Rhythm fretboard diagnostics"
  - "Provenance-bound EOF fret-hand-position observation contract"
  - "Project-bound EOF hand-position evidence validation/currentness status"
  - "#305 deliverable 1: desktop UI audit (docs/ui/desktop-ui-audit.md) and typography/spacing/semantic-status design-token foundation (design_tokens.py, docs/ui/design-system-foundation.md)"
  - "#305: validation dashboard adopts the shared typography/spacing/semantic-status design tokens directly (#341)"
  - "Packaged Windows build identity: semantic version plus abbreviated commit SHA in title bars, with the exact full SHA and build timestamp retained as diagnostics provenance"
  - "Build identity provenance hardening: unstamped development SHA is accepted only from the verified Rocksmith source checkout"
  - "#305 dark-first desktop theme: centralized studio/workbench theme across the packaged desktop and Song Workspace, non-color-only NEXT REQUIRED ACTION cue, strengthened dark semantic-status contrast, normalized legacy Text/Canvas controls, and promoted variable-tempo timing audition as a first-class Click Track / Beat Grid control"
  - "Score & Mappings tab reachability: human-confirmation mapping controls always render before the (now independently scrollable) track table, regardless of available notebook height (#348)"
  - "Stale post-confirmation guided next-action text fixed: the score-arrangements readiness step now shows its actual state-specific text (e.g. ready to fan out, waiting on rights review) instead of a fixed confirm-mappings instruction once mappings are already confirmed (#349)"
  - "Review Queue detail panel no longer shows a stale 'no persisted validation findings' message once FAIL/WARNING rows are populated: the summary label is recomputed on every Song Workspace refresh instead of only when the queue is empty (#304, merged as #350)"
  - "#305: the timing-review click/beat-grid audition toggle is relocated beside Play/Stop with an always-visible plain-text caption explaining its purpose, instead of being buried in the Timing review section (#351)"
  - "#305: the Score & Mappings tab's Bass/Lead/Rhythm rows each show a dedicated semantic-status label (info/review_required/pass, symbol + label, never color-alone) reflecting selection/confirmation state, instead of that state being legible only from suffix text inside the combobox's own value (#352)"
  - "#305: the Song Workspace Review Queue tab's Severity column shows the shared symbol+label semantic-status text and a matching per-row Treeview tag color, instead of a plain unstyled FAIL/WARNING/INFO string (#353)"
  - "#305: the Song Workspace 'Human-reviewed source track trust' panel's Bass/Lead/Rhythm status line renders through the shared semantic status registry (current->PASS, stale->STALE, unreviewed->REVIEW REQUIRED, symbol + label, never color-alone) with matching label foreground color, instead of a bare unstyled sentence (#354)"
  - "#305: the Song Workspace header's project-health line and progress bar show the shared symbol+label semantic-status text/color (fail/review_required/pass/info), resolved through the dark desktop palette so contrast holds against the packaged app's dark theme, driven by SongWorkspaceSnapshot.health, instead of the raw WorkspaceHealth string with an identically-colored bar regardless of state; the bar/label also reset to the fail state instead of persisting stale styling when a refresh fails (#356)"
  - "Timing review: Confirm beat edits now succeeds when a user reviews detector timing unchanged, instead of raising FileNotFoundError and requiring a fabricated anchor lock just to create the reviewed-timing artifact; the failure modal also stopped exposing a bare filesystem path (#357, merged as #358)"
  - "#305: the Score & Mappings role-status labels (#352) and the Track trust panel status label (#354) now resolve their foreground through the new shared desktop_theme.status_dark_foreground helper instead of the light-background design_tokens.status_style(...).foreground, fixing a low-to-illegible contrast defect against the dark desktop theme -- the same class of bug PR #356 already fixed for the header health indicator and Review Queue severity column, now consolidated into one shared helper so future adoptions have a single obvious correct import"

next_continuation:
  priority: "P1-follow-up fix for two residual correctness bugs left on main by the #361 merge (see verified_repository_state); PR #362 open, awaiting fresh CI and automated review on its head. #304's remaining work beyond #360 is a waiting-human lane, not a blocker."
  action: "This run found PR #361 open with CI green on its head (deb3cd8) but three unresolved automated-review threads from Codex: two verified-real correctness bugs undermining the PR's own recording-boundary guarantee (a human-review-bypass via out-of-boundary audio evidence, and a duration-clip re-expansion past the boundary), and one stale-documentation finding (this file). While this run was fixing and testing those findings on the PR branch, Jeremy merged PR #361 directly at its original (unfixed) head -- the merge commit 9a19d6c on main does not include the fix. This run therefore rebased the fix onto current main as branch agent/fix-360-review-followup (commit b94dc16, cherry-picked cleanly, full 1313-test suite reverified green on top of 9a19d6c) and opened a new PR from it targeting main, since the original PR is already closed/merged and cannot carry more commits. The next scheduled run should: (1) query live PR/issue state first as always; (2) check the follow-up PR's CI -- if CI, Windows Desktop are both green, mergeability is clean, and no new unresolved review threads exist, merge it; if CI fails, diagnose the actual failure before assuming it is environmental; (3) once it merges, #360's residual defects are resolved -- re-check #304 for any other open comment-reported defects, and if none remain besides the waiting-human packaged-Windows retest lane, resume #305 by adopting the shared design tokens/semantic-status styles in one more real screen (the Sources tab's rights/provenance status in song_workspace_ui.py's _refresh_sources, currently one plain unstyled text blob, is a concrete next candidate; Song Workspace layout/information-density and error/empty/loading states remain open too); (4) if a human has since performed the #304 packaged retest and reported results, act on those findings first ahead of further #305 work."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green -- CI passing does not by itself mean a PR is safe to merge, and a PR being merged does not by itself mean an in-flight review finding on it is resolved; verify the merged head actually carries the fix before treating a finding as closed. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 304
    decision: "Regenerate Bass mapping and validation in the same packaged Windows representative project and report residual failures; this remains a waiting human validation lane. The prior retest reproduced identical historical failures only because stale bass_mapped.json was never re-offered for regeneration; the planner now recognizes it as stale."
  - issue: 46
    decision: "Before implementation, confirm the product/licensing decision and permitted metadata-cache boundary."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
