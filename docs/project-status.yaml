    title: "Reconcile stale project-status.yaml (#350 merged) + #305 click-track discoverability slice"
    merged_at: "2026-08-22T07:31:25Z"
    behavior_change: "song_workspace_playback_ui.py exposes the Play/Stop transport row as self.transport_row; timing_review_ui.py builds the click/beat-grid audition toggle directly into that row with an always-visible plain-text caption explaining its purpose, instead of it being buried in the Timing review section. docs/project-status.yaml corrected to reflect PR #350's actual merged state."
    pending_verification: "This run verified the merge live via mcp__github__pull_request_read (merged_at above, merged_by: jweter) and re-confirmed zero open PRs before starting further work. All known #304 comment-reported defects (#322, #342, #348, #349, #350) still have code fixes merged; the three human-retest items ((1) packaged Bass mapping/validation regeneration, (2) Score & Mappings reachability retest of #348, (3) dark-first UI / NEXT REQUIRED ACTION screenshot pass of #345) remain an explicit waiting-human lane this agent cannot perform (no live Rocksmith installation, no Windows desktop, no human) -- not a repo-wide blocker on other work. No new #304/#305 comments were posted since PR #351's snapshot. See human_decision_required and next_continuation."
  active_branch_work:
    branch: "claude/nice-einstein-edtv0l"
    lane: "#305 next authoring-workspace slice: Bass/Lead/Rhythm role mapping status presentation on the Score & Mappings tab"
    planned_behavior_change: "docs/project-status.yaml's own important_open_issues note (from PR #351) explicitly called out 'Bass/Lead/Rhythm role mapping status presentation outside the validation dashboard' as a still-unadopted #305 'Areas to review' surface. Code inspection confirmed DesktopApp._build_layout's mapping_box (Score & Mappings tab) only ever conveyed each role's confirmation state as a suffix baked into the editable combobox's own display text (' ✓ confirmed' / ' • review required'), with no dedicated semantic-status presentation. Added score_mapping_status_presentation.py (new, tkinter-free, mirrors validation_dashboard_presentation.py's established pattern) with present_mapping_role_status() classifying each role into a StatusState (info/no score, review_required/no selection or unconfirmed selection, pass/human-confirmed) plus format_status() text. desktop_app.py now builds one bound ttk.Label per role (column 3, beside the combobox/Confirm button) driven by this presentation function, updated on every _refresh_score() alongside the existing combobox suffix logic (which is unchanged, so #304/#305's prior mapping-refresh contract and its regression tests keep passing unmodified). The label's foreground is set directly from design_tokens.status_style(...).foreground (the same raw-color approach validation_dashboard_ui.py already uses for its Treeview row tags) rather than a named ttk style class, so it renders correctly regardless of whether/when apply_desktop_theme has run."
    safety_boundary: "Presentation-only. No workflow routing, mapping/confirmation logic, provenance, human-review-gate semantics, or packaging behavior changed: confirm_score_mapping, _mapping_refresh_value, and _bare_mapping_label are unchanged, and mappings are still never auto-accepted -- a selected-but-unconfirmed track is deliberately classified review_required, not pass. The new status text always pairs a symbol + label (never color-alone), consistent with design_tokens' existing contract."
    regression_tests: "tests/test_score_mapping_status_presentation.py (new, 6 tests) unit-tests present_mapping_role_status's four state transitions plus the non-color-alone text contract. tests/test_desktop_score_tab_layout.py (extended, +2 tests) verifies via the repo's existing no-display fake-widget harness that each role gets a status label bound to mapping_status_vars at column 3, and that DesktopApp._set_mapping_status renders a given presentation's text/foreground onto the live var/label pair. Full suite: 1278 tests pass (1270 baseline + 8 new) with dev+beat extras installed on Python 3.12 (python3-tk installed for local verification only, matching this repo's established sandbox-verification precedent); python -m compileall -q src tests, cdlc --help, and python scripts/check_automation_readiness.py all pass locally."
    cross_linked: "docs/project-status.yaml important_open_issues (#305) from PR #351, which first identified this surface as unadopted; docs/ui/design-system-foundation.md; validation_dashboard_presentation.py / validation_dashboard_ui.py (#341) as the established pattern this mirrors."
    pr_status: "Opened this run; left open for fresh independent CI (CI, Windows Desktop) on its exact head SHA; not merged in this run."
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350) now have code fixes merged. The only remaining #304 work is the waiting-human packaged-Windows retest lane described in human_decision_required -- not a repo-wide blocker on parallel #305 work."
    - number: 305
