    number: 470
    title: "Correct EOF parity docs: no cross-beat slide-in truncation exemption (#414)"
    merged_at: "2026-08-30T14:38:00Z"
    behavior_change: "No functional/behavior change. docs/integrations/EOF_PARITY_ROADMAP.md item B and eof_short_note_truncation_check.py's own navigation note both claimed an unmodeled gap: a short note allegedly exempted from EOF's import truncation solely because the *previous* note's legato/shift slide targets it (EOF's cross-beat EOF_NOTE_TFLAG_SLIDE_IN). Re-auditing EOF_UPSTREAM_COMMIT c0d88eabf7b00b0bd2cac9414df9fa9c6b3e7100 (src/gp_import.c) showed this gap does not exist. Corrected the claim in eof_short_note_truncation_check.py, THIRD_PARTY_NOTICES.md, docs/eof-subsystem-parity-matrix.md, and EOF_PARITY_ROADMAP.md, and added a regression test."
    verification: "Exact head aa133afca622719e6b8c4df62d8a8ae9598fda86 passed CI, Windows Desktop, and Security - TruffleHog before merge as cc4eb7b1ce222bcb5ce3d512e6c7acc40887e7a6. New regression test (22 tests total in the module) passes; full local suite 1558 passed, 0 failures."
  short_note_truncation_merge:
    number: 468
    title: "Add EOF-derived short-note/staccato/mute truncation check (#414)"
    merged_at: "2026-08-30T08:50:00Z"
    behavior_change: "Adds src/rocksmith_cdlc_generator/eof_short_note_truncation_check.py, an advisory-only check that reproduces EOF's default short-note/staccato/mute sustain-truncation preferences (note_is_short/truncate logic in eof_load_gp, src/gp_import.c, plus the eof_gp_import_truncate_short_notes/_chords/_remove_accent_from_staccato preference defaults in src/main.c) and compares that decision against the generator's currently-imported note sustains. Does not model generated/exported arrangement output (a previously suspected cross-beat legato/shift slide-in truncation exemption was later found not to exist; see PR #470). Also updated THIRD_PARTY_NOTICES.md, docs/integrations/EOF_PARITY_ROADMAP.md, and docs/eof-subsystem-parity-matrix.md."
    verification: "Exact head f3e59dc10c11ae4e1cc4840a27952781ca5c8127 passed CI, Windows Desktop, and Security - TruffleHog before merge as 52144eb2512a5fe26f6a71bed037439856b3e298."
