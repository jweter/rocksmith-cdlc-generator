next_continuation:
  priority: "P4-current-milestone"
  action: "Continue Product Reality Gate v1 (requires a human-run representative lawful song/score session; not autonomously completable). While that evidence run is pending: #232's Lead/Rhythm downstream-consumer slice, Bass downstream-consumer slice, the full audit-checklist sweep of remaining source_track_index==/track_index== call sites, and both halves (Lead/Rhythm, then Bass) of Song Workspace draft-provenance status surfacing have all landed (see #232 entry above) on top of the previously merged Song Workspace status layer, no-overlap compose controller/panel, in-workspace add/remove track picker, and in-workspace overlap-decision UI. Only one remaining #232 item: make position/event-timing/technique/chord review and the Arrangement Preview actually consume a role's composed multi-track note stream instead of failing closed when one is selected -- a distinct, larger follow-on requiring each review layer's event-index keying and score_preview.py's per-role note assembly reworked against a merged multi-track stream. Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: Lead/Rhythm (landed)', 'Downstream consumption: Bass (landed)', 'Audit-checklist sweep (issue #232, landed)', 'Song Workspace status surfacing: Lead/Rhythm draft provenance (landed)', and 'Song Workspace status surfacing: Bass draft provenance (landed)' sections -- read all five before starting it. #241 and #268 both appear complete; a human should confirm and close them rather than an agent auto-closing them. Next highest-value candidate after the last #232 item lands (or in parallel, since it is a distinct larger design effort): sweep the open Issues tab (#305, #304, #46 plus any new items) for the next highest-value bounded fix, per the agent-development-policy issue-sweep cadence -- note #46 is blocked on a human product/licensing decision about an optional Apple Music metadata provider, and #305 (UI polish) is explicitly scoped to follow #304 (Product Reality defect audit), which itself requires the same human-run Product Reality Gate v1 evidence session this milestone is waiting on."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

