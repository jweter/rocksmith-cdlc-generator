active_change:
  pr_number: 451
  branch: "claude/clever-davinci-uepk4e"
  title: "Fix workflow planner treating stale alignment refinement as complete (#431)"
  state: "draft; pending exact-head CI, Windows Desktop packaging, and independent review"
  scope: "Add leading_rest_refinement_is_current() (mirroring the existing, previously-uncalled refinement_is_current()) and workflow_plan._bass_alignment_refinements_are_current(), so align-tab/reconcile-tab correctly reopen when the persisted alignment predates the current onset/leading-rest refinement algorithm instead of reading complete forever once alignment.json exists. Adds regression coverage for the planner staleness gap and the two previously-uncalled currency helpers; records the pattern in the error-resolution ledger as ERR-2026-005. Does not itself change alignment/timing output or claim the v5 refinement's musical correctness is verified."

next_continuation:
  priority: "Land the align-tab planner-staleness fix (#431), then run packaged Product Reality on the resulting product behavior before inventing another timing correction."
  action: "Require exact-head CI, Windows Desktop packaging, TruffleHog, mergeability, and review for the active planner-staleness fix. After it merges and is packaged, rerun Safe Automatic Steps on the representative project: align-tab should now reopen and re-run the v5 leading-rest refinement instead of silently staying complete. Review/promote shared timing through the normal human gate, then verify the common Bass/Lead/Rhythm entrance near ~7.109 s and the printed-score B-string fret-8 Lead transition around ~77.756 s. If the residual defect persists even with the refinement algorithm now actually executing, that localizes the remaining problem to the refinement algorithm itself rather than to planner staleness. In the same local session, exercise EOF recording-clock observations, the alternate private GP comparison, and one private Official TAB page selected for every applicable arrangement so any remaining failure can be localized without changing source or musical authority."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. Inspect current EOF before inventing deterministic authoring rules. Do not compensate for a failed timing result by hand; preserve one shared recording clock and collect evidence for the next root-cause slice."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

