status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one structured score, when available, producing the subset of reviewed playable Bass + Lead + Rhythm arrangements actually present in that score with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use representative lawful songs and structured scores in the packaged Windows application to drive normal-path correctness fixes while review/source tooling improves in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / evidence-driven defect remediation"
      action: "Keep score-to-recording timing as the first Product Reality gate; the v5 packaged retest is now evidence that a direct EOF-derived first-sync replacement must be validated before downstream arrangement quality work resumes."
    - issue: 431
      disposition: "current Product Reality timing blocker"
      action: "Fresh packaged testing after the planner-staleness repair still reproduces the residual late projection (~11.773 s versus the real ~7.109 s common entrance and roughly two bars at the later Lead fingerprint). Treat v5 itself as disproven and validate the replacement timing path against the same private representative project."
    - issue: 455
      disposition: "active timing replacement / mature-reference parity"
      action: "Replace Guitar Pro periodic-shift and leading-rest ranking with an EOF-derived first-synchronization-point path, preserve pre-zero beat semantics, and require the representative first entrance plus later landmark to agree with EOF before declaring timing fixed."
    - issue: 437
      disposition: "implemented diagnostic capability / local evidence pending"
      action: "Exercise EOF recording-clock parity against lawful local observations so final mapped timing can be compared directly to EOF rather than only source-relative score interpretation."
