  priority: "Keep BWV1007 page-2 measure-1 Product Reality (#511/#508) visible as the recognition-lane completion gate while continuing independent EOF/reference and authoring-hardening development."
  action: "When the private packaged environment is available, perform the one-measure Prelude retest. Until then, park only that dependent acceptance lane. The next parallel-safe #414 slice in this same area is the fuller eof_generate_efficient_hand_positions_logic() heuristic (fingering/index-finger, slide-triggered, and arpeggio/handshape-phrase-triggered position changes; the barre-chord same-position exemption) named as out of scope by the fret-range-tolerance check (#592), or actually generating and exporting real fret-hand-positions rather than only detecting their absence -- this is a substantial behavior change to real Rocksmith XML export (currently always empty <anchors>) and should be scoped as its own deliberate slice with strong differential regression coverage, not folded into a routine scheduled pass. Smaller/safer parallel-safe #414 audit slices remain available too (e.g. the still-UNASSESSED 'Coda/segno/fine navigation', 'Fingering validation', 'Beat-grid validation', or 'Invalid GP notation recovery' rows in docs/eof-subsystem-parity-matrix.md). Also newly opened and not yet triaged into this queue: issue #569 (iPhone mobile Product Reality review harness, slice 1 = static responsive evidence report) -- authorized by Jeremy directly but cross-cutting with jweter/project-orchestrator#44; a future session should size slice 1 explicitly before starting it. Otherwise continue the highest-value authorized #414/#455 or #305 slice that does not assume the pending human result."
  selection_rule: "Product Reality is lane-local. Never classify the entire Rocksmith project as blocked while an authorized parallel-safe P4/P5 slice can be implemented and verified. Preserve human musical authority and never infer readiness from output existence alone."

