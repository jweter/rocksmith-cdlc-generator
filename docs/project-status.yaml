schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-22T23:18:16Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use one representative lawful song + complete structured score in the packaged Windows application to drive normal-path fixes while independent product work continues in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 360
      disposition: "current milestone / highest priority"
      action: "Product Reality blocker itself is fixed and merged (PR #361), but the merge landed with two known residual correctness bugs an automated review flagged pre-merge. Follow-up fix is open as PR #362 against main; awaiting fresh CI and automated review before merging."
    - issue: 304
      disposition: "current milestone / highest priority"
      action: "Remediate reproducible Product Reality defects. Packaged Bass verification remains a waiting human lane, not a repo-wide freeze."
    - issue: 305
      disposition: "parallel product-progress lane"
      action: "Improve authoring workflow and diagnostics independently of pending human verification while preserving provenance and review authority."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes and regression protection."
    - issue: 46
      disposition: "later capability expansion"
      action: "Optional Apple Music metadata enrichment only after core desktop workflow completion."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-22T23:21:32Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot. IMPORTANT for the next run: PR #361 (fix for #360) was merged directly to main (commit 9a19d6c, squash) at its ORIGINAL head (deb3cd8) while this run was still fixing review findings on that same PR branch -- the merge landed after CI on deb3cd8 went green but before this run's fix commit was pushed, so the fix commit never reached the merged PR. This run's own default-branch base is therefore 9a19d6c, which still contains both defects described below. A new follow-up PR carries the fix; see active_pr."
  recently_merged_pr:
    number: 361
    title: "Bound shared-score Bass projection to recording duration (#360) (#361)"
    merged_at: "2026-08-22T23:18:41Z, squash-merged to main as 9a19d6c"
    behavior_change: "Fixed Product Reality blocker #360: shared-score Bass projection was materializing trailing score notes beyond the authoritative recording end, flooding the Review Queue with one FAIL per mapped note. reconcile_bass_sources now accepts recording_duration_seconds and omits/clips notes projected beyond the recording, recording omitted material as provenance metadata."
    known_residual_defects: "Merged at the head CI had validated (deb3cd8), which still carries two real correctness bugs an automated Codex review flagged on the PR before merge: (1) P1 -- _nearest_unmatched_audio had no boundary awareness, so a symbolic note just inside the recording could still be verified against audio evidence just outside it (within onset_tolerance_seconds), letting out-of-recording audio grant symbolic_verified status and bypass human review. (2) P2 -- both duration-clipping sites clipped to the remaining recording span then re-expanded to a 0.001s floor, which could push a note's end back past the boundary when the clipped remainder was under 1ms. Both are live on main as of 9a19d6c. Fix is ready: see active_pr."
  active_pr:
    number: 362
    branch: "agent/fix-360-review-followup"
    base: "main (9a19d6c)"
    lane: "Follow-up to #360/#361: fix the two residual correctness bugs described in recently_merged_pr.known_residual_defects, which were flagged by automated review before #361 merged but did not make it into the merged commit."
    behavior_change: "_nearest_unmatched_audio now takes recording_duration_seconds and excludes any audio candidate at/after the boundary from matching, not just from the later unmatched-audio sweep -- closing the human-review bypass. Both duration-clipping sites (symbolic-note path and audio-only path) no longer re-expand a clipped duration back up to a 0.001s floor after bounding it to the remaining recording span; the prior '<= 0' check already guarantees a strictly positive duration at that point, satisfying the model's gt=0 constraint without re-violating the boundary."
    regression_tests: "tests/test_reconciliation.py: test_recording_boundary_rejects_audio_evidence_outside_boundary and test_recording_boundary_clip_is_not_reexpanded_past_boundary, each reasoned through by hand to confirm it fails without its corresponding fix. Full suite verified on this branch (rebased onto main 9a19d6c): python -m pytest tests/ -q -> 1313 passed, with dev+beat extras installed on Python 3.12 (python3-tk installed for local verification only, matching established sandbox-verification precedent); python -m compileall -q src tests, cdlc --help, and python scripts/check_automation_readiness.py all pass locally."
    safety_boundary: "No change to the human-review gate model: notes are still marked review_required based on evidence strength; this fix makes that gate strictly stronger (out-of-boundary audio can no longer satisfy it) and does not weaken any existing check. The original structured score remains untouched."
    pr_status: "Open as PR #362 against main (opened not-draft after this file was first written, then marked ready for review to trigger automated review before merge). Left for fresh independent CI (CI, Windows Desktop) and automated review on this exact head before merge, per this repo's required-workflow policy; do not skip fresh CI just because the underlying diff was already CI-validated on the (now-merged) original PR head."
  important_open_issues:
    - number: 360
      relevance: "Closed by #361, but #361 merged with two known residual correctness bugs (see recently_merged_pr). Follow-up fix is active_pr above; treat this as still needing verification until that follow-up merges with fresh CI."
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) have merged code fixes; #360's follow-up fix (active_pr) is the current active #304 item. The waiting-human packaged-Windows retest lane described in human_decision_required remains outstanding and is not a repo-wide blocker on parallel #305 work."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation (#340), design-token adoption in the validation dashboard (#341), dark-first visible adoption (#345), click-track discoverability/placement (#351), Score & Mappings role-status (#352), Review Queue severity-status (#353), Track trust panel status (#354), Song Workspace header health/progress-indicator (#356), and the dark-theme contrast fix for the #352/#354 status labels (#359) are merged. Remaining #305 'Areas to review' items not yet adopted in real screens: Song Workspace layout/information-density, source audio and score/tab import cards (song_workspace_ui.py's Sources tab still renders rights/provenance review status as one plain unstyled text blob -- a good candidate for the next slice), error/empty/loading states, and High-DPI/Windows-11-scaling behavior (unconfirmable without packaged human testing). Deferred behind #360's follow-up this run per portfolio priority (existing PR/defect work outranks new roadmap work)."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor. Worth watching: a human merging a PR at its CI-green head without waiting for an in-flight automated-review fix is a process gap, not a code defect -- if it recurs, it belongs here as a tracked pattern about merge timing versus review-finding remediation, not just a one-off."
    - number: 46
      relevance: "Later optional metadata capability."

