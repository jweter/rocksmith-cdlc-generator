next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness (see verified_repository_state.active_pr.fix_status). As of this run: PR #388 (claude/nice-einstein-6z2ql1) is open and draft. If it is still open, wait for fresh CI on both required workflows and an unresolved-review-thread check before merging; if it is already merged, treat the quality_preflight.py cached-diff-check gap and this file's stale-continuation gap as closed and move straight to the next bullet. Next unstarted work after PR #388 resolves: pick the next #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density, or error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence."
  action: "This run queried live GitHub state first and found 0 open PRs, so per selection_rule it checked the automated-review threads on the single most recently merged PR (#387) rather than assuming merged means resolved, and found it still carried two unresolved P2 Codex findings (a staged-only whitespace-check gap in the fix #387 itself shipped, and this file's own self-invalidating continuation text). It fixed both in one small slice (see verified_repository_state.active_pr), ran the full test suite locally (1372 passed, 0 failed, on Python 3.12 with dev+beat extras), and opened draft PR #388 against main, explicitly not merging it -- left for fresh CI and independent review per the standard required-fresh-CI-then-merge rule. The next run (or Jeremy) should: (1) query live PR/issue state first as always, including automated-review threads on anything merged very recently -- this has now found a real unresolved finding on four consecutive checked merges; (2) once CI is green on PR #388 and it is mergeable with no unresolved review threads, merge it; (3) then pick the next #305 'Areas to review' item (layout/information-density, error/empty/loading states) or re-check #304's human-only lane; (4) seriously consider #193's suggestion of gating autonomous merges on automated-review completion, not just green required-workflow checks, since this exact gap has now recurred four times running."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking the most recently merged PR's review threads is part of querying live state, not optional -- do this even when 0 PRs are open. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true (or is explicitly flagged for re-verification) whether read a minute or a week later, after the PR opens, and after it merges."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

