active_change:
  pr_number: 461
  branch: "claude/blissful-einstein-8ca5ol"
  issue: 457
  purpose: "Add a Review & Promote Timing button to the Song Workspace Next-best-action card, enabled only while next_step_id == \"shared-timeline\": builds the exact current shared-timeline candidate, confirms authority role/track/method/confidence/offset/warnings with the human, then calls promote_shared_timeline(project, expected_candidate=candidate) so a change to the underlying alignment between review and confirmation fails closed. The pre-existing promote_shared_timeline() backend and the buried Timeline-tab button in TimingReviewSongWorkspaceWindow are unchanged; this only adds a discoverable path from the card GuidedDesktopApp actually routes the user to. PR number recorded once opened."

next_continuation:
  priority: "Human-gated packaged Product Reality confirmations remain outstanding and outrank new roadmap work: (1) the v6 EOF-derived Guitar Pro timing replacement (#431/#455, merged as PR #456), (2) the #453 Official TAB orientation/rotation fix (merged as PR #459/#460), and (3) the #457 shared-timeline promote-button fix from this run, once its PR is merged."
  action: "First, inspect fresh CI/Windows Desktop results for the #457 PR opened from branch claude/blissful-einstein-8ca5ol and repair any findings on the same branch; it must not be merged by an agent session per this repository's convention (leave for a later run's independent verification after fresh green CI and no unresolved review). Separately, whenever a packaged Windows artifact reflecting current main is available, the human should: (a) reopen the representative GP/audio project, run Safe Automatic Steps so v6 invalidates/rebuilds v5 timing, review/promote shared timing, and verify the common Bass/Lead/Rhythm entrance near ~7.109 s, the printed-score B-string fret-8 Lead transition around ~77.756 s, and no later drift; (b) upload a real phone-camera JPEG as an Official TAB page and confirm it renders upright automatically, that Rotate left/right works in the correct directions, and that the chosen rotation is remembered after navigating away and back; and (c) once a project reaches the shared-timeline step, confirm the Next-best-action card's Review & Promote Timing button is visible, shows the expected confirmation summary, and disappears/disables again once promoted. If (a) still disagrees with EOF, keep #431/#455 open and compare the generated EOF first-sync evidence against local EOF recording-clock observations rather than adding a song-specific correction."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. When a mature reference is correct on the same lawful input, establish parity before adding heuristics. Preserve one shared recording clock and do not compensate for a failed timing result by hand. Before starting new roadmap work, check for in-flight branches/PRs on the same issue (authored by any account, not just prior agent sessions) and build on real unfinished work instead of duplicating or ignoring it."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

