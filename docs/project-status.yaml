next_continuation:
  priority: "P1-existing PR #361 (fixes current-milestone Product Reality blocker #360) pushed with correctness fixes this run, awaiting fresh CI on the new head; #304's remaining work beyond #360 is a waiting-human lane, not a blocker"
  action: "This run found PR #361 (branch agent/fix-360-recording-boundary) open with CI green on its original head (deb3cd8) but three unresolved automated-review threads from Codex, two of which were verified-real correctness bugs undermining the PR's own recording-boundary guarantee (see active_pr.this_run_additional_fixes above for full detail) and one a stale-documentation finding (this file). All three are fixed in this run's commit on the same branch, with two new regression tests added and the full suite (1313 tests) verified locally. The next scheduled run should: (1) query live PR/issue state first as always; (2) check PR #361's CI on the new head -- if CI, Windows Desktop are both green, mergeability is clean, and no new unresolved review threads exist, merge it; if CI fails, diagnose the actual failure before assuming it is environmental; (3) once #361 merges, #360 and thus the current #304 active defect are resolved -- re-check #304 for any other open comment-reported defects, and if none remain besides the waiting-human packaged-Windows retest lane, resume #305 by adopting the shared design tokens/semantic-status styles in one more real screen (the Sources tab's rights/provenance status in song_workspace_ui.py's _refresh_sources, currently one plain unstyled text blob, is a concrete next candidate; Song Workspace layout/information-density and error/empty/loading states remain open too); (4) if a human has since performed the #304 packaged retest and reported results, act on those findings first ahead of further #305 work."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green -- CI passing does not by itself mean a PR is safe to merge. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

