  pr_number: 706
  branch: "claude/vigilant-bardeen-ow62wo"
  merge_sha: "c56bfc86266db6534a138cd90b5b344b2a3e1678"
  purpose: "Issue #612 slice 6 (expand the Private Local Product Reality Runner to XML/PSARC structural acceptance, Official TAB persistence, printed-score recognition evidence, and other repeat Product Reality checks): PSARC and Official TAB registration were already wired in prior PRs; this change added the remaining printed-score recognition evidence check named in that slice. Also advances #511/#429 by giving printed-score recognition/practice acceptance deterministic completeness tracking, so a human is not asked to re-verify whether every recognized page has already been reviewed."
  behavior_change: "Added product_reality_printed_score.py, a sanitized adapter mirroring product_reality_official_tab.py's pattern: given a project, it discovers every persisted printed-score recognition candidate set under derived/printed-score/recognition/, computes each one's existing self-referential quality metrics (score_recognition_quality_metrics.summarize_candidate_set_quality), and matches each candidate to its review record (printed_score_review's existing page-{NNN}-{sha[:12]}-review.json identity) to determine whether every measure has left 'pending' status. Wired into private_product_reality.collect_shared_timing_observation/evaluate_shared_timing_observation as a new printed_score_recognition check folded into the same evidence bundle as psarc_registration/official_tab_registration: a project with no recognition directory is left unchecked (not applicable, same contract as the other two adapters); an unreadable/invalid candidate file or any still-pending page is REVIEW_REQUIRED (recognition stays evidence, not authority, per PROJECT_PLAN.md rule 23); only a project where every registered candidate page has completed human review is PASS. No page images, private paths, recognized note/fret content, or reviewer notes leave the local evidence boundary. No export, timing, or UI behavior changed."
  verification: "This session ran the canonical preflight (scripts/quality_preflight.py) on the exact pushed head 5926ec5 before opening the PR, using a freshly built Python 3.12 venv (python3.12 -m venv + pip install -e '.[dev]', plus the system python3-tk package): automation-readiness check, full pytest (2130 passed, up from main's 2123 plus 7 new tests for this change), `cdlc --help`, `pip check`, and both whitespace `git diff --check` forms all passed. Fresh PR CI then ran and all required/configured checks (CI, Windows Desktop, Golden Verification, Security - TruffleHog, Execution Director, Control Plane, Preflight) succeeded on the exact head with mergeable_state clean and no blocking review comments/threads (one advisory chatgpt-codex-connector[bot] comment reported it was over its own usage limit and performed no review); this session marked the draft ready and merged it itself per automation_contract.merge_rule as c56bfc8. No packaged Windows/real private printed-score-project confirmation was performed (no Windows/display hardware or real private printed-score recognition/review artifacts in this sandbox); exercising this check against a real project still requires Jeremy's local printed-score workflow."

