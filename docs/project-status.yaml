completed_foundation_summary:
  - "Printed-score recognition completeness re-verification is now wired into the Private Local Product Reality Runner (private_product_reality.collect_shared_timing_observation): every persisted recognition candidate set under a project's derived/printed-score/recognition/ directory is automatically summarized (product_reality_printed_score.collect_printed_score_recognition_evidence()) and a PASS/REVIEW_REQUIRED printed_score_recognition check is folded into the same evidence bundle as the psarc_registration/official_tab_registration checks: PASS only once every registered candidate page has completed human review (recognition remains evidence, not authority); an unreadable/invalid candidate or any still-pending page is REVIEW_REQUIRED; projects with no recognition directory are left unchecked. This closes issue #612 slice 6's last named check -- PSARC, Official TAB, and printed-score recognition are all now wired into the runner"
  - "The iPhone Mobile Product Reality review harness (issue #569) has all four originally-scoped slices implemented: `cdlc-product-reality --mobile-review PATH` runs a scenario and builds a privacy-safe report (build_mobile_review_report()) that (Slice 1) computes true beat-unit phase behind a digest-verified tempo_map/tempo_map_sha256 pair failing closed to UNKNOWN on any mismatch, (Slice 2) includes deterministic, reproducibly-ordered timeline landmarks (mobile_timeline.build_mobile_timeline_landmarks) rendered as a table, (Slice 3) surfaces sanitized EOF recording-clock differential evidence (classification, first-playable delta, error stats) when authoritative EOF evidence exists, and (Slice 4) can record an explicit human PASS/FAIL/FLAG locally (mobile_review_result.py) bound by identity hash to the exact commit/scenario/arrangement/tempo-map, hard-failing any record that claims mobile review cleared desktop/Rocksmith Product Reality. render_mobile_review() renders the self-contained responsive HTML artifact with no commercial/private source bytes. Remaining #569 scope is interactive synchronized scrub/timeline visualization only."
  - "Official TAB registration re-verification is now wired into the Private Local Product Reality Runner (private_product_reality.collect_shared_timing_observation): a registered project's manifest is automatically re-checked via product_reality_official_tab.collect_official_tab_registration_evidence() and a PASS/FAIL/REVIEW_REQUIRED official_tab_registration check is folded into the same evidence bundle as the shared-timing/psarc_registration checks (REVIEW_REQUIRED for an unreadable/schema-invalid manifest or one that currently registers zero pages); unregistered projects are left unchecked"
  - "Deterministic printed-score recognition quality metrics (score_recognition_quality_metrics.summarize_candidate_set_quality) are now visible in three places: `cdlc-score-bundle recognize-measures --quality-summary`, the tkinter-free printed_score_quality_ui_model.build_recognition_quality_ui_lines(), and directly in the live PrintedScoreReviewWindow's 'Recognition quality summary' panel. Given a PrintedScoreRecognitionCandidateSet, computes clean-measure fraction, low-confidence/ambiguity event counts and fractions, mean event/measure confidence, and total warning count -- purely from recognizer output, no ground truth or human/model judgment required"
  - "Deterministic Arrangement Preview playback-clock diagnostics (arrangement_preview_clock_diagnostics.analyze_playback_clock_samples), now wired live into PlaybackSongWorkspaceWindow._poll_playback (song_workspace_playback_ui.py): given (wall_clock, position) poll samples, flags backward jumps, stalls, and sustained real-time speed mismatch with no audio hardware, Windows, or tkinter required for the detector itself, and a real anomaly observed during actual playback now persists a desktop_diagnostics.jsonl entry (deduplicated per anomaly episode)"
  - "PSARC staging/registration re-verification is now wired into the Private Local Product Reality Runner (private_product_reality.collect_shared_timing_observation): every scenario run automatically calls build_staging.verify_psarc_registration() for its project and folds a PASS/FAIL psarc_registration check into the same evidence bundle as the shared-timing checks; unregistered (pre-packaging) projects are left unchecked, unreadable receipts are REVIEW_REQUIRED"
  - "PSARC staging/registration re-verification (build_staging.verify_psarc_registration / `cdlc verify-psarc-registration`): given an already-registered project, deterministically re-checks the staged PSARC's hash and 32-byte header, the build readiness manifest's hash, the DLC Builder project's hash, and every registered input asset's path/size/hash against current on-disk state, reporting PASS or a coded FAIL drift list without mutating any project state; requires no Windows, live Rocksmith, .NET bridge, or private files"
  - "Rocksmith XML structural self-consistency validation (rocksmith_xml_structural_validation.py): every built song-XML ElementTree is checked, before it is ever written to disk, for count-attribute/child-element agreement and for exactly-once required <song> children; both build_rocksmith_bass_xml and build_rocksmith_guitar_xml fail closed via RocksmithXmlStructuralError on any mismatch, covering the reviewed and legacy-chart export paths alike since both funnel through these two builders"
  - "Immutable ingest, normalization, beat/tempo analysis, and audio-derived Bass transcription"
  - "Guitar Pro 3-5 and MusicXML complete-score intake with explicit Bass/Lead/Rhythm role mapping"
  - "Shared score fan-out, score-to-recording timing, reviewed authority, and provenance-aware arrangement editing"
  - "Bass reconciliation/fret mapping and Lead/Rhythm shared-score materialization"
  - "Validation-gated Rocksmith XML authoring, DLC Builder staging, and PSARC registration/verification"
  - "Packaged Windows desktop with Song Workspace, timeline transport, review queue, arrangement preview, diagnostics, and authoring UI"
  - "EOF reference/parity program with growing differential regression coverage"
  - "Private printed-score practice and local Ollama candidate recognition with fail-closed human promotion"
  - "Private Local Product Reality Runner v1 with build-bound timing evidence and two-measure-late regression protection"
  - "Unattended Windows-idle Product Reality worker (PR #618) turning routine deterministic laptop checks into ONIDLE-scheduled evidence with sanitized, advisory-only local Ollama diagnosis"

