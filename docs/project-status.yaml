automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-23T03:26:46Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot. Both merge-before-review-fix gaps previously tracked here are now closed: PR #384 (fix/p383-p1-findings) merged 2026-08-23T02:43:23Z, and PR #362 (agent/fix-360-review-followup) merged 2026-08-22T23:32:13Z. This run found 0 open PRs and 0 blocking issues, so it picked the next #305 slice named below in important_open_issues #305 (Sources tab rights/provenance status) and pushed it as active_pr."
  recently_merged_pr:
    number: 384
    title: "Fix 4 P1 review findings from #383 (Bass mark gating, mark identity, stale receipts)"
    merged_at: "2026-08-23T02:43:23Z, merged to main (head branch fix/p383-p1-findings)"
    behavior_change: "Bass wrong-marks now block packaging like Lead/Rhythm; human-review-mark identity now also binds to the score fan-out manifest and per-event (MIDI, onset) signature, not score SHA alone; a wrong mark now invalidates any already-staged package for every arrangement including Bass."
  active_pr:
    branch: "claude/nice-einstein-2mlh9k"
    base: "main"
    pr_number: null
    lane: "#305: Sources tab rights/provenance status presentation -- the next slice this file's important_open_issues #305 entry had already named as the good next candidate."
    behavior_change: "New tkinter-free source_rights_status_presentation.py classifies each of the Recording/Complete-score rights/provenance review fields (recording_reviewed, score_reviewed, and score-registered-or-not) into the shared semantic StatusState vocabulary (info/review_required/pass, symbol + label, never color-alone), mirroring score_mapping_status_presentation.py and track_trust_status_presentation.py. song_workspace_ui.py's Sources tab now renders each source's rights status as its own styled label (dark-theme foreground via the existing _status_foreground helper) instead of the prior plain unstyled 'Rights/provenance: reviewed'/'review required' suffix text embedded in one multi-line blob; detail text (SHA-256, filename, format, track count) is unchanged."
    regression_tests: "New: tests/test_source_rights_status_presentation.py (classification: unregistered->info regardless of reviewed flag, registered+unreviewed->review_required, registered+reviewed->pass, non-color-alone symbol+label check). New: tests/test_song_workspace_sources_ui.py, mirroring test_song_workspace_health_ui.py's fake-widget pattern (no live Tk display needed) -- covers recording reviewed/unreviewed, score unregistered/unreviewed/reviewed, asserting both the rendered text and the resolved dark-theme foreground hex. Full suite: python -m pytest -q -> 1367 passed, 0 failed, on Python 3.12 with dev+beat extras (python3-tk installed for local sandbox verification only). Also ran python -m compileall, cdlc --help, and scripts/check_automation_readiness.py -- all clean."
    safety_boundary: "Presentation-only change: no new rights/provenance review authority, no change to what recording_reviewed/score_reviewed mean or how they are set. The Sources tab remains explicitly read-only per its existing disclosure label; source-rights decisions stay an explicit human action elsewhere in the desktop app."
    fix_status: "Pushed to origin as claude/nice-einstein-2mlh9k. Not opened as a PR yet by this run's tooling -- open a PR against main, then follow the standard required-fresh-CI-then-merge rule (do not merge on local verification alone)."
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) plus the #360/#361 and #383 merge-before-review-fix gaps (#362, #384) have merged code fixes. The waiting-human packaged-Windows Bass retest lane described in human_decision_required remains outstanding and is not a repo-wide blocker on parallel #305 work."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation (#340), design-token adoption in the validation dashboard (#341), dark-first visible adoption (#345), click-track discoverability/placement (#351), Score & Mappings role-status (#352), Review Queue severity-status (#353), Track trust panel status (#354), Song Workspace header health/progress-indicator (#356), the dark-theme contrast fix for the #352/#354 status labels (#359), and now the Sources tab rights/provenance status (this run, see active_pr) are merged or pushed. Remaining #305 'Areas to review' items not yet adopted in real screens: Song Workspace layout/information-density, error/empty/loading states, and High-DPI/Windows-11-scaling behavior (unconfirmable without packaged human testing)."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor. Worth watching: a human merging a PR at its CI-green head without waiting for an in-flight automated-review fix is a process gap, not a code defect. It has now recurred twice (#361->#362, #383->#384); if it recurs again, that establishes a repeated pattern worth root-causing here directly (e.g. gating auto-merge on automated review completion) rather than only fixing each instance after the fact."
    - number: 46
      relevance: "Later optional metadata capability, deferred pending a licensing/product decision (see human_decision_required)."

