next_continuation:
  priority: "Open a PR from claude/nice-einstein-2mlh9k against main for the #305 Sources tab rights/provenance status slice (see verified_repository_state.active_pr), then get it through fresh CI and merged. Both prior merge-before-review-fix gaps (#383/#384, #360/#362) are now closed -- no other known blocker remains open in this repo as of this run's live check."
  action: "This run queried live GitHub state first and found 0 open PRs and 0 open blocking issues (issue #304's remaining item is human-only packaged-Windows verification; #305 had an explicitly named next candidate). It picked the #305 Sources tab slice this file's important_open_issues #305 entry had already flagged as the good next candidate, implemented it as a small tkinter-free presentation module plus UI wiring (see verified_repository_state.active_pr for the precise change and regression tests), ran the full test suite locally (1367 passed, 0 failed, on Python 3.12 with dev+beat extras), and pushed it to claude/nice-einstein-2mlh9k -- but left PR creation to this same run's follow-up step and merge to fresh CI, per the standard required-fresh-CI-then-merge rule. The next run (or Jeremy) should: (1) query live PR/issue state first as always; (2) once CI is green and mergeable with no unresolved review threads on the resulting PR, merge it; (3) then pick the next #305 'Areas to review' item (layout/information-density, error/empty/loading states) or re-check #304's human-only lane."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1 findings unfixed on main. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

