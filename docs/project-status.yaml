  - "#305: the Score & Mappings role-status labels (#352) and the Track trust panel status label (#354) now resolve their foreground through the new shared desktop_theme.status_dark_foreground helper instead of the light-background design_tokens.status_style(...).foreground, fixing a low-to-illegible contrast defect against the dark desktop theme -- the same class of bug PR #356 already fixed for the header health indicator and Review Queue severity column, now consolidated into one shared helper so future adoptions have a single obvious correct import"

next_continuation:
  priority: "P2-current-milestone #305 slice open as a draft PR (branch claude/nice-einstein-vkr9da), awaiting fresh CI; #304's remaining work is a waiting-human lane, not a blocker"
  action: "This run's PR (branch claude/nice-einstein-vkr9da; fixes the dark-theme contrast defect described above in desktop_app.py and track_trust_workspace_ui.py, adds desktop_theme.status_dark_foreground as the shared helper, and dedupes song_workspace_ui.py's own local copy to use it too) is open as a draft. Do not merge until fresh CI (CI, Windows Desktop) is green and mergeability/review state are re-verified live. #304's known code-fixable defects (including #357, fixed and merged as #358 since the prior snapshot) are all merged; its only remaining work is the waiting-human packaged-Windows retest lane in human_decision_required, which this and prior automated runs cannot perform (no live Rocksmith installation, no Windows desktop, no human) and which does not block further #305 work. The next scheduled run should: (1) query live PR/issue state first as always; (2) if this PR is GREEN with no unresolved review threads, merge it, then continue #305 by adopting the shared design tokens/semantic-status styles in one more real screen from the still-open 'Areas to review' list noted in important_open_issues -- the Sources tab's rights/provenance status (song_workspace_ui.py's _refresh_sources, currently one plain unstyled text blob) is a concrete, well-scoped next candidate; Song Workspace layout/information-density and error/empty/loading states remain open too; (3) if a human has since performed the #304 packaged retest and reported results, act on those findings first (new #304 comments/child issues if defects were found, or explicit #304 closure evaluation per PROJECT_PLAN.md if it passed cleanly) ahead of further #305 work."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 304
    decision: "Regenerate Bass mapping and validation in the same packaged Windows representative project and report residual failures; this remains a waiting human validation lane. The prior retest reproduced identical historical failures only because stale bass_mapped.json was never re-offered for regeneration; the planner now recognizes it as stale."
  - issue: 46
    decision: "Before implementation, confirm the product/licensing decision and permitted metadata-cache boundary."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
