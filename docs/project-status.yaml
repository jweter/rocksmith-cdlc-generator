schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-21T21:00:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use one representative lawful song + complete structured score in the packaged Windows application to drive normal-path fixes while independent product work continues in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / highest priority"
      action: "Remediate reproducible Product Reality defects. Packaged Bass verification remains a waiting human lane, not a repo-wide freeze."
    - issue: 305
      disposition: "parallel product-progress lane"
      action: "Improve authoring workflow and diagnostics independently of pending human verification while preserving provenance and review authority."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes and regression protection."
    - issue: 46
      disposition: "later capability expansion"
      action: "Optional Apple Music metadata enrichment only after core desktop workflow completion."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-21T21:00:00Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot."
  recently_merged_pr:
    number: 340
    title: "Fix stale project-status.yaml (#304) + #305 deliverable 1: UI audit and design-token foundation"
    merged_at: "2026-08-21T19:51:32Z"
    behavior_change: "Adds the desktop UI audit and shared typography/spacing/semantic-status design tokens, while correcting stale project-status continuity. No existing workflow screen was changed by #340 itself."
    pending_verification: "Regenerate Bass mapping and validation in the same packaged Windows Product Reality project and report whether the prior 97 hard unmapped-note failures remain. No PASS/FAIL is inferred without that evidence."
  active_branch_work:
    branch: "claude/nice-einstein-au7hiw"
    lane: "current milestone / #304 remediation"
    planned_behavior_change: "Bind charts/bass_mapped.json to a mapping_algorithm_version and make the workflow planner treat a mapping produced by an older algorithm as not-complete (re-offering the map-bass step and its regeneration command) instead of trusting file existence alone. Root cause: the #322 audio-only mapping fix corrected the algorithm but a project's already-materialized bass_mapped.json from before that fix had no way to be recognized as stale, so the packaged-app retest in #304 (comment 2026-08-21T00:12:09Z) reproduced the identical historical unmapped_bass_note failures from pre-fix mapping output."
    safety_boundary: "Read-only planning-status change plus a version-stamped field on newly written mappings; no mapping, validation, or packaging authority logic changed. Re-running map-bass already invalidated stale validation/EOF/package derivatives (mapping_pipeline._invalidate_bass_mapping_derivatives); this change only makes the planner actually offer that re-run instead of reporting the stale artifact as complete."
    regression_tests: "tests/test_fret_mapping.py (bass_mapping_is_current), tests/test_workflow_plan.py (test_stale_bass_mapping_reopens_map_bass_step)"
    cross_linked: "#193 (recurring stale-derivative-state-after-upstream-authority-change pattern)"
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella; packaged Bass validation is waiting on human evidence while independent work continues."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation merged in #340; first real-screen adoption is now in progress on the validation dashboard."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor."
    - number: 46
      relevance: "Later optional metadata capability."

completed_foundation_summary:
  - "Immutable ingest and normalization"
  - "Beat/tempo analysis and Bass transcription/mapping"
  - "Guitar Pro 3-5 and MusicXML complete-score intake"
  - "Explicit Bass/Lead/Rhythm mapping and shared score-to-recording timing"
  - "Reviewed timing and provenance-aware arrangement editing"
  - "Rocksmith XML authoring, DLC Builder staging, and PSARC registration/verification"
  - "Packaged Windows desktop executable and Song Workspace"
  - "Transactional provenance-aware undo/redo across accepted review layers"
  - "Human-confirmed multiple source tracks per arrangement role"
  - "Optional Editor on Fire external reference bridge"
  - "Deterministic EOF compatibility evidence and project-local discrepancy reports"
  - "Read-only pitch-correct fretboard candidate/source-position diagnostics"
  - "Project-bound Bass/Lead/Rhythm fretboard diagnostics"
  - "Provenance-bound EOF fret-hand-position observation contract"
  - "Project-bound EOF hand-position evidence validation/currentness status"
  - "#305 deliverable 1: desktop UI audit (docs/ui/desktop-ui-audit.md) and typography/spacing/semantic-status design-token foundation (design_tokens.py, docs/ui/design-system-foundation.md)"

next_continuation:
  priority: "P4-current-milestone / parallel lanes"
  action: "Human lane: once the mapping_algorithm_version PR merges, re-run/re-open the packaged representative project so the planner offers map-bass again (it will now detect the pre-#322 mapping as stale automatically instead of reporting it complete), regenerate Bass mapping/validation, and report residual failures. Product lane: after fresh CI on the validation-dashboard token adoption, continue #305 one primary workflow surface at a time without assuming the pending Bass retest result."
  selection_rule: "Always query live PR state first; a human-only Product Reality gate blocks only dependent work."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 304
    decision: "Regenerate Bass mapping and validation in the same packaged Windows representative project and report residual failures; this remains a waiting human validation lane. The prior retest (2026-08-21) reproduced identical historical failures only because the stale bass_mapped.json was never re-offered for regeneration; that planner gap is now fixed, so re-running the project should surface the actual post-#322 result rather than stale pre-fix state."
  - issue: 46
    decision: "Before implementation, confirm the product/licensing decision and permitted metadata-cache boundary."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
