    lane: "#305 next authoring-workspace slice: Human-reviewed source track trust panel status presentation (Song Workspace)"
    planned_behavior_change: "important_open_issues below (carried from PR #353) named 'Timing/alignment status and confidence/provenance presentation' -- and, by code inspection this run, the Song Workspace's 'Human-reviewed source track trust' panel (track_trust_workspace_ui.py) -- as a still-unadopted #305 'Areas to review' surface: TrackTrustWorkspaceControl.status_text was a bare f-string with no color/symbol differentiation across its unreviewed/current/stale review_state values, exactly desktop-ui-audit.md finding #2. track_trust_workspace_controls.py now adds a status_state field (review_state unreviewed->review_required, current->pass, stale->stale) and builds status_text through design_tokens.format_status() so it always carries a symbol+label. track_trust_workspace_ui.py recolors the panel's status ttk.Label foreground to design_tokens.status_style(status_state).foreground on every refresh (mirroring desktop_app.py's single-label _set_mapping_status pattern from #352, since this panel is one label, not a table/Treeview like #341/#353), and resets to the ttk default color for non-semantic states (no project, no role selected, or a status load error) instead of implying a false status."
