schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-22T21:10:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use one representative lawful song + complete structured score in the packaged Windows application to drive normal-path fixes while independent product work continues in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / highest priority"
      action: "Remediate reproducible Product Reality defects. Packaged Bass verification remains a waiting human lane, not a repo-wide freeze."
    - issue: 305
      disposition: "parallel product-progress lane"
      action: "Improve authoring workflow and diagnostics independently of pending human verification while preserving provenance and review authority."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes and regression protection."
    - issue: 46
      disposition: "later capability expansion"
      action: "Optional Apple Music metadata enrichment only after core desktop workflow completion."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-22T21:10:00Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot. This run found the prior snapshot stale: mcp__github__list_pull_requests confirmed zero open PRs (PR #356 and the subsequent PR #358 shown as active branch work below had both already been merged to main by the time this run started -- b147b06 and faa839c are on origin/main's git log). This run's own default-branch base is faa839c."
  recently_merged_pr:
    number: 358
    title: "Fix unchanged timing confirmation path (#357) (#358)"
    merged_at: "2026-08-22T (see live PR history; verified via git log on default branch, head faa839c)"
    behavior_change: "Fixed issue #357: TimingReviewSongWorkspaceWindow's Confirm beat edits action raised FileNotFoundError instead of succeeding when a user reviewed detector timing unchanged (no review/reviewed_timing.json yet existed and no anchor was locked). promote_reviewed_timing now creates the reviewed-timing artifact from the current detector map on unchanged acceptance instead of requiring a fabricated anchor lock; the raw-path error modal also stopped exposing a bare filesystem path."
    pending_verification: "This run verified via mcp__github__list_pull_requests that zero PRs are open, and confirmed #356 (b147b06) and #358 (faa839c) are both present on main via git log. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) now have code fixes merged; the waiting-human packaged-Windows retest lane in human_decision_required remains outstanding and is not a repo-wide blocker on parallel #305 work."
  active_branch_work:
    branch: "claude/nice-einstein-vkr9da"
    lane: "#305 dark-theme contrast defect fix: Score & Mappings role-status labels and the Track trust panel status label"
    planned_behavior_change: "Code inspection found that two of the four already-adopted #305 semantic-status screens still set their label foreground directly from design_tokens.status_style(state).foreground -- desktop_app.py's _set_mapping_status (#352, Score & Mappings Bass/Lead/Rhythm role rows) and track_trust_workspace_ui.py's _set_track_trust_status_foreground (#354, track trust panel). That token set is tuned for the light backgrounds ttk's native Windows themes use (design_tokens.py's own docstring says so), not this dark-first packaged app's PALETTE -- e.g. status_style('pass').foreground is '#1B5E20' dark green, read against PALETTE.surface '#151A22', which is close to unreadable. PR #356 (merged as #356/b147b06) already fixed the identical defect for the Song Workspace header health indicator and Review Queue severity column, and desktop_theme.configure_desktop_styles already registers the correct dark-theme color on every status.ttk_style_name -- but these two other call sites bypass that registry entirely by setting foreground directly. Added desktop_theme.status_dark_foreground(state), a single shared helper built from the same dark-status-color mapping configure_desktop_styles already used inline (that inline dict was replaced with a call to the new helper, removing the duplication); desktop_app.py and track_trust_workspace_ui.py now resolve their label foreground through it instead of design_tokens.status_style(...).foreground. song_workspace_ui.py's own local _DARK_STATUS_FOREGROUNDS/_status_foreground (the #356 fix) was also refactored to delegate to the new shared helper so there is exactly one dark-status-color mapping in the codebase instead of three near-identical copies."
    safety_boundary: "Presentation-only. No status classification, workflow/mapping/track-trust authority, or review-gate logic changed -- present_mapping_role_status, present_track_trust_status, and every status_state value are untouched; only which foreground color renders that already-computed state changes. Every status label still pairs its color with symbol+label text (never color-alone), unchanged from #352/#354."
    regression_tests: "tests/test_desktop_theme.py (+2 tests): status_dark_foreground matches every color configure_desktop_styles registers on the named Status.*.TLabel ttk styles, and differs from every design_tokens.status_style(...).foreground for every state (pins the contrast fix, not just the new helper's self-consistency). tests/test_desktop_score_tab_layout.py and tests/test_track_trust_workspace_ui.py: updated existing assertions from status_style(...).foreground to status_dark_foreground(...), plus one new explicit regression test per screen asserting the applied foreground differs from the light-theme token. Full suite verified on this change's head: python -m pytest -q -> 1310 passed (1305 baseline + 5 new) with dev+beat extras installed on Python 3.12 (python3-tk installed for local verification only, matching established sandbox-verification precedent); python -m compileall -q src tests, cdlc --help, and python scripts/check_automation_readiness.py all pass locally."
    cross_linked: "docs/ui/desktop-ui-audit.md finding #2 (status communicated as plain/unstyled or inconsistently-styled text); PR #356's identical dark-theme-contrast fix for song_workspace_ui.py's health indicator and review-queue tags, which this slice extends to the two remaining #305-adopted screens that still bypassed it. No new docs/ui/*.md adoption note added: this is a defect fix within already-adopted screens, not a new screen's first adoption (matching #352/#354's own precedent of not adding one for a same-pattern slice)."
    pr_status: "Not yet opened as of this note; opened as a draft PR from this run targeting main. Left for fresh independent CI (CI, Windows Desktop); not merged in this run."
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) now have code fixes merged. The only remaining #304 work is the waiting-human packaged-Windows retest lane described in human_decision_required -- not a repo-wide blocker on parallel #305 work."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation (#340), design-token adoption in the validation dashboard (#341), dark-first visible adoption (#345), click-track discoverability/placement (#351), Score & Mappings role-status (#352), Review Queue severity-status (#353), Track trust panel status (#354), Song Workspace header health/progress-indicator (#356), and this run's dark-theme contrast fix for the #352/#354 status labels are merged/opened. Remaining #305 'Areas to review' items not yet adopted in real screens (verified by code inspection this run): Song Workspace layout/information-density, source audio and score/tab import cards (song_workspace_ui.py's Sources tab still renders rights/provenance review status as one plain unstyled text blob -- a good candidate for the next slice), error/empty/loading states, and High-DPI/Windows-11-scaling behavior (the last is unconfirmable without packaged human testing)."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor. This run's fix is itself an instance of a recurring pattern worth a future #193 cross-link if it recurs again: a #305 status-adoption slice sets a label's foreground from the light-tuned design_tokens.status_style(...).foreground instead of the dark-theme-aware helper, because the light token is the more discoverable/default-looking import. Two of four prior adoptions (#352, #354) had this defect; #353 (Review Queue) and #356 (health indicator) did not, because they used the named ttk style or a local dark-aware helper respectively. Now that desktop_theme.status_dark_foreground is the single shared helper, future adoptions have one obvious correct import to reach for."
    - number: 46
      relevance: "Later optional metadata capability."

