completed_foundation_summary:
  - "Immutable ingest, normalization, beat and tempo analysis, and audio-derived Bass transcription"
  - "Guitar Pro 3-5 and MusicXML complete-score intake with explicit Bass, Lead, and Rhythm role mapping"
  - "Shared score fan-out, score-to-recording timing framework, reviewed timing authority, and provenance-aware arrangement editing"
  - "Bass reconciliation and fret mapping plus Lead and Rhythm shared-score arrangement materialization"
  - "Validation-gated Rocksmith XML authoring, DLC Builder staging, and PSARC registration and verification"
  - "Packaged Windows desktop executable with Song Workspace, timeline transport, review queue, arrangement preview, diagnostics, and dark-first authoring UI"
  - "Transactional provenance-aware review state and stale-derivative invalidation across major generated artifacts"
  - "EOF-derived pre-roll and first-sync semantics with differential regression coverage"
  - "Private Official TAB references remain private and can follow arrangement score bars without becoming musical authority"
  - "Private printed-score Bass practice supports movement-scoped registration, notation/TAB segmentation, local vision candidates, explicit human review/correction, and validated Rocksmith XML plus click-track generation"
  - "Printed-score practice readiness is cryptographically bound to current reviewed authority and generated outputs"
  - "Guitar Pro bend curves (captured at import in SourceBendPoint) now thread losslessly through the full reviewed-authority pipeline into real Rocksmith XML <bendValues>/<bendValue> elements for Bass, Lead, and Rhythm, instead of failing closed on every bent note; see docs/eof-subsystem-parity-matrix.md's Bend strength/curve points rows (issue #414). Post-merge review (#517) found and this repo fixed three follow-on gaps: bend-point timing now remaps through the same piecewise-linear reviewed timing curve as the note's own endpoints (including a second rebasing pass when exact-tie folding extends a primary note's duration), a captured point-level vibrato flag fails closed instead of being silently dropped, and Bass/Lead/Rhythm now set the arrangement-level bends property when an exportable curve is present. Not yet packaged-verified against real Rocksmith import/playback."
  - "Guitar Pro pitched (shift/legato) slides now resolve their implicit destination fret (the next note on the same string) at import and thread it losslessly through the full reviewed-authority pipeline into the real Rocksmith XML slideTo attribute and slides arrangement property, instead of failing closed on every slid note; see docs/eof-subsystem-parity-matrix.md's Pitched/Shift-vs-legato slide rows (issue #414, PR #520). The four target-less into/out slide subtypes (intoFromAbove/intoFromBelow/outDownwards/outUpwards) have no PyGuitarPro-exposed target and remain unresolved/unexported (see the Unpitched slide row). Not yet packaged-verified against real Rocksmith import/playback."
  - "Fixed a genuine post-#520 gap: every resolved pitched Guitar Pro slide exported identically regardless of shift-vs-legato subtype, silently dropping Rocksmith's linkNext distinction. EOF's own gp_import.c maps only the 'legato' slide-type bit to EOF_PRO_GUITAR_NOTE_FLAG_LINKNEXT (never 'shift'); a new additive SourceNoteEvent.link_next field, set only alongside a resolved slide_target_fret for a legato slide, now threads through the same reviewed-authority layers as slide_target_fret and exports as the real linkNext=\"1\" note/chordNote attribute for Bass, Lead, and Rhythm. See docs/eof-subsystem-parity-matrix.md's Pitched slide/Shift-vs-legato slide/Link-next rows (issue #414). Link-next remains PARTIAL, not PARITY: EOF's tie-note-introduces-a-new-technique and grace-note slide-in LINKNEXT sources are separate and still unaudited. Not yet packaged-verified against real Rocksmith import/playback."
  - "Fixed a severe pre-existing export gap, not a cosmetic one: any note carrying the generic hammer_on_pull_off technique (essentially every hammer-on/pull-off in any Guitar Pro source, since MusicXML already resolved its own explicit hammer_on/pull_off labels but neither importer's output was exportable) failed the entire reviewed-authoring handoff to Rocksmith XML with 'not losslessly supported yet: hammer_on_pull_off' -- Guitar Pro tabs contain hammer-ons/pull-offs pervasively. guitarpro_import._resolve_hammer_pulloff_direction() now resolves Guitar Pro's single ambiguous hammer bit into the specific hammer_on/pull_off labels MusicXML already emitted directly, by comparing each flagged note's fret to the immediately preceding same-string note's fret -- the identical comparison raynebc/editor-on-fire's own gp_import.c performs (audited at commit c0d88eabf7b00b0bd2cac9414df9fa9c6b3e7100) to set EOF_PRO_GUITAR_NOTE_FLAG_HO vs _PO. A note with no preceding same-string note, or an equal fret, is left as the generic hammer_on_pull_off label and continues to fail closed, matching the unresolved-slide/bend pattern. Both labels now export as real hammerOn=\"1\"/pullOff=\"1\" note attributes plus the hopo arrangement property for Bass, Lead, and Rhythm. See docs/eof-subsystem-parity-matrix.md's Hammer-on / pull-off row (issue #414). Not yet packaged-verified against real Rocksmith import/playback."
  - "Fixed a real PSARC round-trip regression, not a new feature: psarc_import._note_techniques() already read the RS2014 XML mute (fret-hand-mute), slap, and pluck note attributes on re-import, but produced technique labels ('pinch_harmonic' for harmonicPinch; 'fret_hand_mute'/'slap'/'pluck' themselves) that neither reviewed_techniques.SUPPORTED_TECHNIQUES nor rocksmith_xml.DIRECT_NOTE_TECHNIQUES recognized, so a note re-imported from an already-valid Rocksmith PSARC would fail human review acceptance or silently fail to re-export those attributes. Also fixed a genuine value bug: RS2014's slap/pluck attributes are ternary (-1 not applicable, 0 applicable-but-not-played, 1 played), matching the sibling tap attribute's own check in the same function, but the slap/pluck checks previously excluded only '-1', misreading every explicit not-slapped/not-plucked bass note ('0') as carrying the technique. All four labels now round-trip losslessly end-to-end. See docs/eof-subsystem-parity-matrix.md's Tap and Muted/string-muted notes rows (issue #414, PR #530). GP-side import of slap/pop from scratch remains out of scope: EOF's own gp_import.c reads that beat-level byte only for a debug log and sets no note flag (no mature behavior to port). Not yet packaged-verified against real Rocksmith import/playback."
  - "Wired the existing, already-audited EOF short-note/staccato/mute sustain-truncation advisory check (eof_short_note_truncation_check.py, docs/integrations/EOF_PARITY_ROADMAP.md item 8) into a real entry point: it and its rest-boundary/export-boundary/note-endpoint-resnap sibling checks were previously reachable only from their own unit tests, with no CLI command or project-scoped writer. New src/rocksmith_cdlc_generator/eof_short_note_truncation_project.py resolves the project's own registered GP score and writes review/eof_short_note_truncation_report.json, following the same project-local/source-bound/advisory-only pattern as eof_project_report.py; cdlc-eof --check-short-note-truncation exposes it alongside the existing --compare-fixture/--compare-recording-clock-fixture/--compare-score/--validate-hand-positions operations. Directly requested as the next post-rule-pack adoption slice in issue #414's own comment ('Follow with GP duration/gap/staccato and endpoint parity'). Purely additive: no import/export behavior changed, no canonical chart state is touched. Verified with unit tests (test_eof_short_note_truncation_project.py, extended test_eof_cli_score_compare.py) and a manual end-to-end CLI smoke run against the existing synthetic.gp5 fixture. The companion rest-boundary/export-boundary/note-endpoint-resnap checks remain unwired and are the natural next slice of this same integration gap."
  - "Closed the docs/eof-subsystem-parity-matrix.md 'FHP range/width' UNASSESSED row (issue #414, P0): new eof_fret_range_tolerance_check.py ports src/rs.c's eof_note_can_be_played_within_fret_tolerance (with src/note.c's open-string-aware lowest/highest-fret helpers), EOF's mature rule for whether a chord/note can be played without moving the fretting hand, against EOF's own default uniform-4-fret tolerance table (src/main.c). Deliberately excludes the barre-chord same-position exemption (depends on an EOF string-bitmask ordering convention this project's note model does not expose), EOF's dynamic/user-widened tolerance tables, the beat-level tap/slap/pop exemption, and the entire fingering/slide/arpeggio-phrase/capo/RS-phrase-boundary position-generation heuristic (eof_generate_efficient_hand_positions_logic) -- so it reports a lower bound on required hand-position relocations, not EOF's exact count or placement; see docs/integrations/EOF_PARITY_ROADMAP.md item 14 for the full citation and exclusions. Confirms a real, previously undocumented gap: rocksmith_xml.py unconditionally writes <anchors count=\"0\"/> for every difficulty, so any arrangement with fretted content is missing every fret-hand-position EOF's own default preferences would require. Wired into cdlc-eof as --check-fret-range-tolerance, writing review/eof_fret_range_tolerance_report.json, following the same project-local/source-bound/advisory-only pattern as its siblings; never selects, writes, or rewrites any fret-hand-position, note, timing, review, or validation state. Verified with 21 new unit/project tests (test_eof_fret_range_tolerance_check.py, test_eof_fret_range_tolerance_project.py) plus the full existing suite. Not yet packaged-verified against real Rocksmith import/playback (Product Reality: whether Rocksmith import/playback is materially degraded by an arrangement with zero fret-hand-positions, as opposed to merely a documented editor-side omission, remains unverified)."
  - "Closed the docs/eof-subsystem-parity-matrix.md 'Triplet feel' UNASSESSED row (issue #414, P1) with no code gap: audited raynebc/editor-on-fire's current master (commit 4a724f4b068b4dd11a71a4b688707a0ed35b6563, per that row's own instruction to check current upstream rather than the older pinned c0d88eabf7 snapshot or the xmist001 fork, given a May 2026 rewrite flag); eof_load_gp() still reads the GP measure-header triplet-feel byte only for a debug-log line and never assigns or reuses it, applying no timing transform. PyGuitarPro's own Duration.time derives tick length purely from notated value plus dotted/tuplet divisor, independent of tripletFeel, and guitarpro_import.py:convert_guitarpro_song() never reads measure.header at all -- this project already matched EOF's own no-op reference behavior. Closed as PARITY. Verified with a new regression test, test_gp_import_ignores_measure_header_triplet_feel (tests/test_guitarpro_import.py), locking down that imported note timing is unaffected by tripletFeel. See docs/integrations/EOF_PARITY_ROADMAP.md item 15."

