  recently_merged_pr:
    number: 474
    title: "Support composed multi-track arrangements in EOF export boundary check (#414)"
    merged_at: "2026-08-30T21:40:00Z"
    behavior_change: "Extends src/rocksmith_cdlc_generator/eof_export_boundary_check.py (PR #472's item-B third slice) to support a Lead/Rhythm arrangement composed from more than one contributing registered-score track, which was previously reported as undeterminable. compute_eof_export_boundary_check now takes track_indices (a sequence) instead of a single track_index; _resolve_source_track_indices (renamed from _resolve_single_source_track_index) returns every distinct literal contributing track instead of raising when more than one is present. Each contributing track's own explicit rests and EOF-truncatable notes are computed independently and matched only against materialized notes whose resolved source_track_index equals that same literal track -- never against another contributing track's unrelated passage -- before results are pooled into one EOFExportBoundaryReport (track_indices: tuple[int, ...] replaces the old scalar track_index field). A materialized note whose contributing track is not among the declared track_indices still fails closed. No new EOF upstream inspection was needed; reuses the same pinned commit already audited for #466/#468/#472. Also updated docs/integrations/EOF_PARITY_ROADMAP.md, docs/eof-subsystem-parity-matrix.md, and THIRD_PARTY_NOTICES.md."
    verification: "Exact head f85a0df5f96c74f041fd42ea5a24569e71c4ea91 passed Python 3.12 tests, Windows desktop app, Windows 3.12 + PSARC bridge, and Secret leak scan before merge as 9c272ee40a7b8be82d4a6d9ff905a9db5522a5cd. tests/test_eof_export_boundary_check.py grew from 17 to 21 cases (including a cross-track false-positive regression and a per-track truncation-matching case), all passing; full local suite 1579 passed, 0 failures (with [dev,beat] extras installed)."
  previously_merged_pr:
    number: 472
    title: "Add EOF-derived generated/exported arrangement output boundary check (#414)"
    merged_at: "2026-08-30T18:52:00Z"
    behavior_change: "Adds src/rocksmith_cdlc_generator/eof_export_boundary_check.py, an advisory-only check that re-applies the already-audited explicit-rest (eof_rest_boundary_check.py) and short-note/staccato/mute truncation (a newly-extracted eof_truncation_decision() helper from eof_short_note_truncation_check.py) EOF rules against reviewed_export_events.reviewed_export_arrangement's post-reconciliation/post-materialization notes -- the same read model every Bass/Lead/Rhythm authoring path consumes toward the Rocksmith XML boundary -- rather than only directly-imported note data. Explicit rests are projected through the promoted reviewed timing map and checked against every materialized note's reviewed-time interval; truncation predictions are matched to their materialized counterpart by source-relative onset time and pitch (not string/fret, which Bass reconciliation may re-voice) and are themselves projected through reviewed timing before comparison. A composed multi-track Lead/Rhythm arrangement or an unmatched truncatable note is reported as undeterminable rather than guessed at or silently skipped (later closed by #474). No new EOF upstream inspection was needed; reuses the same pinned commit already audited for #466/#468. Also updated docs/integrations/EOF_PARITY_ROADMAP.md, docs/eof-subsystem-parity-matrix.md, and THIRD_PARTY_NOTICES.md."
    verification: "Exact head 2500b61c1e01b68cd5de39eaa518891f5cc0652f passed CI, Windows Desktop, Windows 3.12 + PSARC bridge, and Secret leak scan before merge as e5e8ed681eb6c9767b4eb223d0fbd8b9f27d401f. New tests/test_eof_export_boundary_check.py (17 cases) passes; full local suite 1575 passed, 0 failures."
