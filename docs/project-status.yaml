schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-09-13T03:30:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md. This is a continuity cache; live GitHub state, code, CI, and the canonical roadmap outrank it."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring and without using the user as a routine test harness."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Drive real-song correctness while moving deterministic Product Reality verification from repeated human laptop sessions into repository tests, Windows automation, and the unattended private local worker."

roadmap_issue_queue:
  ordered_items:
    - issue: 612
      disposition: "current-milestone human-test retirement and unattended private Product Reality automation"
      action: "Keep converting deterministic private-song checks into unattended local evidence; after the Windows worker slice, broaden machine acceptance into validation/XML/PSARC and safe external-game smoke where feasible."
    - issue: 511
      disposition: "printed-score musical-recognition correctness blocker"
      action: "Validate dense printed TAB by independently extracting TAB fret/string evidence and standard-notation rhythm, reconciling them fail-closed before human promotion."
    - issue: 429
      disposition: "private printed-score practice Product Reality acceptance"
      action: "Use private/local automation first; reserve a person only for materially ambiguous notation or final musical judgment that deterministic checks cannot establish."
    - issue: 431
      disposition: "shared timing Product Reality acceptance"
      action: "Use the private Product Reality runner and automatic recent-project timing qualification to prove the first entrance, later landmark, and no-drift behavior without asking the user to measure timestamps again."
    - issue: 455
      disposition: "EOF-derived timing parity acceptance"
      action: "Keep the EOF-derived timing path authoritative, require automated representative evidence, and never add a song-specific offset."
    - issue: 453
      disposition: "official TAB image acceptance"
      action: "Automate orientation/persistence checks where possible; retain human review only for visual ambiguity that cannot be established deterministically."
    - issue: 435
      disposition: "private reference mapping acceptance"
      action: "After timing is machine-verified, confirm lawful private reference mapping with the smallest remaining human-only judgment."
    - issue: 305
      disposition: "parallel Windows authoring-workspace hardening"
      action: "Continue measurable usability and recovery improvements without weakening validation, provenance, or review boundaries."
    - issue: 414
      disposition: "standing mature-reference parity and reuse program"
      action: "Inspect Editor on Fire and adjacent Rocksmith tooling before inventing deterministic authoring behavior; port or adapt proven semantics with attribution and regression protection."
    - issue: 193
      disposition: "standing recurring-defect/root-cause program"
      action: "Convert recurring failures into durable regression coverage and stale-state prevention rather than repeated symptom testing."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after CI and Windows Desktop both succeed, mergeability is resolved, blocking review findings are addressed, and no material correctness, safety, licensing, provenance, privacy, or product concern remains."
  product_reality_rule: "Zero humans for facts a computer can measure. A deterministic defect found by a human must gain automated regression/acceptance coverage before the same fact is requested from the human again."

active_change:
  pr_number: 618
  branch: "agent/unattended-local-worker-v1"
  purpose: "Run private Product Reality and timing-health checks unattended on Windows idle, with local Ollama advisory diagnosis on deterministic failures."
  acceptance: "Exact-head repository CI plus Windows Desktop packaged smoke. No manual laptop retest is required for this implementation slice."

verified_repository_state:
  checked_at: "2026-09-13T03:30:00Z"
  main_sha_before_active_change: "744065e3e050524223e7dd0fae30ded623d8a5f3"
  durable_state:
    - "PR #616 is merged and provides the build-bound Private Local Product Reality Runner with PASS/FAIL/REVIEW_REQUIRED evidence and a synthetic regression for the ~4.64 s/two-measure timing defect class."
    - "AGENTS.md and Product Reality policy now require zero humans for deterministic measurable facts and prohibit repeated manual checks when an automated lane exists."
    - "The active #612 Windows slice registers/refreshed a current-user ONIDLE task from the normal desktop entry point, exposes packaged --unattended-worker and cdlc-local-worker execution paths, stores local latest/history evidence, and runs without GUI navigation."
    - "The active worker can run configured private scenarios and also perform zero-configuration recent-project timing qualification against current shared timing authority using existing audio-derived Bass onset evidence."
    - "Local Ollama remains advisory only: deterministic Python measurements own status; Ollama is restricted to loopback and receives sanitized derived evidence, not private media, source bytes, paths, PSARCs, Steam data, or private source hashes."
