  behavior_change: "build_recognition_quality_ui_lines() now renders 'Clean measures: n/a (0/0)' when measure_count == 0, instead of the misleading '100.0%'. Populated results are unaffected. Presentation-only; no recognition/musical/timing/authority change."
  verification: "The fix's two commits (6e82c98, 88a0e93) were already implemented and tested by another agent session on branch agent/fix-empty-quality-summary but not yet promoted to a PR; this session verified them (targeted tests, full suite, and canonical preflight all GREEN at the exact existing head) without adding new commits beyond an active_change docs update, then opened PR #645 from that same branch rather than duplicating the implementation. Fresh PR CI on the exact final head (51ca573) showed all observed check runs succeeding (Windows desktop app, Windows 3.12 + PSARC bridge x2 duplicate triggers, Python 3.12 tests x2, Control Plane Contract, Secret leak scan, golden-song-v1, plan, Canonical preflight) with mergeable_state clean, no reviews, and no comment threads, so this session merged PR #645 itself per automation_contract.merge_rule. GitHub confirmed merged=true at merge_sha above before this reconciliation was written."

