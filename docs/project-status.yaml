previously_merged_change:
  pr_number: 661
  branch: "claude/vigilant-bardeen-1vhv8i"
  merge_sha: "f32d4f9e68a74026b5b36b70422f3a37283eb01b"
  purpose: "Close the dead-code gap in mobile_product_reality.py: render_mobile_review() (issue #569 Slice 1's iPhone-Safari-readable Product Reality review artifact) existed and was unit-tested but had no producer, so it was reachable only from its own tests."
  behavior_change: "Adds build_mobile_review_report(), which maps an already-evaluated PrivateProductRealityEvidence (from the existing #612 Private Local Product Reality Runner) onto the mobile report contract. The automated result, failed checks, and each role's first-event baseline reuse evidence.checks directly; per-checkpoint drift is instead recomputed from each checkpoint observation's own observed/expected seconds plus that same first-event baseline (not looked up via a reconstructed `checkpoint_{id}_drift` code string, which a checkpoint id ending in \"_drift\" can collide with) -- either way the values are the same authoritative inputs/outputs evaluate_shared_timing_observation() itself used. Wires it into `cdlc-product-reality` via a new optional --mobile-review PATH flag that writes the rendered HTML alongside the existing JSON evidence. Beat-space phase is deliberately left UNKNOWN (evidence only carries seconds; labeling seconds as beats would misstate musical position) -- left for a follow-up slice (see next_automation_slices). No desktop UI, Windows, or private-media path is touched. Four rounds of Codex review on this PR found and this session fixed eleven real P2 defects in the adapter/renderer: (1) a role whose observation collection failed was silently dropped instead of getting a card, (2) evidence.result/failed checks were not surfaced so a deterministic FAIL could look identical to a clean artifact, (3) only the last checkpoint's drift was considered per role instead of the worst, (4) a checkpoint id ending in \"_first_event\" could fabricate a phantom arrangement card, (5) the report was not bound to evidence.scenario_sha256 so two differently-configured scenarios sharing a scenario_id would look identical, (6) the renderer could claim \"All deterministic checks passed\" when no automated result had actually been supplied, (7) reconstructing a `checkpoint_{id}_drift` code string to look up a checkpoint's drift could collide with another checkpoint's own base check sharing the same code (e.g. ids \"verse\"/\"verse_drift\") and silently misattribute an unrelated absolute-time error, (8) collection_* check messages copied raw caught-exception text verbatim, which can embed absolute private project paths, into the artifact advertised as privacy-safe, (9) the report was not bound to the measured evidence run (observed_at_utc/project recording/tempo map hashes), so re-measuring the same scenario after the recording or tempo map changed looked identical to a stale prior run, (10) the psarc_registration check's raw drift message (from build_staging.verify_psarc_registration(), not the sanitized adapter) could also embed absolute private paths, (11) this durable-state note and the build_mobile_review_report() docstring described drift as reused from evidence.checks after the (7) fix had already changed it to a recomputation -- corrected before merge. All eleven have regression tests or (11) a corrected description."
  verification: "Fresh PR CI GREEN on exact merged head b593f6b (all 8 checks including required CI and Windows Desktop workflows); canonical full preflight GREEN locally at the same head (28 targeted tests in tests/test_mobile_product_reality.py + tests/test_private_product_reality.py, covering all eleven Codex findings; scripts/check_automation_readiness.py PASS). All twelve review threads replied-to and resolved. Merged by this session per automation_contract.merge_rule as merge commit f32d4f9e68a74026b5b36b70422f3a37283eb01b."

