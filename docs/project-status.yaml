status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one structured score, when available, producing the subset of reviewed playable Bass + Lead + Rhythm arrangements actually present in that score with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use representative lawful songs and structured scores in the packaged Windows application to drive normal-path correctness fixes while review/source tooling improves in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / evidence-driven defect remediation"
      action: "Retest the current v5 leading-rest-aware shared timing authority in a fresh packaged Windows build, including first-event timing and the later printed-score Lead transition."
    - issue: 431
      disposition: "current Product Reality timing blocker"
      action: "The workflow-planner defect that silently skipped re-running alignment after a refinement-algorithm upgrade (ERR-2026-005) has landed on main. Rerun Safe Automatic Steps on the representative project to determine whether align-tab now actually re-executes the v5 leading-rest refinement, and whether that refinement preserves the written intro rests and removes the shared Bass/Lead/Rhythm late projection without drift. This retest requires the private representative project/recording and packaged Windows build, so it remains a human/product step."
    - issue: 437
      disposition: "implemented diagnostic capability / local evidence pending"
      action: "Exercise EOF recording-clock parity against lawful local observations so final mapped timing can be compared directly to EOF rather than only source-relative score interpretation."
    - issue: 438
      disposition: "implemented diagnostic capability / local evidence pending"
      action: "Compare the registered Guitar Pro score with the alternate lawful private score and retain both as evidence without changing registered source authority."
    - issue: 435
      disposition: "implemented on main / packaged acceptance pending"
      action: "One private official TAB page can already be mapped to every applicable Bass/Lead/Rhythm role without duplicate image imports. Confirm this in a packaged build: import one page once, select every applicable arrangement, and switch Bass/Lead/Rhythm in Arrangement Preview to verify each role follows the same page/bar evidence."
    - issue: 446
      disposition: "implemented on main / GitHub issue not yet closed"
      action: "The reported MPO/JPEG rejection is fixed: the uploader normalizes Pillow's decoded MPO container for .jpg/.jpeg inputs (using the first frame as the printed page) while still rejecting a genuine MPO container mislabeled as .png, and both paths have deterministic regression coverage. The fix landed as a commit directly on the default branch, so GitHub's closing-keyword automation never closed the issue even though the defect is resolved in code. Verify against a real phone-camera capture and close the issue, or comment with the landing commit if a packaged retest is wanted first."
    - issue: 305
      disposition: "parallel current-milestone authoring hardening"
      action: "Timeline dark-canvas contrast and workspace navigation/authoring chrome have both landed since the last Product Reality UI pass. Continue measurable Windows authoring-workspace usability/recovery improvements driven by fresh packaged Product Reality evidence; this issue stays open as an umbrella and should not be closed by any single slice."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes, prevention rules, and regression protection across every milestone."
    - issue: 414
      disposition: "standing mature-reference parity and reuse program"
      action: "Audit current Editor on Fire and adjacent Rocksmith tooling before inventing deterministic domain behavior; port/adapt proven semantics with attribution and differential regression tests."
    - issue: 429
      disposition: "later capability expansion"
      action: "Keep printed notation/TAB practice generation behind the active Product Reality timing gate while preserving the approved roadmap and private-source boundary."
    - issue: 391
      disposition: "later capability expansion / do not displace active work"
      action: "Keep broader multi-source score reconciliation deferred until the current single-song timing diagnosis and local diagnostic acceptance are stable."
    - issue: 46
      disposition: "later capability expansion"
      action: "Keep optional Apple Music metadata enrichment deferred until the core desktop workflow is stable; the metadata-only licensing/cache boundary is approved."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-28T21:30:00Z"
  note: "Main is 04a01c3 (#451), four commits ahead of the last time this file was checked. Since then: #444 finished one-page/multi-arrangement official TAB mapping (#435), #448 fixed the MPO/JPEG official-TAB uploader rejection (#446 — see below, GitHub issue still open only because #448 was pushed straight to main rather than through a merged PR), #450 landed another authoring-workspace/navigation polish slice for #305, and #451 fixed the workflow-planner staleness gap recorded as ERR-2026-005 in the error-resolution ledger: align-tab now reopens when its persisted alignment predates the current onset/leading-rest refinement algorithm, instead of reading complete forever. All four are already on main; this refresh is the first thing to record that. Re-ran the full local suite after installing the optional `tk` and `beat` extras: 1489 passed, 0 failed. Re-triaged every stale branch named in this run's brief (fix/official-tab-mpo-jpeg, agent/fix-360-recording-boundary, agent/desktop-ui-polish-v1, agent/435-multi-arrangement-official-tab, agent/435-multi-arrangement-tab, claude/nice-einstein-1ir286, claude/nice-einstein-60j3gi, claude/nice-einstein-jyw2jg): `git diff main...<branch>` is empty for fix/official-tab-mpo-jpeg (its tip is an ancestor of main), and every other candidate's unique files/behavior are superseded by later merged work under different filenames (e.g. main's own `desktop_polish.py`/`desktop_theme.py` and the mapping-based multi-arrangement TAB model already in `official_tab_reference.py`), so none were resumed. Also re-ran the ERR-2026-005 prevention rule ('a currency helper with no callers is itself a defect signal worth grepping for') against every `*_is_current`/`*_are_current` function in `src/`: all eight have live callers, so no sibling of that defect was found this run. The representative #431 timing defect itself remains open until a fresh packaged Product Reality run — now using a planner that actually re-runs alignment — proves Bass/Lead/Rhythm alignment against the real recording and printed score; that retest needs the private representative project/recording and a packaged Windows build, so it stays a human/product step."
