  - "#304/#193: third merge-before-review-fix gap closed. scripts/quality_preflight.py's `git diff --check` now diffs against the merge-base with origin/main/main (falling back to HEAD) instead of the working tree vs. index only, so it actually catches whitespace errors already staged or committed on the branch (Codex P2 finding left unresolved on merged PR #385); docs/project-status.yaml's own active_pr/next_continuation pointer corrected to stop describing already-merged PR #386 as still unopened (Codex P2 finding left unresolved on merged PR #386) (PR #387)"
  - "#304/#193: fourth merge-before-review-fix gap closed. scripts/quality_preflight.py now also runs a `git diff --cached --check` form against the same resolved merge-base, so a whitespace error that is staged and then further edited (without re-staging) in the working tree can no longer pass the check while still being what a plain `git commit` would record (Codex P2 finding left unresolved on merged PR #387); this file's own active_pr status text no longer makes a claim that self-invalidates as soon as the PR is opened or merged (the same finding #387 itself was meant to fix, left unresolved on #387) (PR #388, re-checked clean post-merge this run)"
  - "#305: the guided desktop shell (GuidedDesktopApp, base of the shipped cdlc-desktop entry point) no longer stacks a blank-until-refresh/duplicate raw 'Next action' callout directly beneath its own curated 'Song progress' panel -- both were driven by the identical build_multi_arrangement_workflow_plan next-step, so the base DesktopApp.next_action_callout is now hidden (pack_forget) in the guided shell while the non-guided DesktopApp/ProductDesktopApp layout keeps showing it unchanged; see docs/product-reality/issue-305-redundant-next-action-callout.md (PR #389, merged)"
  - "#304: the Score & Mappings 'Register / Replace Score' button and register_project_score's refusal error no longer promise an 'explicit replacement' capability that does not exist anywhere in the app -- the button now reads 'Register Score...' at the source (the shipped guided shell's redundant runtime rename removed) and the refusal message names the one path that actually works today (start a new project with the corrected file), so a user who picks the wrong score file gets an honest, actionable dead end instead of a misleading one; register_project_score's actual refuse-a-different-score behavior is unchanged. See docs/product-reality/issue-304-misleading-score-replacement-message.md (PR #390, merged)"
  - "#391: documented multi-source score reconciliation and private reference verification (docs/multi-source-score-reconciliation.md); documentation only, implementation remains deferred pending human decision (PR #392, merged)"
  - "#304/#193: ArrangementWorkspaceState/ValidationDashboardRow's `configured` flag now also reflects a human-confirmed score mapping, not only manifest.arrangement_instruments (fixed once at project creation) -- a bass-only CLI project (`cdlc new --instrument bass`) that later confirms a Lead/Rhythm mapping via `cdlc-score-map confirm` no longer has that role's real FAIL/INVALID validation state silently excluded from the validation dashboard's blocking counts or the workspace's own any_validation_problem gate. See docs/product-reality/issue-304-undeclared-confirmed-role-not-configured.md (PR #393, merged)"
  - "#304: LiveDiagnosticsGuidedDesktopApp.load_project (the real cdlc-desktop entry point) no longer runs the entire DesktopApp/ProductDesktopApp/GuidedDesktopApp refresh cascade twice on every project open -- it now runs once, with the workflow-state diagnostic log line produced by a small dedicated helper instead of a second full refresh; observable log output is unchanged, only the redundant workflow-plan recomputation and duplicate window refreshes are removed. See docs/product-reality/issue-304-redundant-project-load-refresh.md (PR #394, merged)"

next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness. As of this update: 0 PRs are open in this repository -- #393 and #394 both merged cleanly this run. Next unstarted work: pick another #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density more broadly, or other error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence, or continue auditing #304 for further defects beyond the ones already fixed. Do not start #391 work -- its own issue body says not to displace #304/#305."
  action: "The portfolio orchestrator run found two open draft PRs (#393, #394), both already carrying fresh green CI on both required workflows, clean mergeability, and zero unresolved review/comment threads. Both were marked ready for review and merged in dependency order: #393 first (clean fast-forward), then #394 (whose head had gone stale against the new main tip solely in this docs/project-status.yaml continuity file, both PRs having updated the same narrative fields independently) -- the orchestrator re-resolved that conflict by hand-merging this file's content (preserving both PRs' code-fact history) and pushing the resolved file to #394's branch before merging. No source-code conflict existed; only this bookkeeping file overlapped. Next run (or Jeremy) should: (1) query live PR/issue state first as always; (2) pick the next #305 'Areas to review' item, re-check #304's human-only lane, or continue the #304 code audit; (3) keep watching for any recurrence of the merge-before-review-fix-gap pattern; (4) leave #391 alone until #304/#305 work is judged complete."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking every PR merged since this file's last update for unresolved review threads is part of querying live state, not optional. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. A new issue that explicitly says 'do not displace active work' (like #391) should not be picked over the current milestone just because it is newest. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true whether read a minute or a week later."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

