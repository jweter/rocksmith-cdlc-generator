automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after CI and Windows Desktop both succeed, mergeability is resolved, blocking review findings are addressed, and no material correctness, safety, licensing, provenance, privacy, or product concern remains."
  product_reality_rule: "Zero humans for facts a computer can measure. A deterministic defect found by a human must gain automated regression/acceptance coverage before the same fact is requested from the human again."

active_change: null

previously_merged_change:
  pr_number: 618
  branch: "agent/unattended-local-worker-v1"
  merge_sha: "ff62ec82265b7fa79a3d1a242bbb493f3d1b1127"
  purpose: "Run private Product Reality and timing-health checks unattended on Windows idle, with local Ollama advisory diagnosis on deterministic failures."
  behavior_change: "Normal desktop launch idempotently registers/refreshes a current-user Windows ONIDLE Task Scheduler task pointed at the current build. Packaged builds expose a private --unattended-worker mode (source installs: cdlc-local-worker) that runs any configured private Product Reality scenarios through the existing build-bound runner from #616, and, with no scenario configured, still re-qualifies recent desktop projects against current shared timing authority using existing audio-derived Bass onset evidence. Reports are written under %LOCALAPPDATA%/RocksmithCDLCGenerator/unattended-worker/ (latest.json plus history) and never enter Git. Local loopback-only Ollama may add advisory diagnosis on deterministic FAIL/REVIEW_REQUIRED only, from a sanitized derived-evidence payload (no audio, score/GP bytes, private paths, PSARCs, Steam data, or private source hashes); Python measurements remain sole authority and Ollama failure cannot change PASS/FAIL. Malformed scenarios fail closed as REVIEW_REQUIRED, abandoned worker locks are reclaimed via recorded-PID liveness, and opt-out removes the scheduled task."
  verification: "Windows Desktop CI smoke-tests the packaged --unattended-worker path and verifies its local report is bound to the exact packaged build SHA; regression coverage added for local-only Ollama enforcement, private scenario discovery/deduplication, sanitized diagnosis payloads, advisory-only LLM behavior, idle behavior, and idempotent ONIDLE task registration. Merged by the repository owner (jweter) on 2026-09-12; this session verified origin/main is exactly this merge commit before reconciling this file. No manual laptop retest was requested for this slice."

