next_continuation:
  priority: "Verify PR #425 on its exact final head before resuming Product Reality work."
  action: "Fix any material #425 CI/review finding on the same branch and merge only after both required workflows are fresh and green. Then resume the lawful one-track/cross-song Product Reality retest: confirmed Lead-only flow must proceed without synthesizing Bass/Rhythm, and Arrangement Preview timing should be compared against the unresolved For Whom the Bell Tolls timing case."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. Inspect current EOF before inventing deterministic authoring rules. Port domain semantics in small regression-protected slices and retain this project's stronger provenance/review architecture."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "source timing qualification mismatch"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 304
    decision: "After PR #425 is green/merged, continue the fresh one-track project with only its real arrangement confirmed and report the first arrangement entrance time in Arrangement Preview; absent roles must not block or be synthesized."
  - issue: 305
    decision: "Continue packaged visual feedback as UI changes land."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
