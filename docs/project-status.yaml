schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-20T19:54:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements:
    - bass
    - lead
    - rhythm
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Run one representative lawful song + complete structured score through the packaged Windows application, capture measured workflow evidence, and use the findings to prioritize normal-path fixes."

roadmap_issue_queue:
  policy: "Every open product issue receives an explicit roadmap disposition so GitHub Issues remain actionable inputs to scheduled development rather than a disconnected backlog."
  ordered_items:
    - issue: 304
      disposition: "current milestone / highest priority"
      action: "Use as the umbrella Product Reality defect-remediation pass. Reproduce and fix normal-path blockers, stale/incorrect authority, validation/export/package defects, and high-value workflow failures; add regression protection and focused child issues where needed."
    - issue: 305
      disposition: "next milestone / evidence-driven authoring hardening"
      action: "After or alongside #304 remediation, audit the packaged Windows UI, establish a small reusable design-system foundation, and incrementally upgrade the primary authoring workflow without weakening provenance/review/validation gates."
    - issue: 193
      disposition: "standing engineering practice / all milestones"
      action: "Cross-link recurring defect classes from Product Reality, CI, and UI work; record shared root cause, prevention rule, and regression coverage."
    - issue: 46
      disposition: "later capability expansion"
      action: "Optional pluggable Apple Music catalog-metadata enrichment for benchmark candidates only after core desktop workflow completion; never use it as an audio source or hard build/runtime dependency."

automation_contract:
  schedule_role: "repository participant in the consolidated hourly portfolio-development loop"
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-20T19:54:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative beyond this snapshot. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  open_issue_count_at_check: 4
  important_open_issues:
    - number: 304
      title: "Audit and fix current Product Reality defects before expanding scope"
      relevance: "Current-milestone defect-remediation umbrella and first roadmap issue to act on once packaged-app Product Reality evidence is available."
    - number: 305
      title: "Upgrade the Windows desktop UI to a polished authoring workspace"
      relevance: "Explicit next authoring-hardening work, sequenced after or alongside #304 so polish cannot mask unresolved functional defects."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Standing engineering-memory anchor used across all milestones whenever a failure class recurs."
    - number: 46
      title: "Automate Apple Music metadata enrichment for benchmark candidates"
      relevance: "Explicit later capability expansion; optional external metadata integration that must not displace core desktop completion."
  recently_closed_by_human:
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      closed_at: "2026-08-20T19:50:10Z"
      note: "Closed as completed after the multi-track composition and downstream review/preview path landed on main."
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      closed_at: "2026-08-20T00:17:13Z"
      note: "Closed as completed by jweter."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      closed_at: "2026-08-20T00:16:56Z"
      note: "Closed as completed by jweter."

completed_foundation_summary:
  - "Immutable ingest and normalization"
  - "Beat/tempo analysis and Bass transcription/mapping"
  - "Guitar Pro 3-5 and MusicXML complete-score intake"
  - "Explicit Bass/Lead/Rhythm mapping and shared score-to-recording timing"
  - "Reviewed timing and provenance-aware arrangement editing"
  - "Rocksmith XML authoring, DLC Builder staging, and PSARC registration/verification"
  - "Packaged Windows desktop executable and Song Workspace"
  - "Transactional provenance-aware undo/redo across accepted review layers"
  - "Human-confirmed multiple source tracks per Rocksmith arrangement role with downstream review/preview support"

next_continuation:
  priority: "P4-current-milestone"
  action: "Continue Product Reality Gate v1 and #304 first. Once representative packaged-app evidence identifies the current defects, fix the highest-value normal-path blockers and regression-protect them. Then move #305 through incremental UI/UX hardening slices. Keep #193 active whenever defect classes recur. Keep #46 explicitly deferred to Later capability expansion. Re-query live GitHub state before every run because issue and PR state may change after this snapshot."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md. When no higher-priority existing work needs action, select the highest-value unblocked item from roadmap_issue_queue."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 304
    decision: "Run/continue the Product Reality Gate v1 evidence session on the packaged Windows build with one representative lawful song plus complete structured score when repository automation cannot obtain the required real-use evidence itself."
  - issue: 46
    decision: "Before implementation, confirm the product/licensing decision to add an external catalog metadata provider and the permitted metadata-cache boundary."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
