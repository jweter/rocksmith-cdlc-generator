    number: 451
    title: "Fix workflow planner treating stale alignment refinement as complete (#431)"
    merged_at: "2026-08-28T20:48:29Z"
    behavior_change: "align-tab (and downstream reconcile-tab) now reopens when the persisted alignment predates the current onset- or leading-rest-refinement algorithm, instead of reading complete forever once alignment.json exists. This was silently preventing the #432/#436 refinement fixes from ever executing against an already-aligned project. Recorded as ERR-2026-005; does not itself change alignment/timing output."
    verification: "Landed directly on main as 04a01c31f53a119ced7c8f8a5d7a7f06506c5b93; `tests/test_workflow_plan.py`, `tests/test_alignment_onset_refinement.py`, and `tests/test_alignment_leading_rest_refinement.py` cover the staleness gap and the previously-uncalled currency helpers."
