  action: "After #413 main build is available, test the representative project and report Bass/Rhythm/Lead first entrance times plus the known silent-gap sustain result. In parallel, merge #415 only after fresh CI/Windows checks and review are clean, then begin Phase 1 audit against current raynebc/editor-on-fire."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. Reference forks only when commit-level evidence proves unique divergence. Never treat a repository name or CI success as proof of capability or musical correctness."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
