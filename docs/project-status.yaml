schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-09-02T08:00:00Z"
status_source: "Verified live GitHub state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides live GitHub state, CI, code, or higher-authority roadmap contracts."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one structured score, when available, producing the subset of reviewed playable Bass + Lead + Rhythm arrangements actually present in that score with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use representative lawful songs and structured scores in the packaged Windows application to drive normal-path correctness fixes while review/source tooling improves in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 511
      disposition: "printed-score musical-recognition correctness blocker"
      action: "Validate dense printed TAB by independently extracting TAB fret/string evidence and standard-notation rhythm, reconciling them fail-closed before human review."
    - issue: 429
      disposition: "private printed-score practice Product Reality acceptance"
      action: "Prove the first dense BWV1007 Prelude measure is materially correct before expanding recognition to eight measures, later pages, or full practice-output acceptance."
    - issue: 431
      disposition: "Product Reality timing acceptance"
      action: "Inspect the first common entrance near ~7.109 s, the later Lead landmark around ~77.756 s, and later sections for drift before accepting shared timing."
    - issue: 455
      disposition: "EOF-derived timing parity acceptance"
      action: "Keep the EOF-derived path authoritative for timing parity and do not add song-specific offsets or another heuristic before Product Reality verification."
    - issue: 453
      disposition: "official TAB image acceptance"
      action: "Confirm a lawful private phone-camera TAB image renders upright, manual rotation works, and orientation persists without committing the image."
    - issue: 435
      disposition: "private reference mapping acceptance"
      action: "After timing is stable, confirm one lawful private page can serve every applicable arrangement without duplicate image imports."
    - issue: 305
      disposition: "parallel Windows authoring-workspace hardening"
      action: "Continue measurable usability and recovery improvements driven by packaged Product Reality evidence without weakening validation, provenance, or human review."
    - issue: 414
      disposition: "standing mature-reference parity and reuse program"
      action: "Inspect Editor on Fire and adjacent Rocksmith tooling before inventing deterministic authoring behavior; port or adapt proven semantics with attribution and differential regression tests."
    - issue: 193
      disposition: "standing recurring-defect/root-cause program"
      action: "Track recurring root causes and regression protection, especially stale derivative/readiness state after upstream authority changes."
    - issue: 391
      disposition: "later multi-source score reconciliation"
      action: "Keep broader multi-source reconciliation deferred until current correctness and Product Reality gates are stable."
    - issue: 46
      disposition: "later metadata enrichment"
      action: "Keep optional Apple Music metadata enrichment deferred until the core desktop workflow is stable."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, reviews are satisfied, and no material correctness, safety, licensing, provenance, or product concern remains."

