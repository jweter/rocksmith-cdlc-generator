schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-22T01:20:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use one representative lawful song + complete structured score in the packaged Windows application to drive normal-path fixes while independent product work continues in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / highest priority"
      action: "Remediate reproducible Product Reality defects. Packaged Bass verification remains a waiting human lane, not a repo-wide freeze."
    - issue: 305
      disposition: "parallel product-progress lane"
      action: "Improve authoring workflow and diagnostics independently of pending human verification while preserving provenance and review authority."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes and regression protection."
    - issue: 46
      disposition: "later capability expansion"
      action: "Optional Apple Music metadata enrichment only after core desktop workflow completion."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-22T01:20:00Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot."
  recently_merged_pr:
    number: 348
    title: "Fix unreachable score-arrangements mapping controls on short viewports"
    merged_at: "2026-08-22T01:03:32Z"
    behavior_change: "Rebuilt the packaged Score & Mappings tab so the human-confirmation mapping LabelFrame renders directly under the tab header, before the track-inventory table, and gave the track Treeview its own vertical scrollbar. Fixes a reproduced Product Reality report where the mapping Confirm controls were clipped below a tall fixed-height track table with no scroll path on a 1600x960 packaged build. Both required CI jobs and the Windows Desktop build passed before merge."
    pending_verification: "Human Product Reality retest of the same For Whom the Bell Tolls packaged project on the same 1600x960 viewport: confirm the mapping Confirm controls are now visible without scrolling. Independently, the dark-first UI (#345) and NEXT REQUIRED ACTION cue still need a packaged Product Reality screenshot pass. See next_continuation."
  active_branch_work:
    branch: "claude/nice-einstein-cuu6ok"
    lane: "#304 remediation umbrella — fix the newest reported stale/misleading readiness state"
    planned_behavior_change: "song_readiness.py: the shared \"score-arrangements\" step_id is reused by the planner (workflow_plan.py) for several distinct sub-states (confirm mappings, wait for rights review, ready to fan out, fanned out, repair). _friendly_action() previously always rendered the fixed \"Confirm which score tracks are Bass, Lead, and Rhythm\" text for every sub-state, so the guided next-action text stayed stale after every mapping was human-confirmed and the planner had already advanced to its automatic \"ready to fan out\" sub-state, even though the headline (\"Ready to continue automatically\") updated correctly. Fixed: the fixed confirm-text override now applies only to the \"needs_you\" sub-state; every other sub-state uses the planner's own already-accurate state-specific step.title. This is exactly the 2026-08-20 Product Reality finding recorded as the first comment on #304."
    safety_boundary: "Presentation/text-selection only. No workflow routing, mapping-confirmation logic, provenance, validation, human-review-gate semantics, or packaging behavior changed; only which precomputed title string is shown for the already-correct step_id/kind."
    regression_tests: "tests/test_song_readiness.py adds 3 tests: the exact reported ready-to-fan-out scenario, the analogous waiting-on-rights-review sub-state, and confirmation that the one sub-state the fixed text is meant for (mappings not yet confirmed) is unaffected. All 3 fail against pre-fix _friendly_action() and pass after the fix; the full 18-test file and full suite (1265 tests with dev+beat extras installed) pass."
    cross_linked: "docs/product-reality/issue-304-stale-score-arrangements-next-action-text.md; #304 comment 2026-08-20T21:49:22Z."
    pr_status: "Not yet opened as of this status update; opened as a draft PR in the same run this file was updated in. Left open for fresh independent CI (CI, Windows Desktop) on its exact head SHA; not merged in this run."
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella. #348 (merged) fixed the score-arrangements gate controls unreachable-on-short-viewport defect. This run's PR fixes the stale post-confirmation next-action text defect (first #304 comment, 2026-08-20). Remaining #304 comments still needing a fix pass: the Bass-mapping FAIL/queue-summary UI inconsistency (\"No persisted validation findings are currently queued\" shown beside visible FAIL rows) and the packaged Bass validation regeneration retest, both still open. Packaged Bass validation retest remains a separate waiting human lane."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation and dark-first visible adoption (#345) are merged; a small tooltip/placement follow-up (#346) was closed as superseded and only becomes scheduled work if human laptop testing shows the click-track control is still hard to discover."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor."
    - number: 46
      relevance: "Later optional metadata capability."

