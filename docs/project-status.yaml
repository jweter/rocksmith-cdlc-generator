schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-19T01:00:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements:
    - bass
    - lead
    - rhythm
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Run one representative lawful song + complete structured score through the packaged Windows application, capture measured workflow evidence, and use the findings to prioritize normal-path fixes."

automation_contract:
  schedule_role: "repository participant in the consolidated hourly portfolio-development loop"
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-19T01:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  important_open_issues:
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      relevance: "Verified 2026-08-18: backend contract, Song Workspace controller/status models, Arrangement Preview UI wiring, and every listed related Product Reality finding (percussion role filter, warning/validation-root-cause summaries, BPM display, pending-selection preservation, review queue summary) are merged and covered by tests. No further gap was found this run; consider closing after a human confirms no residual behavior gap."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      relevance: "Verified 2026-08-19: anchors, bounded refit preview/acceptance, promotion, per-role projection, and a read-only reviewed Rocksmith XML render/handoff bridge are merged. This run closed the previously documented gap: authoring_export.py (used by desktop_xml_export.export_project_arrangement_xml for Bass/Lead/Rhythm) now checks for analysis/reviewed_score_timing.json and, when present, routes notes/timing/positions through reviewed_rocksmith_xml_render.py instead of charts/<role>_source.json. Fail-closed: once that file exists, any failure building the reviewed input (stale promotion, unconfirmed mapping, stale fan-out, unsupported technique) raises rather than silently falling back to the older chart path. Projects that never promoted reviewed timing are unaffected. Regression tests added in tests/test_authoring_export_reviewed_routing.py. Remaining follow-on: no Song Workspace UI surface yet exposes *whether* a given export used reviewed vs. legacy timing (it is currently only visible in eof/export_manifest.json's assumptions text); that is a reasonable next UI-affordance slice but not a correctness gap."
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-19: this run added score_role_composition_cli.py (entry point cdlc-score-composition) and score_role_composition_fanout_review.preview_score_role_composition_overlaps, wiring the already-merged composition plan/overlap/fan-out functions through to a human-usable CLI end to end: plan-show, plan-select (merges into the current plan without clobbering other roles), overlaps (read-only cross-track overlap preview, nothing persisted), compose (imports every currently selected track, applies an explicit human decisions file, and persists review/score_role_composition_fanout.json), and compose-show. Decisions are still supplied fresh at compose time (not a new persisted review layer) and every decision is independently revalidated against the live score/plan/overlap state by the existing library functions; no new merge/acceptance judgment was added. Regression coverage added in tests/test_score_role_composition_cli.py (parser validation, plan merge behavior, overlap preview, compose with and without a decisions file, fail-closed on unresolved overlaps) and tests/test_score_role_composition_fanout_review.py (preview function: read-only, no persisted plan, no role selection, non-overlapping case). Not yet done: no Song Workspace GUI surface, and no downstream consumer (reconciliation/authoring/export) reads the composed multi-track output instead of the single primary-mapped track yet. Still should not interrupt Product Reality Gate v1 unless single-track mapping blocks or produces materially wrong output."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Engineering-memory anchor for recurring failure classes. No new recurring-defect instance found this run."

completed_foundation_summary:
  - "Immutable ingest and normalization"
  - "Beat/tempo analysis and Bass transcription/mapping"
  - "Guitar Pro 3-5 and MusicXML complete-score intake"
  - "Explicit Bass/Lead/Rhythm mapping and shared score-to-recording timing"
  - "Reviewed timing and provenance-aware arrangement editing"
  - "Rocksmith XML authoring, DLC Builder staging, and PSARC registration/verification"
  - "Packaged Windows desktop executable and Song Workspace"
  - "Transactional provenance-aware undo/redo across accepted review layers"

next_continuation:
  priority: "P4-current-milestone"
  action: "Continue Product Reality Gate v1 (requires a human-run representative lawful song/score session; not autonomously completable). While that evidence run is pending: #232's CLI wiring (cdlc-score-composition: plan-show/plan-select/overlaps/compose/compose-show) to build/review score_role_composition_fanout_review.py's persisted artifact is now closed (this run) — see the #232 entry above. Remaining #232 work is the next-highest-value autonomous slice: (1) a Song Workspace GUI surface for the same plan/overlap/compose flow (mirroring track_trust_workspace_status.py/track_trust_workspace_controls.py/track_trust_workspace_ui.py's read-only-status + controller + widget pattern), and (2) a downstream consumer (reconciliation/authoring/export) that actually reads review/score_role_composition_fanout.json's composed multi-track output for a role instead of only the single primary-mapped track. After that: expose in the Song Workspace/desktop export UI whether a given export used reviewed vs. legacy timing (currently only visible in eof/export_manifest.json's assumptions text, from #241). #268 appears complete; a human should confirm and close it rather than an agent auto-closing it."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required: null

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
