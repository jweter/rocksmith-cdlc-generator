next_continuation:
  priority: "P4-current-milestone"
  action: "Continue Product Reality Gate v1 (requires a human-run representative lawful song/score session; not autonomously completable). While that evidence run is pending: #232's Song Workspace status layer, no-overlap compose controller/panel, in-workspace add/remove track picker, in-workspace overlap-decision UI, a fail-closed guard on the un-integrated Lead/Rhythm chart builder (PR #301), and (this run) the equivalent fail-closed guard for Bass's fan-out path (score_fanout.py) are all added -- see the #232 entry above. Remaining #232 work: the actual downstream-consumer integration -- shared_guitar.py building a Lead/Rhythm chart, and score_fanout.py fanning out Bass, from the composed multi-track note stream instead of only the single primary-mapped track, which additionally requires the reviewed position/event-timing/technique/chord review layers to make sense across a merged multi-track note stream. This remains explicitly flagged as a larger, riskier slice than the picker/controller/overlap-UI/guard work done so far and deserves its own dedicated run rather than being folded into another slice. #241 and #268 both appear complete; a human should confirm and close them rather than an agent auto-closing them. Next highest-value candidate after #232's downstream-consumer slice lands: sweep the open Issues tab (#174, #47, #46, #45 plus any new items) for the next highest-value bounded fix, per the agent-development-policy issue-sweep cadence -- note #174/#47/#46/#45 are all currently blocked on human action (lawful source acquisition, external rights/provenance judgment, or product decisions on optional metadata providers) rather than being autonomously actionable today."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

