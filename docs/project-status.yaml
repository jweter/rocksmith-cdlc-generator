re-investigate or re-implement them without new Product Reality evidence. Otherwise continue the highest-value authorized #414/#455 or #305 slice that does not assume the pending human result."
  selection_rule: "Product Reality is lane-local. Never classify the entire Rocksmith project as blocked while an authorized parallel-safe P4/P5 slice can be implemented and verified. Preserve human musical authority and never infer readiness from output existence alone."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "printed-score recognition candidate promotion"
  - "source timing qualification mismatch"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 429
    decision: "After the active recognition fix is packaged, inspect BWV1007 Prelude page 2 measure 1 and require the visible dense note count, TAB string/fret sequence, and notation rhythm to be materially correct before approval or expansion."
  - issue: 455
    decision: "Verify the first common Bass/Lead/Rhythm entrance near ~7.109 s, the later Lead landmark around ~77.756 s, and later no-drift behavior before accepting shared timing."
  - issue: 431
    decision: "Treat any remaining timing displacement as a blocker; do not compensate by hand or accept a song-specific constant."
  - issue: 453
    decision: "Use a lawful private phone-camera TAB image to confirm EXIF orientation plus manual rotation and persistence."
  - issue: 435
    decision: "After timing is stable, confirm one privately owned page can be selected for every applicable arrangement and follows the correct bar range without duplicate image copies."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
