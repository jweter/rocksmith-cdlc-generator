    - "Malformed configured scenarios fail closed as REVIEW_REQUIRED instead of disappearing from discovery, and abandoned worker locks are reclaimed by recorded-PID liveness checks so a crash/power loss does not require manual cleanup."
  important_open_issues: [612, 511, 429, 431, 455, 453, 435, 305, 414, 193]

