    cross_linked: "docs/ui/track-trust-status-adoption.md (new); docs/ui/design-system-foundation.md; score_mapping_status_presentation.py (#352) as the single-label pattern this mirrors, and review_queue_row_presentation.py (#353) as the sibling table-row pattern."
