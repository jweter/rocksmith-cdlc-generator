  - "#304: Overview/Arrangements/Validation/Review Queue no longer present raw warning-event totals (e.g. Bass 2851, Lead 2046, Rhythm 2981) with no context after #365/#366/#367's queue grouping -- every warning count is now shown paired with its actionable/grouped root-cause count (e.g. \"3 actionable warning groups · 2851 underlying warning events\"), via new ArrangementWorkspaceState.actionable_warning_count / SongWorkspaceSnapshot.raw_warning_event_count fields and shared validation.py formatting helpers, so a project with thousands of repeated warnings that collapse to a few root causes reads as manageable instead of unfixed; raw totals, fail counts, and all existing grouping/migration/provenance authority are unchanged (#375, see docs/product-reality/issue-375-raw-warning-totals-obscure-actionable-grouping.md)"
