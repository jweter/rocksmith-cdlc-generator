schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-20T00:00:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements:
    - bass
    - lead
    - rhythm
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Run one representative lawful song + complete structured score through the packaged Windows application, capture measured workflow evidence, and use the findings to prioritize normal-path fixes."

automation_contract:
  schedule_role: "repository participant in the consolidated hourly portfolio-development loop"
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-20T00:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  important_open_issues:
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      relevance: "Verified 2026-08-18: backend contract, Song Workspace controller/status models, Arrangement Preview UI wiring, and every listed related Product Reality finding (percussion role filter, warning/validation-root-cause summaries, BPM display, pending-selection preservation, review queue summary) are merged and covered by tests. No further gap was found this run; consider closing after a human confirms no residual behavior gap."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      relevance: "Verified 2026-08-19: anchors, bounded refit preview/acceptance, promotion, per-role projection, and a read-only reviewed Rocksmith XML render/handoff bridge are merged. A prior run closed the routing gap: authoring_export.py (used by desktop_xml_export.export_project_arrangement_xml for Bass/Lead/Rhythm) checks for analysis/reviewed_score_timing.json and, when present, routes notes/timing/positions through reviewed_rocksmith_xml_render.py instead of charts/<role>_source.json, failing closed rather than silently falling back. This run closed the remaining UI-affordance follow-on: AuthoringExportManifest/GuitarAuthoringExportManifest (authoring_export.py) now carry a structured `timing_source` field (`reviewed_score_anchors`/`legacy_chart`, manifest schema_version bumped 1->2) instead of that fact being discoverable only via free-text assumptions, and the desktop Rocksmith XML Export window (desktop_xml_export_window.py) reads it back from eof/export_manifest.json / eof/<arrangement>_export_manifest.json to label each arrangement's post-export status line, degrading gracefully to the prior plain 'Exported: <path>' text if the manifest is missing/unreadable/older-shaped. Regression tests added/extended in tests/test_authoring_export_reviewed_routing.py and tests/test_desktop_xml_export_state.py. No further gap identified for #241 at this time."
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-20 (this run): landed the Bass fan-out slice of the downstream-consumer integration, following the Lead/Rhythm design landed 2026-08-19. score_fanout.py's fanout_confirmed_score_mappings now consumes score_role_composition_fanout_review's composed multi-track Bass note stream when Bass's composition selects more than one track and a current composed fan-out record exists for it, materializing that composed stream as an ordinary single-track ImportedSource via a new _materialize_composed_bass_source (score-level fields cross-checked for exact agreement across every contributing track, failing closed on disagreement) written to sources/imported/composition/bass-composed-<score_sha12>.json, so every existing downstream Bass consumer (reconcile_bass_sources/reconcile_project_bass and everything built on ReconciledBassChart) accepts it unchanged -- mirroring shared_guitar.py's _materialize_composed_guitar_source. The prior fail-closed guard (_reject_unconsumed_multi_track_bass_composition) is retired in favor of _current_composed_bass_record, mirroring _current_composed_record_for_role: still fails closed with an actionable message when Bass's multi-track composition selection has no current composed record yet, or when a previously composed record is stale. Lock re-entrancy (Trap 1) is closed the same way as Lead/Rhythm, via score_role_composition_fanout_review's private lock-assuming _load_current_locked, imported as a function-local deferred import inside score_fanout.py specifically to avoid a circular top-level import (score_role_composition_fanout_review already imports _require_score_rights_review/_reviewed_score_path from score_fanout at module scope). Trap 2 (Bass derivative invalidation binding to (score_sha256, track_index) alone, not fan-out content) is now closed: ReconciledBassChart and SourceDisagreementReport gained an optional source_content_sha256 field (populated by reconcile_project_bass from the exact source file's content hash; None for older records, which are treated as unproven/stale rather than assumed current), and score_fanout.py's _invalidate_stale_bass_derivatives now additionally requires that recorded hash to match the just-produced Bass fan-out output's own content hash before treating a prior Bass reconciliation as still current -- so narrowing/widening a Bass composition selection at the same confirmed primary track index no longer leaves a stale reconciliation looking current. Regression coverage added in tests/test_score_fanout_bass_composition_guard.py (composed-record consumption; narrowing a composition selection after reconciliation invalidates the stale reconciliation at the same primary track index) and tests/test_score_fanout_invalidation.py (content-hash mismatch at matching score/track invalidates; a legacy record with no content hash is treated as stale). Full local test suite (1148 tests, including optional beat/librosa extras) and scripts/check_automation_readiness.py pass. Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: Bass (landed)' section. Remaining #232 work, in order: (1) re-verify the full audit checklist of other source_track_index==/track_index== call sites (reviewed_positions.py, reviewed_event_timing.py, reviewed_techniques.py, reviewed_chords.py, guitar_authoring.py, alignment.py, score_preview.py, chord_identity_ui.py, score_mapping_review.py, score_role_composition_workspace_status.py) against the now-landed Lead/Rhythm and Bass designs -- deliberately left for a separate PR, since it is a distinct, separately-scoped audit rather than an extension of either landed slice; (2) Song Workspace/CLI status surfacing of composed vs. single-track draft provenance for Bass (Lead/Rhythm already expose composed_source_track_indices on SharedGuitarDraftManifest for this; Bass has no equivalent persisted draft manifest today). Still should not interrupt Product Reality Gate v1 unless single-track mapping blocks or produces materially wrong output."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Engineering-memory anchor for recurring failure classes. No new recurring-defect instance found this run."

