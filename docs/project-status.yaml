      disposition: "implemented diagnostic capability / local evidence pending"
      action: "Compare the registered Guitar Pro score with the alternate lawful private score and retain both as evidence without changing registered source authority."
    - issue: 453
      disposition: "fresh packaged UI defect"
      action: "Honor phone/JPEG EXIF orientation and add explicit left/right 90-degree rotation controls for Official TAB pages without modifying the source image."
    - issue: 454
      disposition: "fresh packaged UI defect"
      action: "Make the Arrangement Preview tab body vertically scrollable at laptop resolutions while preserving nested TAB-image scrolling and fixed workspace navigation."
    - issue: 435
      disposition: "implemented on main / packaged acceptance pending"
      action: "One private official TAB page can already be mapped to every applicable Bass/Lead/Rhythm role without duplicate image imports. Confirm this in a packaged build after the current timing blocker is cleared."
    - issue: 446
      disposition: "implemented on main / GitHub issue not yet closed"
      action: "The reported MPO/JPEG rejection is fixed in code. Verify against a real phone-camera capture and close the issue if packaged ingestion remains correct."
    - issue: 305
      disposition: "parallel current-milestone authoring hardening"
      action: "Continue measurable Windows authoring-workspace usability/recovery improvements driven by fresh packaged Product Reality evidence; this remains an umbrella issue."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes, prevention rules, and regression protection across every milestone."
    - issue: 414
      disposition: "standing mature-reference parity and reuse program"
      action: "Audit current Editor on Fire and adjacent Rocksmith tooling before inventing deterministic domain behavior; port/adapt proven semantics with attribution and differential regression tests."
    - issue: 429
      disposition: "later capability expansion"
      action: "Keep printed notation/TAB practice generation behind the active Product Reality timing gate while preserving the approved roadmap and private-source boundary."
    - issue: 391
      disposition: "later capability expansion / do not displace active work"
      action: "Keep broader multi-source score reconciliation deferred until the current timing diagnosis and local diagnostic acceptance are stable."
    - issue: 46
      disposition: "later capability expansion"
      action: "Keep optional Apple Music metadata enrichment deferred until the core desktop workflow is stable; the metadata-only licensing/cache boundary is approved."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-28T22:15:00Z"
  note: "Main is d5fe028a0873a64b07c3e080aa9d8f92075849f6 after the project-status refresh merged as #452. The 2026-08-28 packaged Product Reality run then supplied decisive new evidence: the planner now re-runs alignment, but the representative Guitar Pro project still renders Bass/Lead/Rhythm late, so v5 is not merely stale — its heuristic timing selection is insufficient. The same lawful GP/audio remains correct in EOF. Issue #455 and ERR-2026-006 therefore change the engineering direction from additional periodic-shift ranking to a pinned EOF-derived first-sync timing path. Branch agent/eof-first-sync-timing-455 implements alignment v6, records current EOF upstream provenance, retires the old GP heuristic passes from the authority path, and adds a synthetic 11.773 s -> 7.109 s repeated-riff regression plus fail-closed coverage. Full repository and Windows verification are delegated to fresh PR workflows; no pass claim is recorded here yet. The same packaged session also confirmed Official TAB image ingestion works while exposing orientation (#453) and full-page vertical scrolling (#454) defects."
