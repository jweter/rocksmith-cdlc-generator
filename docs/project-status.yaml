  - "#304/#193: ArrangementWorkspaceState/ValidationDashboardRow's `configured` flag now also reflects a human-confirmed score mapping, not only manifest.arrangement_instruments (fixed once at project creation) -- a bass-only CLI project (`cdlc new --instrument bass`) that later confirms a Lead/Rhythm mapping via `cdlc-score-map confirm` no longer has that role's real FAIL/INVALID validation state silently excluded from the validation dashboard's blocking counts or the workspace's own any_validation_problem gate. See docs/product-reality/issue-304-undeclared-confirmed-role-not-configured.md"

next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness (see verified_repository_state.active_pr.fix_status). As of this run: a draft PR on branch claude/clever-davinci-6mh59v (#304 undeclared-but-confirmed-role `configured` fix) is being opened against main. If it is still open, wait for fresh CI on both required workflows and an unresolved-review-thread check before merging; if it is already merged, re-check its post-merge automated-review threads too (per #193's prevention rule) and then move to the next bullet. Next unstarted work after that PR resolves: pick another #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density more broadly, or other error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence, or continue auditing #304 for further defects beyond the ones already fixed."
  action: "This run queried live GitHub state first and found 0 open PRs, so per selection_rule it checked the most recently merged PR (#392, docs-only #391 reconciliation writeup) before picking new work -- 0 reviews, 0 review threads, only an automated Codex usage-limit notice (not an actual review), nothing unresolved; #390 (the previously-active score-replacement-message fix, since merged as e4749c0) was also re-confirmed clean. Rather than assume 'no unresolved review comments on the last merge' meant no #304 work remained, this run performed its own independent code audit against #304's priority order (normal-path blockers, then stale state/readiness/provenance, then validation/export/packaging, then Bass/Lead/Rhythm mapping/timing, then recoverability/error-messaging, then workflow friction). The one confirmed, confidently root-causable defect found: ArrangementWorkspaceState/ValidationDashboardRow's `configured` flag was derived only from manifest.arrangement_instruments (fixed once at project creation by the desktop shell or `cdlc new --instrument`), while the actual workflow planner (multi_arrangement_plan._confirmed_guitar_roles) builds real Lead/Rhythm workflow steps and validation reports purely from human-confirmed score mapping -- a bass-only CLI project that later confirms a Lead/Rhythm mapping via `cdlc-score-map confirm` kept that role at `configured=False`, silently excluding its real FAIL/INVALID validation state from the validation dashboard's blocking counts and the workspace's own any_validation_problem gate -- a #304 priority-2 (incorrect/stale state/readiness) defect and another instance of #193's two-independent-sources-of-truth pattern. Fixed song_workspace.py's configured_roles computation to also include any role with a human-confirmed mapping (song_workspace.py), added two regression tests verified to fail pre-fix, documented the defect in docs/product-reality/issue-304-undeclared-confirmed-role-not-configured.md, ran the full test suite locally (1378 passed, 0 failed, Python 3.12 with dev+beat extras) plus scripts/quality_preflight.py (exit 0), and opened a draft PR against main -- explicitly not merged in this same run, left for fresh CI per the standard rule. The next run (or Jeremy) should: (1) query live PR/issue state first as always, including automated-review threads on anything merged very recently; (2) once CI is green on this PR and it is mergeable with no unresolved review threads, merge it; (3) then pick another #305 'Areas to review' item, re-check #304's human-only lane, or continue the #304 code audit for further defects; (4) keep watching for any recurrence of the merge-before-review-fix-gap pattern."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking the most recently merged PR's review threads is part of querying live state, not optional -- do this even when 0 PRs are open, and even when the previous run's check came back clean. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true (or is explicitly flagged for re-verification) whether read a minute or a week later, after the PR opens, and after it merges."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

