schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-25T20:20:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one structured score, when available, producing the subset of reviewed playable Bass + Lead + Rhythm arrangements actually present in that score with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use representative lawful songs and structured scores in the packaged Windows application to drive normal-path fixes while independent product work continues in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / evidence-driven defect remediation"
      action: "Fix the packaged single-track score hard stop via partial-arrangement workflow support, then continue timing diagnosis across multiple songs."
    - issue: 305
      disposition: "parallel current-milestone authoring hardening"
      action: "Continue measurable Windows authoring-workspace improvements without weakening provenance, review, validation, or packaging gates; current human feedback includes stronger Timeline contrast and clearer recovery states."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes, prevention rules, and regression protection across every milestone."
    - issue: 414
      disposition: "standing mature-reference parity and reuse program"
      action: "Audit current Editor on Fire and adjacent Rocksmith tooling before inventing deterministic domain behavior; port/adapt proven semantics with attribution and differential regression tests."
    - issue: 391
      disposition: "later capability expansion / do not displace active work"
      action: "Keep multi-source score reconciliation deferred until the single-score Product Reality and authoring-hardening work is stable."
    - issue: 46
      disposition: "later capability expansion"
      action: "Keep optional Apple Music metadata enrichment deferred until the core desktop workflow is stable; the metadata-only licensing/cache boundary is approved."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-25T20:20:00Z"
  note: "Packaged build 54b2046b exposed a new hard Product Reality blocker on a fresh one-track GP5: after confirming the only Guitar track as Lead, the workflow still required the same track to be falsely confirmed as Bass and Rhythm before automatic work could continue. This proves the existing planner confuses importer proposals with mandatory arrangement configuration. PR #421 adds partial-arrangement workflow support and non-Bass timing authority so a Lead-only or Rhythm-only score can proceed without fabricating absent roles. The prior For Whom the Bell Tolls timing defect remains unresolved after the latest packaged build and will be retested across additional songs after this blocker is removed."
  recently_merged_pr:
    number: 420
    title: "Load composed guitar sources into reviewed authoring (#193)"
    merged_at: "2026-08-25T19:35:15Z"
    behavior_change: "Repairs the project-facing Lead/Rhythm composed-source binding so reviewed authoring consumes the current composed source."
    post_merge_product_reality: "Current packaged build 54b2046b is based on this main head; one-track score testing then exposed the partial-arrangement hard stop tracked by PR #421."
  previously_merged_pr:
    number: 419
    title: "Keep composed tie folds within source tracks (#193, #414)"
    merged_at: "2026-08-25T19:10:39Z"
    post_merge_product_reality: "Composition provenance repair is merged; packaged normal-path testing continues."
  important_open_issues:
    - number: 304
      relevance: "Current Product Reality remediation umbrella. PR #421 addresses the newly reproduced mandatory-three-role hard stop; shared timing remains under cross-song investigation."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade; Timeline contrast remains a human-feedback item."
    - number: 414
      relevance: "Standing EOF/reference parity, code-reuse, fork-audit and differential-testing program."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor."
    - number: 391
      relevance: "Later multi-source score reconciliation capability; explicitly deferred behind current Product Reality work."
    - number: 46
      relevance: "Later optional Apple Music metadata capability; approved boundary, implementation deferred."

