      action: "Inspect Editor on Fire and adjacent Rocksmith tooling before inventing deterministic authoring behavior; port or adapt proven semantics with attribution and differential regression tests."
    - issue: 193
      disposition: "standing recurring-defect/root-cause program"
      action: "Track recurring root causes and regression protection, especially stale derivative/readiness state after upstream authority changes."
    - issue: 391
      disposition: "later multi-source score reconciliation"
      action: "Keep broader multi-source reconciliation deferred until current correctness and Product Reality gates are stable."
    - issue: 46
      disposition: "later metadata enrichment"
      action: "Keep optional Apple Music metadata enrichment deferred until the core desktop workflow is stable."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, reviews are satisfied, and no material correctness, safety, licensing, provenance, or product concern remains."

