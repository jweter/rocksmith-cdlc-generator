automation_contract:
  schedule_role: "repository participant in the consolidated hourly portfolio-development loop"
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-20T05:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  important_open_issues:
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      relevance: "Verified 2026-08-18: backend contract, Song Workspace controller/status models, Arrangement Preview UI wiring, and every listed related Product Reality finding (percussion role filter, warning/validation-root-cause summaries, BPM display, pending-selection preservation, review queue summary) are merged and covered by tests. No further gap was found this run; consider closing after a human confirms no residual behavior gap."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      relevance: "Verified 2026-08-19: anchors, bounded refit preview/acceptance, promotion, per-role projection, and a read-only reviewed Rocksmith XML render/handoff bridge are merged. A prior run closed the routing gap: authoring_export.py (used by desktop_xml_export.export_project_arrangement_xml for Bass/Lead/Rhythm) checks for analysis/reviewed_score_timing.json and, when present, routes notes/timing/positions through reviewed_rocksmith_xml_render.py instead of charts/<role>_source.json, failing closed rather than silently falling back. This run closed the remaining UI-affordance follow-on: AuthoringExportManifest/GuitarAuthoringExportManifest (authoring_export.py) now carry a structured `timing_source` field (`reviewed_score_anchors`/`legacy_chart`, manifest schema_version bumped 1->2) instead of that fact being discoverable only via free-text assumptions, and the desktop Rocksmith XML Export window (desktop_xml_export_window.py) reads it back from eof/export_manifest.json / eof/<arrangement>_export_manifest.json to label each arrangement's post-export status line, degrading gracefully to the prior plain 'Exported: <path>' text if the manifest is missing/unreadable/older-shaped. Regression tests added/extended in tests/test_authoring_export_reviewed_routing.py and tests/test_desktop_xml_export_state.py. No further gap identified for #241 at this time."
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-20 (this run, PR pending fresh independent CI/merge -- not yet on main): implemented the last remaining #232 item -- position/event-timing/technique/chord review and the Arrangement Preview now actually consume a role's composed multi-track note stream instead of failing closed when one is selected. reviewed_positions.py's detection-only composed_multi_track_review_gap is replaced by resolve_composed_review_entry(project, arrangement, *, score, entry), called from the shared _fanout_entry choke point (inherited by every set_reviewed_*/apply_reviewed_*_to_source path in reviewed_positions.py/reviewed_event_timing.py/reviewed_techniques.py/reviewed_chords.py/chord_fingering.py) and once per role from score_preview.py's load_score_fanout_preview_snapshot. Bass is returned unchanged (its composed stream is already named by the fan-out manifest entry, verified rather than assumed). For Lead/Rhythm with more than one track currently selected, it loads the current RoleCompositionFanoutRecord via the public load_current_score_role_composition_fanout and re-materializes the same composed source shared_guitar.py's chart-build path already produces (_materialize_composed_guitar_source, via a function-local import mirroring score_fanout.py's existing circular-import workaround for the equivalent Bass case), then points the resolved entry's output_json at it -- no event-index-keying logic changed in any of the four review layers or score_preview.py's note assembly, since the composed source is already shaped exactly like any other single-track fan-out output. A selection of more than one track with no current composed fan-out record yet still fails closed (same class of error, more specific message) -- that genuinely ambiguous/unbuilt case is preserved, not weakened. Regression coverage added/updated in tests/test_shared_guitar_timeline.py (test_set_reviewed_position_fails_closed_for_an_uncomposed_lead_selection, test_set_reviewed_position_consumes_a_current_composed_lead_selection, test_set_reviewed_position_consumes_a_current_composed_rhythm_selection) and tests/test_score_preview.py (test_score_fanout_preview_fails_closed_for_an_uncomposed_lead_selection, test_score_fanout_preview_consumes_a_current_composed_lead_selection); Bass's existing composed-consumption test in tests/test_score_fanout_bass_composition_guard.py continues to pass unchanged. Full local test suite (1170 tests, including optional beat/librosa/guitarpro extras and tkinter-dependent UI tests), scripts/check_automation_readiness.py, python -m compileall, and cdlc --help all pass locally, matching the exact commands .github/workflows/ci.yml runs; the Windows Desktop required workflow has not been run locally (Windows-only) and, per policy, this PR is not GREEN/mergeable until both repository-required workflows complete successfully on the actual PR head SHA. Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: position/event-timing/technique/chord review and the Arrangement Preview (landed)' section. Issue #232 is now fully implemented across all prior slices plus this one; recommend closing #232 once this PR merges and a human confirms no residual gap."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Engineering-memory anchor for recurring failure classes. No new recurring-defect instance found this run."

