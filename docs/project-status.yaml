active_change:
  pr_number: 415
  branch: "agent/eof-reference-parity-program"
  issue_scope: [414]
  purpose: "Establish the durable EOF/reference implementation program in the canonical roadmap, agent policy, parity matrix, fork inventory and third-party attribution so future deterministic authoring work checks mature behavior before inventing new semantics."

next_continuation:
  priority: "Do not let the planning/reference PR block the Product Reality lane: verify #415 normally while the merged #413 Windows artifact is tested on the representative project."
  action: "For #413 Product Reality: download the newest post-merge Windows Desktop artifact, open test-02, run Safe Automatic Steps to rebuild timing under v3, complete timing review/promotion when prompted, then report first Bass/Rhythm/Lead entrance times and the known silent-gap sustain result. For #414: after #415 merges, begin the detailed Phase 1 GP/timing/duration audit from the matrix in bounded PR slices driven by concrete parity gaps."
  selection_rule: "Always query live PR state first; correctness/safety/provenance findings outrank new feature work. A human Product Reality gate blocks only the dependent lane it verifies, not unrelated parallel work. Before deterministic GP/Rocksmith domain changes, apply #414's mature-reference-first rule. Never treat CI success as proof of musical correctness."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true
  mature_reference_check_required_for_new_deterministic_domain_logic: true
  adjacent_tool_direct_code_reuse_requires_license_audit: true

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "source timing qualification mismatch"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 397
    decision: "Retest the fresh test-02 project with the post-merge #413 Windows artifact. Run Safe Automatic Steps to rebuild stale timing, review/promote timing as requested, and report the first Bass/Rhythm/Lead entrance times plus the known silent-gap sustain result."
  - issue: 305
    decision: "Continue packaged visual feedback as UI changes land; the Timeline currently needs lighter text/ticks/labels against the dark waveform background."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
