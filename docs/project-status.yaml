      disposition: "Product Reality timing acceptance"
      action: "Inspect the first common entrance near ~7.109 s, the later Lead landmark around ~77.756 s, and later sections for drift before accepting shared timing."
    - issue: 455
      disposition: "EOF-derived timing parity acceptance"
      action: "Keep the EOF-derived path authoritative for timing parity and do not add song-specific offsets or another heuristic before Product Reality verification."
