  checked_at: "2026-08-25T00:13:00Z"
  note: "Live triage found no pre-existing open Rocksmith pull request before the current timing fix was started. Packaged Windows build 27caa264 reproduced the shared Bass/Lead/Rhythm late-start defect after the preview-routing fix, proving the remaining fault is upstream in promoted timing authority rather than Arrangement Preview routing."
  recently_merged_pr:
    number: 412
    title: "Fix Song Workspace preview to honor reviewed timing"
    merged_at: "merged to main as 27caa264 after required checks passed"
    behavior_change: "Arrangement Preview now maps Bass, Lead, Rhythm, note endpoints, beat metadata, and time signatures through promoted reviewed timing authority when present."
    post_merge_product_reality: "Fresh packaged testing still shows all three arrangements beginning around 17.7-17.9 s instead of roughly 8-9 s, so the reviewed timing authority itself remains wrong for the representative project."
  previously_merged_pr:
    number: 398
    title: "Fix shared arrangement timing offset with content-aware onset refinement"
    merged_at: "merged before the current packaged retest"
