    - issue: 305
      disposition: "parallel current-milestone authoring hardening"
      action: "Continue measurable Windows authoring-workspace usability and recovery improvements driven by fresh packaged Product Reality evidence. This run found and fixed another code-audit-only defect (no packaged evidence needed): multi_arrangement_plan.py's combined Bass+guitar planner inserted validate-lead/validate-rhythm steps ahead of the human-review step but left human-review's status field untouched -- it still only reflected Bass's own review/validation_report.json artifact inherited from build_project_workflow_plan. A project with Bass already validated but a confirmed Lead/Rhythm arrangement still unvalidated therefore reported human-review as \"ready\" (and, via song_readiness._counts_as_progress_complete, counted it as done toward the \"N% prepared\" headline) even though a required validate-<role> step was still blocked/unrun. The next actionable step was still correct (validate-lead/-rhythm precede human-review in list order), but the readiness percentage overstated completion. Fixed by recomputing human-review's status to blocked when a confirmed guitar role's validation is not yet complete; regression test added in tests/test_multi_arrangement_plan.py. Prior fix: guided_desktop.py's guided_action_spec routed automatic-blocked \"waiting\" sub-states of shared step_ids (score-arrangements, align-tab) to the same human-review-tab route as their needs_you sub-state, enabling a Next Step button that led to a tab with nothing left to review. Fixed by gating the route table on ReadinessAction.kind == \"needs_you\"; see docs/product-reality/issue-305-guided-action-routes-waiting-steps-to-review-tabs.md."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes, prevention rules, and regression protection across every milestone. This run found and fixed a significant one: ci.yml's Windows job ran compileall/pytest/cdlc --help as three commands in one pwsh step, so pytest's exit code was silently overwritten by the trailing cdlc --help success -- confirmed via the real GitHub Actions log that the Windows job had been reporting overall success while pytest itself reported 6 failed underneath it. Root cause of those 6 failures was a real, separate bug: ~15 call sites building project-relative paths for JSON manifests used plain str(path.relative_to(project)) instead of this codebase's established .as_posix() convention, so Windows-built manifests stored backslash paths. Fixed both: ci.yml now runs each command as its own step (so a Windows-only pytest regression will actually fail CI going forward), and all outlier call sites now use .as_posix(). Full suite: 1642 passed, 0 failed, 3 skipped (was 1636 passed, 6 failed on Windows). See docs/product-reality/issue-193-windows-ci-swallowed-pytest-failures.md."
    - issue: 414
      disposition: "standing mature-reference parity and reuse program"
      action: "Audit current Editor on Fire and adjacent Rocksmith tooling before inventing deterministic domain behavior; port or adapt proven semantics with attribution and differential regression tests. eof_note_endpoint_resnap_check.py (parity matrix item C 'Note endpoint resnapping/rounding', P0) ports gp_import.c's note-tail resnap pass as an advisory check flagging any ImportedSource note whose end sits within ~1ms of the imported beat grid without landing on it; the upstream grid-snap helper's own definition was not found in the accessible source tree, so the check compares against this project's own beat grid instead, documented plainly rather than guessed at. guitarpro_import.py:_bend_points() (parity matrix item D 'Bend strength', P0) preserves GP bend curves at import instead of discarding them: PyGuitarPro already normalizes raw GP bend bytes to whole-semitone units before this project's importer sees them (confirmed by reading gp3.py:readBend), so there is no EOF-style quarter-step/half-step byte encoding left to decode; the note's full bend curve (position/semitones/vibrato) is preserved in a new SourceNoteEvent.bend_points field instead of being discarded to a boolean flag. guitarpro_import.py:_slide_kinds() (item D 'Slide in from above/below'/'Shift vs legato slide', P0/P1) similarly preserves slide subtype: PyGuitarPro's own parsed model already distinguishes all six GP slide subtypes explicitly, previously collapsed into one generic 'slide' technique flag (a gap eof_rocksmith_validation.py already self-documents via its rocksmith_slide_detail_missing warning). The subtype is now captured in a new additive SourceNoteEvent.slide_kinds field, deliberately kept separate from the techniques whitelist (reviewed_techniques.SUPPORTED_TECHNIQUES / eof_compatibility.py) rather than added as a new techniques label, since that whitelist would silently filter or reject an unrecognized label -- confirmed by reading both modules first. Both slices are import-side only; target-fret resolution and Rocksmith XML export remain open for both the bend and slide data. Remaining boundary-parity work includes section and phrase semantics when a comparable model is available."
    - issue: 429
      disposition: "later capability expansion / proof-of-concept complete end-to-end via a CLI command"
      action: "Keep printed notation/TAB practice generation behind the active Product Reality timing gate while preserving the approved roadmap and private-source boundary. The full proof-of-concept pipeline scoped in docs/printed-notation-tab-practice-mode.md has landed: deterministic_tempo_map.py, click_track_render.py, printed_notation_import.py, printed_notation_authoring.py, and printed_notation_validation.py, wired together behind the new `cdlc import-notation` CLI command (import_project_printed_notation_practice()), which fails closed on either validation check rather than writing a possibly-broken practice package. An optional --page-image registers the source page via the existing official_tab_reference.py (issue #453's image store), reused rather than duplicated. Regression coverage: tests/test_deterministic_tempo_map.py, tests/test_click_track_render.py, tests/test_printed_notation_import.py, tests/test_printed_notation_authoring.py, tests/test_printed_notation_validation.py, tests/test_cli_import_notation.py (57 tests total). Real image recognition (OMR/OCR, doc phase N0) is still a dedicated future research spike -- everything landed here consumes a hand-authored fixture standing in for its output. No committed next slice exists; see the 'Proof-of-concept slice: complete' section in docs/printed-notation-tab-practice-mode.md for candidate next directions and the instruction to write a fresh concrete plan before starting one."
