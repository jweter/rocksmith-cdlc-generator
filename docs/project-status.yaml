schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-25T00:41:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements: [bass, lead, rhythm]
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Use one representative lawful song + complete structured score in the packaged Windows application to drive normal-path fixes while independent product work continues in parallel."

roadmap_issue_queue:
  ordered_items:
    - issue: 304
      disposition: "current milestone / evidence-driven defect remediation"
      action: "Repair GP-to-recording timing against the proven EOF behavioral reference, retain source timing qualification before promotion, then continue normal-path validation and packaging remediation."
    - issue: 305
      disposition: "parallel current-milestone authoring hardening"
      action: "Continue measurable Windows authoring-workspace improvements without weakening provenance, review, validation, or packaging gates; current human feedback includes stronger Timeline contrast and clearer recovery states."
    - issue: 193
      disposition: "standing engineering practice"
      action: "Track recurring root causes, prevention rules, and regression protection across every milestone."
    - issue: 391
      disposition: "later capability expansion / do not displace active work"
      action: "Keep multi-source score reconciliation deferred until the single-score Product Reality and authoring-hardening work is stable."
    - issue: 46
      disposition: "later capability expansion"
      action: "Keep optional Apple Music metadata enrichment deferred until the core desktop workflow is stable; the metadata-only licensing/cache boundary is approved."

automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-25T00:41:00Z"
  note: "Fresh packaged testing with a second Guitar Pro file in a fresh project still places early arrangement material around 17.9 s. The same GP/audio pair is correctly timed in Editor on Fire (EOF). This substantially rules out the score file alone as the explanation and makes the application's score-to-recording transform the active defect. PR #413 now combines the conservative Source Timing Qualification Gate with an EOF-parity pre-roll/global-translation correction and explicit attribution."
  recently_merged_pr:
    number: 412
    title: "Fix Song Workspace preview to honor reviewed timing"
    merged_at: "merged to main as 27caa264 after required checks passed"
    behavior_change: "Arrangement Preview now maps Bass, Lead, Rhythm, note endpoints, beat metadata, and time signatures through promoted reviewed timing authority when present."
    post_merge_product_reality: "Two different GP sources in fresh packaged testing still display early arrangement material around 17.7-17.9 s while the same source/audio timing is correct in EOF, proving the remaining defect is upstream of Arrangement Preview rendering."
  previously_merged_pr:
    number: 398
    title: "Fix shared arrangement timing offset with content-aware onset refinement"
    merged_at: "merged before the current packaged retest"
    post_merge_product_reality: "The first refinement could identify candidate shifts but rejected any valid negative correction that moved an early alignment anchor before audio time zero. EOF handles this case by omitting pre-zero score beats and continuing to map later note positions through the project beat map."
  important_open_issues:
    - number: 304
      relevance: "Current Product Reality remediation umbrella. GP timing must match the recording and the proven EOF reference before downstream arrangement review is trustworthy."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Major dark-first/status/discoverability work is merged; fresh human feedback requests lighter Timeline text/ticks/labels against the dark waveform surface."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor; continue exact-head CI/review verification and record repeated failure classes."
    - number: 397
      relevance: "Shared Bass/Lead/Rhythm late-start defect is reproduced with two GP files and a fresh project; same-source EOF comparison now anchors the fix to EOF-compatible timing semantics rather than a song-specific offset."
    - number: 391
      relevance: "Later multi-source score reconciliation capability; explicitly deferred behind current Product Reality work, though current evidence reinforces the value of comparing multiple score candidates."
    - number: 46
      relevance: "Later optional Apple Music metadata capability; approved boundary, implementation deferred."

completed_foundation_summary:
  - "Immutable ingest, normalization, beat/tempo analysis, and audio-derived Bass transcription"
  - "Guitar Pro 3-5 and MusicXML complete-score intake with explicit Bass/Lead/Rhythm role mapping"
  - "Shared score fan-out, score-to-recording timing, reviewed timing authority, and provenance-aware arrangement editing"
  - "Bass reconciliation/fret mapping plus Lead/Rhythm shared-score arrangement materialization"
  - "Validation-gated Rocksmith XML authoring, DLC Builder staging, and PSARC registration/verification"
  - "Packaged Windows desktop executable with Song Workspace, timeline transport, review queue, arrangement preview, diagnostics, and dark-first authoring UI"
  - "Transactional provenance-aware review state and stale-derivative invalidation across major generated artifacts"
  - "Arrangement Preview consumes promoted reviewed score timing for Bass, Lead, Rhythm, note endpoints, beat grid metadata, and time signatures"
  - "Source Timing Qualification Gate diagnoses repeated score-vs-recording offset evidence before shared timing promotion; it persists evidence and blocks only strong mismatches"
  - "EOF-parity timing semantics are now explicitly adopted for pre-roll: valid global corrections may place leading symbolic beats before audio zero, those pre-zero anchors are omitted, and later source positions keep the same project-beat transform"
  - "Editor on Fire reuse/reference attribution is recorded in THIRD_PARTY_NOTICES.md under its permissive BSD-style root license"
  - "Product Reality and automation contracts require fresh CI plus packaged human verification; passing CI does not replace musical correctness evidence"

active_change:
  pr_number: 413
  branch: "agent/fix-shared-timing-refinement-v2"
  issue_scope: [304, 397]
  purpose: "Fix the reproduced ~17.9 s GP timing defect with EOF-parity pre-zero beat handling and stronger repeated-onset refinement, while retaining a conservative Source Timing Qualification Gate before timing promotion."

next_continuation:
  priority: "Finish exact-head CI/review verification of the EOF-parity timing correction, then rerun the representative packaged Product Reality project."
  action: "After PR #413 passes both required workflows and merges, download the new Windows Desktop artifact, open the fresh test-02 representative project, run Safe Automatic Steps so v2 timing authority is rebuilt under v3, complete timing review/promotion when prompted, then verify Bass/Rhythm/Lead begin around the actual 8-9 s performance instead of ~17.9 s and recheck the known silent-gap sustain region."
  selection_rule: "Always query live PR state first; correctness/safety/provenance findings outrank new feature work. A human Product Reality gate blocks only the dependent lane it verifies, not unrelated parallel work. Never treat CI success as proof of musical correctness."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "source timing qualification mismatch"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 397
    decision: "After the EOF-parity correction merges, retest the fresh test-02 project with the new packaged Windows artifact. Run Safe Automatic Steps to rebuild stale v2 alignment, review/promote timing as requested, and report the first Bass/Rhythm/Lead entrance times plus the known silent-gap sustain result."
  - issue: 305
    decision: "Continue packaged visual feedback as UI changes land; the Timeline currently needs lighter text/ticks/labels against the dark waveform background."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
