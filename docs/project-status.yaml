next_continuation:
  priority: "P4-current-milestone"
  action: "Continue Product Reality Gate v1 (requires a human-run representative lawful song/score session; not autonomously completable). While that evidence run is pending: #232's Lead/Rhythm downstream-consumer slice, Bass downstream-consumer slice, and the full audit-checklist sweep of remaining source_track_index==/track_index== call sites have all landed (see #232 entry above) on top of the previously merged Song Workspace status layer, no-overlap compose controller/panel, in-workspace add/remove track picker, and in-workspace overlap-decision UI. Remaining #232 work, in priority order: (1) make position/event-timing/technique/chord review and the Arrangement Preview actually consume a role's composed multi-track note stream instead of failing closed when one is selected (the audit-checklist sweep closed the silent-undercount gap by failing closed, not by adding real composed-review support -- that is a distinct, larger follow-on requiring each review layer's event-index keying and score_preview.py's per-role note assembly reworked against a merged multi-track stream); (2) Song Workspace/CLI status surfacing of composed-vs-single-track draft provenance, including a Bass-side equivalent of SharedGuitarDraftManifest.composed_source_track_indices (Bass currently has no persisted draft manifest analogous to Lead/Rhythm's). Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: Lead/Rhythm (landed)', 'Downstream consumption: Bass (landed)', and 'Audit-checklist sweep (issue #232, landed)' sections -- read all three before starting either remaining item. #241 and #268 both appear complete; a human should confirm and close them rather than an agent auto-closing them. Next highest-value candidate after the two remaining #232 items land: sweep the open Issues tab (#174, #47, #46, #45 plus any new items) for the next highest-value bounded fix, per the agent-development-policy issue-sweep cadence -- note #174/#47/#46/#45 are all currently blocked on human action (lawful source acquisition, external rights/provenance judgment, or product decisions on optional metadata providers) rather than being autonomously actionable today."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

