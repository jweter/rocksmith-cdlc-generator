  issue: 508
  pr_number: 513
  branch: "claude/blissful-einstein-lsxnss"
  scope: "Per-measure elapsed-time heartbeat during blocking Ollama TAB/notation/recheck calls, and measure/stage-qualified transport-failure and timeout error text, completing the remainder of #508 not already covered by #512."
