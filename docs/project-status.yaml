    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-20 (MERGED to main as PR #316, commit 6cb7ca6; an earlier run recorded this as a pending PR, corrected here): implemented the last remaining #232 item -- position/event-timing/technique/chord review and the Arrangement Preview now actually consume a role's composed multi-track note stream instead of failing closed when one is selected. reviewed_positions.py's detection-only composed_multi_track_review_gap is replaced by resolve_composed_review_entry(project, arrangement, *, score, entry), called from the shared _fanout_entry choke point (inherited by every set_reviewed_*/apply_reviewed_*_to_source path in reviewed_positions.py/reviewed_event_timing.py/reviewed_techniques.py/reviewed_chords.py/chord_fingering.py) and once per role from score_preview.py's load_score_fanout_preview_snapshot. Bass is returned unchanged (its composed stream is already named by the fan-out manifest entry, verified rather than assumed). For Lead/Rhythm with more than one track currently selected, it loads the current RoleCompositionFanoutRecord via the public load_current_score_role_composition_fanout and re-materializes the same composed source shared_guitar.py's chart-build path already produces (_materialize_composed_guitar_source, via a function-local import mirroring score_fanout.py's existing circular-import workaround for the equivalent Bass case), then points the resolved entry's output_json at it -- no event-index-keying logic changed in any of the four review layers or score_preview.py's note assembly, since the composed source is already shaped exactly like any other single-track fan-out output. A selection of more than one track with no current composed fan-out record yet still fails closed (same class of error, more specific message) -- that genuinely ambiguous/unbuilt case is preserved, not weakened. Regression coverage added/updated in tests/test_shared_guitar_timeline.py (test_set_reviewed_position_fails_closed_for_an_uncomposed_lead_selection, test_set_reviewed_position_consumes_a_current_composed_lead_selection, test_set_reviewed_position_consumes_a_current_composed_rhythm_selection) and tests/test_score_preview.py (test_score_fanout_preview_fails_closed_for_an_uncomposed_lead_selection, test_score_fanout_preview_consumes_a_current_composed_lead_selection); Bass's existing composed-consumption test in tests/test_score_fanout_bass_composition_guard.py continues to pass unchanged. Both required workflows (CI, Windows Desktop) completed successfully on that PR's head SHA before it merged. Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: position/event-timing/technique/chord review and the Arrangement Preview (landed)' section. Issue #232 is now fully implemented across all prior slices plus this one, and all of it is on main; the issue stays open only pending a human confirming no residual behavior gap before it is closed."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
