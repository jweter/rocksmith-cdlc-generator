  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot."
  recently_merged_pr:
    number: 349
    title: "Fix stale next-action text after score-arrangements mapping confirmed"
    merged_at: "2026-08-22T01:14:47Z"
    behavior_change: "song_readiness._friendly_action() no longer forces the fixed 'Confirm which score tracks are Bass, Lead, and Rhythm' text onto every score-arrangements planner sub-state; that fixed text now applies only to the needs_you (not-yet-confirmed) sub-state, and every other sub-state (ready to fan out, waiting on rights review, etc.) shows the planner's own already-accurate state-specific title. Both required CI jobs and the Windows Desktop build passed before merge; no open PRs remained afterward."
    pending_verification: "Independently, the dark-first UI (#345) and NEXT REQUIRED ACTION cue still need a packaged Product Reality screenshot pass, and the Score & Mappings tab reachability fix (#348) still needs its human retest. See next_continuation."
  active_branch_work:
    branch: "claude/nice-einstein-1x4v6x"
    lane: "#304 remediation umbrella — fix the Bass-mapping FAIL/queue-summary UI inconsistency reported 2026-08-20"
    planned_behavior_change: "song_workspace_ui.py: SongWorkspaceWindow._refresh_review_queue() rebuilds the Review Queue Treeview from the current snapshot on every refresh(), which always clears any prior row selection, but only ever updated the review_detail_var summary label in the empty-queue branch. Once the queue had been empty at least once (the common early-project state) and was then later populated with real FAIL/WARNING rows by automation, the label kept showing the stale 'No persisted validation findings are currently queued.' text next to a visibly populated FAIL table until the user happened to click a row. Fixed: the non-empty branch now also sets review_detail_var, to a live count summary ('N items queued (F failures · W warnings). Select a row to see details.'), so the label always reflects the just-rendered tree state; selecting a row still overrides it with that row's full detail via the existing _review_selected() handler, unchanged."
    safety_boundary: "Presentation-only label text. No workflow routing, mapping/validation logic, provenance, human-review-gate semantics, or packaging behavior changed; review queue contents and row-selection detail view are unaffected."
    regression_tests: "tests/test_song_workspace_review_queue_ui.py (new, 3 tests) exercises SongWorkspaceWindow._refresh_review_queue directly against a lightweight fake review_tree/review_detail_var, following the existing SimpleNamespace + unbound-method pattern used in tests/test_timing_review_shared_promotion_ui.py: (1) reproduces the exact reported sequence (empty-queue refresh, then a refresh with FAIL rows and no selection) and asserts the stale empty message is gone; (2) confirms the empty-queue message still renders correctly across repeat empty refreshes; (3) confirms failure/warning counts are accurate for a mixed queue. All 3 fail against the pre-fix method and pass after the fix. Full suite: 1268 tests pass (1265 baseline + 3 new) with dev+beat extras installed; python scripts/check_automation_readiness.py reports PASS."
    cross_linked: "docs/product-reality/issue-304-review-queue-detail-stale-empty-message.md; #304 comment 2026-08-20T23:44:46Z (the UI/state-mismatch half of that report; the underlying unmapped_bass_note root cause was already fixed by #322)."
    pr_status: "Opened this run as PR TBD; left open for fresh independent CI (CI, Windows Desktop) on its exact head SHA; not merged in this run."
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella. #348 and #349 (both merged) fixed the score-arrangements gate reachability and stale next-action-text defects. #322 (merged) fixed the audio_only Bass mapping root cause. This run's PR fixes the remaining Review Queue detail-panel staleness defect (second #304 comment, 2026-08-20). Remaining open #304 items: the packaged Bass validation regeneration retest is a separate waiting human lane (see human_decision_required); the Score & Mappings tab reachability fix (#348) still needs its packaged human retest."
