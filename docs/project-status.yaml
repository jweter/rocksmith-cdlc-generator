completed_foundation_summary:
  - "Immutable ingest, normalization, beat and tempo analysis, and audio-derived Bass transcription"
  - "Guitar Pro 3-5 and MusicXML complete-score intake with explicit Bass, Lead, and Rhythm role mapping"
  - "Shared score fan-out, score-to-recording timing framework, reviewed timing authority, and provenance-aware arrangement editing"
  - "Bass reconciliation and fret mapping plus Lead and Rhythm shared-score arrangement materialization"
  - "Validation-gated Rocksmith XML authoring, DLC Builder staging, and PSARC registration and verification"
  - "Packaged Windows desktop executable with Song Workspace, timeline transport, review queue, arrangement preview, diagnostics, and dark-first authoring UI"
  - "Transactional provenance-aware review state and stale-derivative invalidation across major generated artifacts"
  - "EOF-derived pre-roll and first-sync semantics with differential regression coverage"
  - "Private Official TAB references remain private and can follow arrangement score bars without becoming musical authority"
  - "Private printed-score Bass practice supports movement-scoped registration, notation/TAB segmentation, local vision candidates, explicit human review/correction, and validated Rocksmith XML plus click-track generation"
  - "Printed-score practice readiness is cryptographically bound to current reviewed authority and generated outputs"
  - "Guitar Pro bend curves (captured at import in SourceBendPoint) now thread losslessly through the full reviewed-authority pipeline into real Rocksmith XML <bendValues>/<bendValue> elements for Bass, Lead, and Rhythm, instead of failing closed on every bent note; see docs/eof-subsystem-parity-matrix.md's Bend strength/curve points rows (issue #414). Post-merge review (#517) found and this repo fixed three follow-on gaps: bend-point timing now remaps through the same piecewise-linear reviewed timing curve as the note's own endpoints (including a second rebasing pass when exact-tie folding extends a primary note's duration), a captured point-level vibrato flag fails closed instead of being silently dropped, and Bass/Lead/Rhythm now set the arrangement-level bends property when an exportable curve is present. Not yet packaged-verified against real Rocksmith import/playback."
  - "Guitar Pro pitched (shift/legato) slides now resolve their implicit destination fret (the next note on the same string) at import and thread it losslessly through the full reviewed-authority pipeline into the real Rocksmith XML slideTo attribute and slides arrangement property, instead of failing closed on every slid note; see docs/eof-subsystem-parity-matrix.md's Pitched/Shift-vs-legato slide rows (issue #414, PR #520). The four target-less into/out slide subtypes (intoFromAbove/intoFromBelow/outDownwards/outUpwards) have no PyGuitarPro-exposed target and remain unresolved/unexported (see the Unpitched slide row). Not yet packaged-verified against real Rocksmith import/playback."
  - "Fixed a genuine post-#520 gap: every resolved pitched Guitar Pro slide exported identically regardless of shift-vs-legato subtype, silently dropping Rocksmith's linkNext distinction. EOF's own gp_import.c maps only the 'legato' slide-type bit to EOF_PRO_GUITAR_NOTE_FLAG_LINKNEXT (never 'shift'); a new additive SourceNoteEvent.link_next field, set only alongside a resolved slide_target_fret for a legato slide, now threads through the same reviewed-authority layers as slide_target_fret and exports as the real linkNext=\"1\" note/chordNote attribute for Bass, Lead, and Rhythm. See docs/eof-subsystem-parity-matrix.md's Pitched slide/Shift-vs-legato slide/Link-next rows (issue #414). Link-next remains PARTIAL, not PARITY: EOF's tie-note-introduces-a-new-technique and grace-note slide-in LINKNEXT sources are separate and still unaudited. Not yet packaged-verified against real Rocksmith import/playback."
  - "Fixed a severe pre-existing export gap, not a cosmetic one: any note carrying the generic hammer_on_pull_off technique (essentially every hammer-on/pull-off in any Guitar Pro source, since MusicXML already resolved its own explicit hammer_on/pull_off labels but neither importer's output was exportable) failed the entire reviewed-authoring handoff to Rocksmith XML with 'not losslessly supported yet: hammer_on_pull_off' -- Guitar Pro tabs contain hammer-ons/pull-offs pervasively. guitarpro_import._resolve_hammer_pulloff_direction() now resolves Guitar Pro's single ambiguous hammer bit into the specific hammer_on/pull_off labels MusicXML already emitted directly, by comparing each flagged note's fret to the immediately preceding same-string note's fret -- the identical comparison raynebc/editor-on-fire's own gp_import.c performs (audited at commit c0d88eabf7b00b0bd2cac9414df9fa9c6b3e7100) to set EOF_PRO_GUITAR_NOTE_FLAG_HO vs _PO. A note with no preceding same-string note, or an equal fret, is left as the generic hammer_on_pull_off label and continues to fail closed, matching the unresolved-slide/bend pattern. Both labels now export as real hammerOn=\"1\"/pullOff=\"1\" note attributes plus the hopo arrangement property for Bass, Lead, and Rhythm. See docs/eof-subsystem-parity-matrix.md's Hammer-on / pull-off row (issue #414). Not yet packaged-verified against real Rocksmith import/playback."

active_change: null

next_continuation:
  priority: "Prove BWV1007 Prelude page 2 measure 1 recognition correctness (#511, fix merged in #512) and per-measure heartbeat visibility (#508, fix merged in #513) with a real packaged retest before broader printed-score or timing development."
  action: "Reuse the existing private Prelude project and recognize page 2 with one measure, gemma3:4b, and five expected systems. Confirm the heartbeat/elapsed-time text is visible while Ollama is in flight, then inspect the complete note count, string/fret sequence, and sixteenth-note rhythm in Review. Expand to eight measures only if measure 1 is materially correct; otherwise treat the new evidence as the next blocker."
  selection_rule: "Correctness, safety, provenance, and Product Reality findings outrank new feature work. Human-reviewed musical authority must invalidate stale derivatives deterministically; never infer readiness from output existence alone."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
