  main_sha: "88cef923d4ff7ab210515b62404cceb99cfbd60c"
  note: "PR #523 merged, resolving a severe pre-existing export gap where any note carrying the generic hammer_on_pull_off technique failed the entire reviewed-authoring handoff to Rocksmith XML (issue #414's standing mature-reference parity program). project-status.yaml's active_change previously described #523 as still open awaiting CI; reconciled here per the maintenance contract's stale-status-is-a-defect rule. There are currently no open Rocksmith PRs. The private packaged BWV1007 Prelude page-2 one-measure Product Reality retest (#511/#509/#508) remains the standing next-continuation item; packaged Rocksmith import/playback verification of a real bend (#517), pitched slide (#520), linkNext (#522), and the new hammer-on/pull-off export below are separate open Product Reality gates. No Product Reality result is inferred from merged code alone."
  recently_merged_change:
    issue: 414
    pr: 523
    merge_sha: "88cef923d4ff7ab210515b62404cceb99cfbd60c"
    behavior_change: "Any note carrying Guitar Pro import's generic hammer_on_pull_off technique label failed the entire reviewed-authoring handoff to Rocksmith XML with 'not losslessly supported yet: hammer_on_pull_off', even though musicxml_import.py already emitted resolved hammer_on/pull_off labels directly from MusicXML's explicit notations. guitarpro_import._resolve_hammer_pulloff_direction() now resolves Guitar Pro's single ambiguous hammer bit into hammer_on/pull_off by comparing the flagged note's fret to the immediately preceding same-string note's fret, matching raynebc/editor-on-fire's eof_load_gp() (audited at commit c0d88eabf7b00b0bd2cac9414df9fa9c6b3e7100). Both labels now export as real hammerOn=\"1\"/pullOff=\"1\" note/chordNote attributes plus the hopo arrangement property for Bass, Lead, and Rhythm. See docs/eof-subsystem-parity-matrix.md's Hammer-on/pull-off row. Not yet packaged-verified against real Rocksmith import/playback."
  completed_printed_score_recognition:
    issue: 496
    state: "implementation landed; Product Reality correctness refinement active"
    implementation_chain: [497, 498, 499, 500, 501]
    behavior: "Private BWV1007 page segmentation, explicit rests, local Ollama recognition, visual human review/correction, and reviewed practice output are implemented. The first real dense measure proved the one-shot recognition strategy insufficient, so recognition quality is being refined without weakening the human-authority boundary."
