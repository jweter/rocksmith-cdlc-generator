  - "PR #417 merged EOF-derived fret, bend, slide, fingering and FHP validation findings across Bass/Lead/Rhythm"
  - "PR #420 merged the project-facing composed Lead/Rhythm reviewed-authoring source binding"

active_change:
  pr_number: 421
  branch: "agent/partial-arrangement-workflow"
  issue_scope: [304]
  purpose: "Treat Bass/Lead/Rhythm as independently optional score arrangements: unconfirmed importer proposals no longer block a confirmed subset, and Lead-only/Rhythm-only projects can align their confirmed guitar track directly as shared timing authority instead of fabricating Bass."

next_continuation:
  priority: "Verify PR #421 on its exact final head, then resume cross-song timing Product Reality testing."
  action: "Fix any material #421 CI/review finding on the same branch and merge only after both required workflows are fresh and green. Retest the existing Between the Bars one-track project by leaving Bass/Rhythm unconfirmed, continuing automatically, reviewing/promoting Lead timing, and checking Arrangement Preview. Then compare first-event timing against the unresolved For Whom the Bell Tolls case to distinguish generic timing failure from song-specific score structure."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. Inspect current EOF before inventing deterministic authoring rules. Port domain semantics in small regression-protected slices and retain this project's stronger provenance/review architecture."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "source timing qualification mismatch"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
  - issue: 304
    decision: "After PR #421 merges, continue the fresh Between the Bars project with only Lead confirmed and report the first Lead entrance time in Arrangement Preview; absent Bass/Rhythm must not block or be synthesized."
  - issue: 305
    decision: "Continue packaged visual feedback as UI changes land; the Timeline currently needs lighter text/ticks/labels against the dark waveform background."

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
