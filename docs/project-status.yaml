next_continuation:
  priority: "The align-tab planner-staleness fix (#431/#451) is merged. Run packaged Product Reality on the resulting product behavior before inventing another timing correction; do not start another speculative alignment change until that retest evidence exists."
  action: "On the representative project, rerun Safe Automatic Steps: align-tab should now reopen and re-run the v5 leading-rest refinement instead of silently staying complete. Review/promote shared timing through the normal human gate, then verify the common Bass/Lead/Rhythm entrance near ~7.109 s and the printed-score B-string fret-8 Lead transition around ~77.756 s. If the residual defect persists even with the refinement algorithm now actually executing, that localizes the remaining problem to the refinement algorithm itself rather than to planner staleness. In the same local session, exercise EOF recording-clock observations, the alternate private GP comparison, and one private Official TAB page selected for every applicable arrangement so any remaining failure can be localized without changing source or musical authority. Separately, verify the #446 MPO/JPEG fix against a real phone-camera capture in a packaged build and close that GitHub issue (the code fix and regression tests already exist on main)."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. Inspect current EOF before inventing deterministic authoring rules. Do not compensate for a failed timing result by hand; preserve one shared recording clock and collect evidence for the next root-cause slice. Before starting new work, check whether a stale/abandoned branch or an issue already marked 'implemented' in this file already covers it — several issues in the queue above are implemented on main but await packaged/human acceptance rather than more code."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

human_review_gates:
