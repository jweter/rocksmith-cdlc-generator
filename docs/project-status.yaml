next_continuation:
  priority: "P4-current-milestone"
  action: "Continue Product Reality Gate v1 (requires a human-run representative lawful song/score session; not autonomously completable). While that evidence run is pending: #232's Song Workspace status layer, no-overlap compose controller/panel, in-workspace add/remove track picker, and an in-workspace overlap-decision UI (score_role_composition_workspace_status.py, score_role_composition_workspace_controls.py, score_role_composition_workspace_ui.py, wired into AudioOutputSongWorkspaceWindow) are all added — see the #232 entry above. Remaining #232 work: a downstream consumer (reconciliation/authoring/export) that actually reads review/score_role_composition_fanout.json's composed multi-track output for a role instead of only the single primary-mapped track (touches shared_guitar.py's alignment_for_role/_build_project_shared_guitar_chart_locked and score_fanout.py's single-track outputs). This is explicitly flagged as a larger, riskier slice than the picker/controller/overlap-UI work done so far and deserves its own dedicated run rather than being folded into another slice. #241's remaining UI-affordance gap (surfacing reviewed-vs-legacy export timing source in the desktop export UI) is now closed — see the #241 entry above; this PR is pending fresh CI on branch claude/nice-einstein-1g50ax. #268 appears complete; a human should confirm and close it rather than an agent auto-closing it. Next highest-value candidate after #232's downstream-consumer slice lands: sweep the open Issues tab (#174, #47, #46, #45 plus any new items) for the next highest-value bounded fix, per the agent-development-policy issue-sweep cadence."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

safety_and_content_boundaries:
