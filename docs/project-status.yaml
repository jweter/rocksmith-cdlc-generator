current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Run one representative lawful song + complete structured score through the packaged Windows application, capture measured workflow evidence, and use the findings to prioritize normal-path fixes."

automation_contract:
  schedule_role: "repository participant in the consolidated hourly portfolio-development loop"
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-20T04:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  important_open_issues:
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      relevance: "Verified 2026-08-18: backend contract, Song Workspace controller/status models, Arrangement Preview UI wiring, and every listed related Product Reality finding (percussion role filter, warning/validation-root-cause summaries, BPM display, pending-selection preservation, review queue summary) are merged and covered by tests. No further gap was found this run; consider closing after a human confirms no residual behavior gap."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      relevance: "Verified 2026-08-19: anchors, bounded refit preview/acceptance, promotion, per-role projection, and a read-only reviewed Rocksmith XML render/handoff bridge are merged. A prior run closed the routing gap: authoring_export.py (used by desktop_xml_export.export_project_arrangement_xml for Bass/Lead/Rhythm) checks for analysis/reviewed_score_timing.json and, when present, routes notes/timing/positions through reviewed_rocksmith_xml_render.py instead of charts/<role>_source.json, failing closed rather than silently falling back. This run closed the remaining UI-affordance follow-on: AuthoringExportManifest/GuitarAuthoringExportManifest (authoring_export.py) now carry a structured `timing_source` field (`reviewed_score_anchors`/`legacy_chart`, manifest schema_version bumped 1->2) instead of that fact being discoverable only via free-text assumptions, and the desktop Rocksmith XML Export window (desktop_xml_export_window.py) reads it back from eof/export_manifest.json / eof/<arrangement>_export_manifest.json to label each arrangement's post-export status line, degrading gracefully to the prior plain 'Exported: <path>' text if the manifest is missing/unreadable/older-shaped. Regression tests added/extended in tests/test_authoring_export_reviewed_routing.py and tests/test_desktop_xml_export_state.py. No further gap identified for #241 at this time."
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-20 (this run): landed the Bass half of 'Song Workspace/CLI status surfacing', following the Lead/Rhythm half landed earlier the same day. score_role_composition_workspace_status.py's _draft_status now branches Bass to a new _bass_draft_status helper that reads charts/bass_reconciled.json (ReconciledBassChart) as Bass's draft equivalent -- Bass has no persisted draft manifest analogous to SharedGuitarDraftManifest, since its fan-out output flows directly into reconcile_project_bass/ReconciledBassChart instead of a cached, re-loadable draft. A missing reconciliation is now not_built (replacing the prior permanent not_applicable placeholder); an unreadable/corrupt one is stale with the parse error preserved; a readable one is current exactly when score_fanout.py::_invalidate_stale_bass_derivatives would also treat it as current -- matching registered score, matching confirmed primary track index, and a matching content hash of the *current* Bass fan-out output (a None hash, missing fan-out manifest, or missing output file all count as a non-match, mirroring the same conservative None-never-matches rule that closed Trap 2 for fan-out invalidation itself). Because a composed Bass fan-out is materialized directly into the score fan-out manifest (unlike Lead/Rhythm), whether a current reconciliation is composed or single-track is read off which output file its matched content hash belongs to, not off the *current* composition selection -- so a composition edited after the last fan-out/reconciliation run correctly reports what was actually built, while CompositionWorkspaceState elsewhere already surfaces that composition intent has moved on. This is read-only status; it never builds, rebuilds, or invalidates anything. Regression coverage added in tests/test_score_fanout_bass_composition_guard.py: test_workspace_status_reports_bass_draft_not_built_before_reconciliation, test_workspace_status_reports_a_current_single_track_bass_draft, test_workspace_status_reports_a_current_composed_bass_draft, test_workspace_status_reports_a_stale_bass_draft_when_content_hash_disagrees, test_workspace_status_reports_a_stale_bass_draft_with_no_recorded_content_hash, test_workspace_status_reports_bass_draft_stale_when_no_current_fanout_output_exists, test_workspace_status_reports_a_corrupt_bass_reconciliation_file_as_stale; the pre-existing Lead/Rhythm-slice test in tests/test_shared_guitar_timeline.py asserting Bass's old not_applicable placeholder was updated to expect not_built instead. Full local test suite (1167 tests, including optional beat/librosa/guitarpro extras and tkinter-dependent UI tests), scripts/check_automation_readiness.py, python -m compileall, and cdlc --help all pass. Full detail in docs/score-role-composition-fanout-review.md's 'Song Workspace status surfacing: Bass draft provenance (landed)' section. Both halves of 'Song Workspace/CLI status surfacing' are now landed. Remaining #232 work: make position/event-timing/technique/chord review and the Arrangement Preview actually consume a role's composed multi-track note stream instead of failing closed when one is selected -- a distinct, larger follow-on requiring each review layer's event-index keying and score_preview.py's per-role note assembly reworked against a merged multi-track stream. Still should not interrupt Product Reality Gate v1 unless single-track mapping blocks or produces materially wrong output."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Engineering-memory anchor for recurring failure classes. No new recurring-defect instance found this run."

