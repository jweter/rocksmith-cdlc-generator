next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness (see verified_repository_state.active_pr.fix_status). As of this update: draft PR #396 on branch claude/clever-davinci-6ws4tx (#304/#193 packaging-gate undeclared-confirmed-role fix) is open against main. If it is still open, wait for fresh CI on both required workflows and an unresolved-review-thread check before merging; if it is already merged, re-check its post-merge automated-review threads too (per #193's prevention rule) and then move to the next bullet. Next unstarted work after that PR resolves: pick another #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density more broadly, or other error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence, or continue auditing #304 for further defects -- the #393/#193 two-independent-sources-of-truth pattern has now recurred three times (Song Workspace dashboard, then the packaging gate), so it is worth specifically re-checking any other remaining reader of manifest.arrangement_instruments or similar creation-time-only fields for the same gap before assuming it is fully closed. Do not start #391 work -- its own issue body says not to displace #304/#305."
  action: "This run queried live GitHub state first and found 0 open PRs and the same 5 open issues this file already tracked -- no post-merge review-thread recheck was newly required since the last update. Rather than assume 'nothing left' meant no #304 work remained, this run performed its own independent code audit specifically re-examining every reader of manifest.arrangement_instruments (the same field whose staleness #393 already fixed one reader of), since a pattern recurring once is reason to check for a second occurrence. It found arrangement_gate.configured_arrangement_roles -- the actual packaging-gate/DLC-build-selection function used by require_configured_arrangements_ready and prepare_dlcbuilder_project, reachable via the plain CLI independently of the desktop Song Workspace -- had the identical gap #393 fixed for the dashboard: it read only manifest.arrangement_instruments, not human-confirmed score mapping. Consequences were more severe than #393's dashboard-display gap: a real FAIL Lead/Rhythm arrangement for an undeclared-but-confirmed role could not block packaging at all, and a real PASSing one was silently excluded from the shipped DLC. Fixed by also consulting score.mapping_for(role).human_confirmed, matching #393's and multi_arrangement_plan._confirmed_guitar_roles's existing signal. Added 3 regression tests (2 verified to fail pre-fix), documented in docs/product-reality/issue-304-packaging-gate-undeclared-confirmed-role.md, ran the full test suite locally (1382 passed, 0 failed, Python 3.12 with dev+beat extras) plus scripts/quality_preflight.py (exit 0), and opened draft PR #396 against main -- explicitly not merged in this same run, left for fresh CI per the standard rule. No mapping, validation, provenance, timing, or packaging authority changed; a role only enters the gate/build set when declared at creation or explicitly human-confirmed. The next run (or Jeremy) should: (1) query live PR/issue state first as always, including automated-review threads on anything merged very recently; (2) once CI is green on this PR and it is mergeable with no unresolved review threads, merge it; (3) then pick another #305 'Areas to review' item, re-check #304's human-only lane, or continue the #304 code audit for further defects, including a targeted look for any remaining manifest.arrangement_instruments-only reader; (4) keep watching for any recurrence of the merge-before-review-fix-gap pattern; (5) leave #391 alone until #304/#305 work is judged complete, per that issue's own instruction."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking every PR merged since this file's last update for unresolved review threads is part of querying live state, not optional. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. A new issue that explicitly says 'do not displace active work' (like #391) should not be picked over the current milestone just because it is newest. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true whether read a minute or a week later."

safety_and_content_boundaries:
