schema_version: 1
project: rocksmith-cdlc-generator
updated_at: "2026-08-20T01:00:00Z"
status_source: "Verified repository state plus PROJECT_PLAN.md; this file is a continuity cache and never overrides higher-authority evidence."

product:
  primary_platform: "Windows 11 desktop application"
  primary_surface: "GUI"
  deterministic_engine_surface: "CLI"
  target_game: "Rocksmith 2014 Remastered"
  arrangements:
    - bass
    - lead
    - rhythm
  arrangement_priority: "equal"
  north_star: "One local recording plus one complete structured score, when available, producing reviewed playable Bass + Lead + Rhythm arrangements with minimal manual authoring."

current_milestone:
  name: "Product Reality Gate v1"
  roadmap_file: "PROJECT_PLAN.md"
  state: "active"
  objective: "Run one representative lawful song + complete structured score through the packaged Windows application, capture measured workflow evidence, and use the findings to prioritize normal-path fixes."

automation_contract:
  schedule_role: "repository participant in the consolidated hourly portfolio-development loop"
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."
  advisory_review_unavailable_is_not_failure: true

verified_repository_state:
  checked_at: "2026-08-20T00:00:00Z"
  note: "Live PR/check/issue state is intentionally not cached as authoritative counts here. Scheduled runs must query GitHub directly before acting."
  ci_workflows:
    - ".github/workflows/ci.yml"
    - ".github/workflows/windows-desktop.yml"
  important_open_issues:
    - number: 268
      title: "Add track-level source trust review for imported score fan-out"
      relevance: "Verified 2026-08-18: backend contract, Song Workspace controller/status models, Arrangement Preview UI wiring, and every listed related Product Reality finding (percussion role filter, warning/validation-root-cause summaries, BPM display, pending-selection preservation, review queue summary) are merged and covered by tests. No further gap was found this run; consider closing after a human confirms no residual behavior gap."
    - number: 241
      title: "Add score-aware sparse musical anchors for timing review"
      relevance: "Verified 2026-08-19: anchors, bounded refit preview/acceptance, promotion, per-role projection, and a read-only reviewed Rocksmith XML render/handoff bridge are merged. A prior run closed the routing gap: authoring_export.py (used by desktop_xml_export.export_project_arrangement_xml for Bass/Lead/Rhythm) checks for analysis/reviewed_score_timing.json and, when present, routes notes/timing/positions through reviewed_rocksmith_xml_render.py instead of charts/<role>_source.json, failing closed rather than silently falling back. This run closed the remaining UI-affordance follow-on: AuthoringExportManifest/GuitarAuthoringExportManifest (authoring_export.py) now carry a structured `timing_source` field (`reviewed_score_anchors`/`legacy_chart`, manifest schema_version bumped 1->2) instead of that fact being discoverable only via free-text assumptions, and the desktop Rocksmith XML Export window (desktop_xml_export_window.py) reads it back from eof/export_manifest.json / eof/<arrangement>_export_manifest.json to label each arrangement's post-export status line, degrading gracefully to the prior plain 'Exported: <path>' text if the manifest is missing/unreadable/older-shaped. Regression tests added/extended in tests/test_authoring_export_reviewed_routing.py and tests/test_desktop_xml_export_state.py. No further gap identified for #241 at this time."
    - number: 232
      title: "Support multiple source tracks per Rocksmith arrangement role"
      relevance: "Verified 2026-08-20 (this run): landed the full audit-checklist sweep of other source_track_index==/track_index== call sites (reviewed_positions.py, reviewed_event_timing.py, reviewed_techniques.py, reviewed_chords.py, guitar_authoring.py, alignment.py, score_preview.py, chord_identity_ui.py, score_mapping_review.py, score_role_composition_workspace_status.py) against the previously-landed Lead/Rhythm and Bass downstream-consumer designs, following up on the Bass slice landed the same day. Most call sites were confirmed safe as-is (alignment.py/guitar_authoring.py key off a single confirmed-primary/composed-materialized track index that composition never changes out from under them; score_mapping_review.py/score_role_composition_workspace_status.py are unrelated to fanned-out note content; the four reviewed_*.py apply_*_to_source functions already re-check each decision's recorded content against the live note at that index and fail closed on mismatch). The sweep found and closed one real gap: reviewed_positions.py's _fanout_entry/_source_event (shared by set_reviewed_position/set_reviewed_event_timing/set_reviewed_techniques/set_reviewed_chord_group and every validate_decision_identity re-check) and score_preview.py's load_score_fanout_preview_snapshot (the Song Workspace Arrangement Preview / chord-identity UI read model) all read a role's note stream exclusively through the score fan-out manifest, which reflects Bass's composed multi-track output (landed earlier the same day) but never Lead/Rhythm's, since Lead/Rhythm's composed materialization happens only inside shared_guitar.py's chart-build path and is never written back into that manifest. A Lead/Rhythm role with a multi-track composition selected would therefore have let a human silently review/preview and record position, timing, technique, or chord decisions against only the confirmed-primary-track note stream, with no signal that additional composed material was excluded -- the same silent-undercount class of bug issue #232's original fail-closed guards existed to prevent, reintroduced at a layer neither landed slice touched. Closed via a new shared helper, reviewed_positions.composed_multi_track_review_gap, called once from _fanout_entry (covering all four review write paths from one call site) and once per role from score_preview.py's assembly loop: a best-effort check, mirroring _current_composed_bass_record/_current_composed_record_for_role, that fails closed with an actionable message whenever a role's persisted composition currently selects more than one track and the fan-out manifest's entry does not already point at the deterministic composed-source path -- which never fires for Bass, since its manifest entry already names that exact path once composed. Regression coverage added in tests/test_shared_guitar_timeline.py (fails closed for an unmaterialized composed Lead selection; unaffected by a single-track selection), tests/test_score_fanout_bass_composition_guard.py (Bass, after a real composed fan-out run, is never blocked), and tests/test_score_preview.py (fails closed for Lead; accepts a composed Bass selection reflected in the manifest; unaffected by single-track/stale-plan cases); reviewed_techniques.py and reviewed_event_timing.py were manually verified to inherit the identical guard through the shared _fanout_entry choke point. Full local test suite (1155 tests, including optional beat/librosa extras), scripts/check_automation_readiness.py, and python -m compileall pass. Full detail in docs/score-role-composition-fanout-review.md's 'Audit-checklist sweep (issue #232, landed)' section. Remaining #232 work: (1) make position/event-timing/technique/chord review and the Arrangement Preview actually consume a role's composed multi-track note stream instead of failing closed when one is selected -- a distinct, larger follow-on requiring each review layer's event-index keying and the Preview's per-role note assembly reworked against a merged stream; (2) Song Workspace/CLI status surfacing of composed vs. single-track draft provenance for Bass (Lead/Rhythm already expose composed_source_track_indices on SharedGuitarDraftManifest for this; Bass has no equivalent persisted draft manifest today). Still should not interrupt Product Reality Gate v1 unless single-track mapping blocks or produces materially wrong output."
    - number: 193
      title: "Track recurring defect patterns and root-cause fixes"
      relevance: "Engineering-memory anchor for recurring failure classes. No new recurring-defect instance found this run."

