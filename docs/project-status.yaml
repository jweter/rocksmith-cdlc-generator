safety_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  ollama_can_define_deterministic_acceptance: false
  unattended_worker_can_push_or_merge_code: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "genuinely ambiguous source mapping or notation interpretation"
  - "guitar-in-hand gameplay feel"
  - "tone preference"
  - "genuinely ambiguous fingering/playability"
  - "new product/creative direction"
  - "final publication/licensing/copyright authorization"

human_decision_required:
  - issue: 612
    decision: "None for the unattended-worker implementation. Escalate only if automation reaches a genuinely subjective/gameplay/vision boundary."
  - issue: 431
    decision: "Do not ask the user to re-measure the known timing facts; first use private local machine evidence. Human involvement is only a final gameplay judgment after deterministic timing passes."
  - issue: 429
    decision: "Do not request repetitive printed-score testing while deterministic recognition completeness/validation can be improved or measured automatically."

