next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness (see verified_repository_state.active_pr.fix_status). As of this update: a draft PR on branch claude/clever-davinci-m7mm5r (#304 redundant project-load double-refresh fix) is being opened against main. If it is still open, wait for fresh CI on both required workflows and an unresolved-review-thread check before merging; if it is already merged, re-check its post-merge automated-review threads too (per #193's prevention rule) and then move to the next bullet. Next unstarted work after that PR resolves: pick another #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density more broadly, or other error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence, or continue auditing #304 for further defects beyond the ones already fixed. Do not start #391 work -- its own issue body says not to displace #304/#305."
  action: "This run queried live GitHub state first and found 0 open PRs, so per selection_rule it re-checked review threads on both PRs merged since this file's last update (#390 and #392, both clean, 0 threads) before picking new work. It also found this file's own active_pr/roadmap pointers were stale (still describing #390 as an open draft) and corrected them. Rather than assume 'nothing left' meant no #304 work remained, this run performed its own independent code audit against #304's priority order (normal-path blockers, then stale state/readiness/provenance, then validation/export/packaging, then Bass/Lead/Rhythm mapping/timing, then recoverability/error-messaging, then workflow friction). Checks against the #193 stale-derivative-authority pattern specifically found those surfaces already correctly guarded by prior slices -- no new instance of that pattern was found. The one confirmed, confidently root-causable defect found this run: LiveDiagnosticsGuidedDesktopApp.load_project (the real cdlc-desktop entry point) called self.refresh_project() twice per project open, quadrupling workflow-plan recomputation and duplicating every open window's refresh, solely to log one diagnostic line -- a #304 priority-6 (lower-severity workflow friction) defect, and every other shell's load_project (including the base DesktopApp) already called refresh_project() exactly once. Fixed by extracting the workflow-state log check into a small helper so the expensive refresh cascade runs once (diagnostic_guided_desktop.py), added a regression test verified to fail against the pre-fix code (observed 2 refresh calls, not 1), documented the defect in docs/product-reality/issue-304-redundant-project-load-refresh.md, ran the full test suite locally (1377 passed, 0 failed, Python 3.12 with dev+beat extras) plus scripts/quality_preflight.py (exit 0), and opened a draft PR against main -- explicitly not merged in this same run, left for fresh CI per the standard rule. This is a pure internal refactor: no widget, workflow-plan, mapping, provenance, validation, timing, or packaging behavior changed, and the diagnostic log lines a user sees are identical in content and order to before. The next run (or Jeremy) should: (1) query live PR/issue state first as always, including automated-review threads on anything merged very recently; (2) once CI is green on this PR and it is mergeable with no unresolved review threads, merge it; (3) then pick another #305 'Areas to review' item, re-check #304's human-only lane, or continue the #304 code audit for further defects; (4) keep watching for any recurrence of the merge-before-review-fix-gap pattern; (5) leave #391 alone until #304/#305 work is judged complete, per that issue's own instruction."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking every PR merged since this file's last update for unresolved review threads is part of querying live state, not optional -- do this even when 0 PRs are open, and even when the previous run's check came back clean. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. A new issue that explicitly says 'do not displace active work' (like #391) should not be picked over the current milestone just because it is newest. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true (or is explicitly flagged for re-verification) whether read a minute or a week later, after the PR opens, and after it merges."

