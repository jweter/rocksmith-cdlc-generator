next_continuation:
  priority: "Always re-verify live GitHub state first rather than trusting this file's freshness (see verified_repository_state.active_pr.fix_status). As of this run: a draft PR on branch claude/nice-einstein-hesp72 (#304 misleading score-replacement button/message fix) is being opened against main. If it is still open, wait for fresh CI on both required workflows and an unresolved-review-thread check before merging; if it is already merged, re-check its post-merge automated-review threads too (per #193's prevention rule) and then move to the next bullet. Next unstarted work after that PR resolves: pick another #305 'Areas to review' item not yet adopted (Song Workspace layout/information-density more broadly, or other error/empty/loading states), or re-check #304's human-only packaged-Windows Bass retest lane (see human_decision_required) for any new evidence, or continue auditing #304 for further defects beyond the ones already fixed."
  action: "This run queried live GitHub state first and found 0 open PRs, so per selection_rule it checked the most recently merged PR (#389, #305 guided-shell next-action callout) before picking new work -- CI green on its merged head SHA, no indication of an unresolved review thread. Rather than assume 'all #304 comment-reported defects are fixed' meant no #304 work remained, this run performed its own independent code audit against #304's priority order (normal-path blockers, then stale state/readiness/provenance, then validation/export/packaging, then Bass/Lead/Rhythm mapping/timing, then recoverability/error-messaging, then workflow friction). Extensive checks against the #193 stale-derivative-authority pattern specifically (score mapping refresh, review-queue/Sources-tab label staleness, Bass mapping/reconciliation currency, shared-timeline/shared-guitar-draft provenance binding, score-role-composition fan-out currency, package-generation invalidation) found those surfaces already correctly guarded by prior slices -- no new instance of that pattern was found. The one confirmed, confidently root-causable defect found: the Score & Mappings 'Register / Replace Score' button and register_project_score's refusal error both promised an 'explicit replacement' capability for an already-registered score that does not exist anywhere in the app, leaving a user who picks the wrong score file (a plausible normal-authoring mistake) at an unrecoverable, misleadingly-worded dead end -- a #304 priority-5 (recoverability/error-messaging) defect. Fixed the button label and refusal message to be honest and actionable (desktop_app.py, desktop_shell.py, project_score.py, docs/project-score-registration.md), removed the now-redundant runtime button-rename shim, added/extended regression tests verified to fail against the pre-fix strings, documented the defect in docs/product-reality/issue-304-misleading-score-replacement-message.md, ran the full test suite locally (1376 passed, 0 failed, Python 3.12 with dev+beat extras), and opened a draft PR against main -- explicitly not merged in this same run, left for fresh CI per the standard rule. This is presentation/error-messaging only; it does not implement an actual score-replacement workflow (a larger, separate feature slice noted as residual risk in the PR/doc). The next run (or Jeremy) should: (1) query live PR/issue state first as always, including automated-review threads on anything merged very recently; (2) once CI is green on this PR and it is mergeable with no unresolved review threads, merge it; (3) then pick another #305 'Areas to review' item, re-check #304's human-only lane, or continue the #304 code audit for further defects; (4) keep watching for any recurrence of the merge-before-review-fix-gap pattern."
  selection_rule: "Always query live PR state first; a correctness/safety/provenance finding outranks new feature work, including one raised by automated PR review on a PR whose CI is already green or that has already been merged -- CI passing does not by itself mean a PR is safe to merge, a PR being merged does not by itself mean an in-flight review finding on it is resolved, and a merged PR's head branch being deleted does not excuse leaving its unresolved P1/P2 findings unfixed on main. Checking the most recently merged PR's review threads is part of querying live state, not optional -- do this even when 0 PRs are open, and even when the previous run's check came back clean. A human-only Product Reality gate blocks only the specific dependent work it verifies, not unrelated parallel-lane work. Never phrase a continuation pointer as a claim about what is happening 'in this same run' or 'right now': write it so it stays true (or is explicitly flagged for re-verification) whether read a minute or a week later, after the PR opens, and after it merges."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required:
