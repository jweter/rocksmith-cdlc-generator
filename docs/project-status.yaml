next_continuation:
  priority: "Finish verification of the v6 EOF-derived Guitar Pro first-sync replacement before any additional timing heuristic or downstream feature work."
  action: "Inspect fresh CI and Windows Desktop results for PR 456 and repair any findings on the same branch. When the exact head is green and review is reconciled, make the change ready through the normal merge gate. Then use the resulting packaged Windows artifact on the same representative project: Run Safe Automatic Steps, review/promote shared timing, verify the common Bass/Lead/Rhythm entrance near ~7.109 s, verify the printed-score B-string fret-8 Lead transition around ~77.756 s, and check later passages for drift. If it still disagrees with EOF, keep #431/#455 open and compare the generated EOF first-sync evidence against the local EOF recording-clock observations rather than adding a song-specific correction."
  selection_rule: "Correctness/safety/provenance findings outrank new feature work. When a mature reference is correct on the same lawful input, establish parity before adding heuristics. Preserve one shared recording clock and do not compensate for a failed timing result by hand."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false
  private_official_tab_page_images_in_git: false
  eof_bundled_or_auto_downloaded: false
  eof_can_mutate_canonical_authority: false
  eof_reference_semantics_reused_with_attribution: true

