  action: "Continue Product Reality Gate v1 (requires a human-run representative lawful song/score session; not autonomously completable). While that evidence run is pending: #232's Lead/Rhythm and Bass downstream-consumer slices have both landed (see #232 entry above) on top of the previously merged Song Workspace status layer, no-overlap compose controller/panel, in-workspace add/remove track picker, and in-workspace overlap-decision UI. Remaining #232 work, in priority order: (1) re-verify the full audit checklist of other source_track_index==/track_index== call sites (reviewed_positions.py, reviewed_event_timing.py, reviewed_techniques.py, reviewed_chords.py, guitar_authoring.py, alignment.py, score_preview.py, chord_identity_ui.py, score_mapping_review.py, score_role_composition_workspace_status.py) against the now-landed Lead/Rhythm and Bass designs -- land as its own PR, it is a distinct audit rather than an extension of either landed slice; (2) Song Workspace/CLI status surfacing of composed-vs-single-track draft provenance, including a Bass-side equivalent of SharedGuitarDraftManifest.composed_source_track_indices (Bass currently has no persisted draft manifest analogous to Lead/Rhythm's). Full detail in docs/score-role-composition-fanout-review.md's 'Downstream consumption: Lead/Rhythm (landed)' and 'Downstream consumption: Bass (landed)' sections -- read both before starting either remaining item. #241 and #268 both appear complete; a human should confirm and close them rather than an agent auto-closing them. Next highest-value candidate after the #232 audit-checklist sweep and provenance-surfacing land: sweep the open Issues tab (#174, #47, #46, #45 plus any new items) for the next highest-value bounded fix, per the agent-development-policy issue-sweep cadence -- note #174/#47/#46/#45 are all currently blocked on human action (lawful source acquisition, external rights/provenance judgment, or product decisions on optional metadata providers) rather than being autonomously actionable today."
  selection_rule: "Before beginning roadmap work, query live PR state. Handle failed, green, blocked, conflicted, or pending existing work according to docs/agent-development-policy.md."

safety_and_content_boundaries:
  live_rocksmith_modification: false
  nocablelauncher_modification: false
  validation_gate_required_for_packaging: true
  commercial_audio_in_git: false
  private_psarc_cdlc_in_git: false
  copyrighted_personal_tab_score_in_git_without_explicit_redistribution_rights: false
  private_generated_project_workspaces_in_git: false

human_review_gates:
  - "rights/provenance uncertainty"
  - "source mapping uncertainty"
  - "timing acceptance"
  - "fingering/playability"
  - "tone acceptance"
  - "package readiness"

human_decision_required: null

maintenance_contract:
  verify_every_scheduled_run: true
  update_when_project_reality_changes: true
  update_in_same_pr_as_relevant_change: true
  stale_status_is_a_defect: true
  timestamp_age_alone_requires_noop_pr: false
