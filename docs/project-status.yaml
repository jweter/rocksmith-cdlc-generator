automation_contract:
  branch_prefix: "agent/"
  new_roadmap_pr_budget_per_hour: 1
  query_live_github_state_every_run: true
  newly_opened_pr_requires_fresh_ci_before_merge: true
  required_pr_workflows:
    - name: "CI"
      file: ".github/workflows/ci.yml"
    - name: "Windows Desktop"
      file: ".github/workflows/windows-desktop.yml"
  merge_rule: "Merge only the exact inspected head SHA after both required workflows complete successfully, mergeability is resolved, and no blocking review or material correctness/safety/licensing/provenance/product concern remains."

verified_repository_state:
  checked_at: "2026-08-23T08:14:00Z"
  note: "Live PR/check/issue state is not cached as authoritative beyond this snapshot. This run found 0 open PRs, so it read the most recently merged PR's (#387) automated-review threads (repository policy: an in-flight automated-review finding is not resolved just because CI was green or the PR already merged) and found two unresolved P2 Codex findings left on #387 itself: (1) the working-tree-only form of the new diff-base check still misses a whitespace error that is staged and then further edited -- without being re-staged -- in the working tree (git status `MM`): the working tree looks clean, but a plain `git commit` right now would still record the broken staged content; (2) this same file's `active_pr` block described its own branch as \"being pushed and opened ... in this same run\" with `pr_number: null`, which is self-invalidating the moment the branch actually becomes a PR or merges -- the exact stale-continuation defect #387 was meant to fix. Both are fixed in this run's PR (see active_pr) and cross-linked to #193 as a fourth occurrence of the recurring merge-before-review-fix-lands pattern."
  recently_merged_pr:
    number: 387
    title: "Fix quality_preflight.py whitespace-diff base and stale project-status.yaml (#304, #193)"
    merged_at: "2026-08-23T07:26:42Z, merged to main (head branch claude/nice-einstein-gwv38p)"
    behavior_change: "scripts/quality_preflight.py's whitespace check diffs against the merge-base with origin/main/main (falling back to HEAD) instead of the working tree vs. index only."
  active_pr:
    branch: "claude/nice-einstein-6z2ql1"
    base: "main"
    pr_number: 388
    lane: "#304 / #193: fix a fourth occurrence of the merge-before-review-fix gap -- two unresolved P2 Codex findings left on already-merged PR #387."
    behavior_change: "scripts/quality_preflight.py now also diffs the *index* against the resolved merge-base (new cached_diff_check_command()/diff_check_commands() helpers), in addition to the existing working-tree-vs-base form, so a whitespace error that is staged and then further edited (without re-staging) in the working tree can no longer slip past the check even though the working tree itself looks clean."
    regression_tests: "New: tests/test_quality_preflight.py::test_cached_diff_check_catches_staged_only_whitespace_error reproduces the exact staged-only (git status MM) scenario against a real temporary git repo, confirming the working-tree form misses it while the new --cached form catches it; test_diff_check_commands_returns_both_working_tree_and_cached_forms locks in that both forms are run. Full suite: python -m pytest -q -> 1372 passed, 0 failed (1370 baseline + 2 new), Python 3.12 with dev+beat extras (python3-tk installed locally for sandbox verification only, matching this repo's established precedent). Also ran python -m compileall, python -m pip check, cdlc --help, and scripts/check_automation_readiness.py -- all clean."
    safety_boundary: "Local developer-tooling fix only; scripts/quality_preflight.py is not invoked by CI (.github/workflows/ci.yml, windows-desktop.yml run their own explicit steps) and this change touches no mapping/validation/provenance/packaging authority. The docs/project-status.yaml correction is documentation-only."
    fix_status: "Opened as draft PR #388 against main, intentionally left unmerged for independent fresh CI verification (this run must not merge it). Do not trust this block's freshness by itself -- re-verify PR #388's live state (open/merged, CI, unresolved review threads) before acting on it, per selection_rule below and AGENTS.md's authority order. If live state shows #388 merged, treat this lane as closed and move to next_continuation.priority instead of redoing it."
  important_open_issues:
    - number: 304
      relevance: "Current-milestone remediation umbrella. All known #304 comment-reported defects (#322, #342, #348, #349, #350, #357) plus the #360/#361, #383, #385/#386, and #387 merge-before-review-fix gaps have merged or pending-CI code fixes. The waiting-human packaged-Windows Bass retest lane described in human_decision_required remains outstanding and is not a repo-wide blocker on parallel #305 work."
    - number: 305
      relevance: "Parallel Windows authoring-workspace upgrade. Foundation (#340), design-token adoption in the validation dashboard (#341), dark-first visible adoption (#345), click-track discoverability/placement (#351), Score & Mappings role-status (#352), Review Queue severity-status (#353), Track trust panel status (#354), Song Workspace header health/progress-indicator (#356), the dark-theme contrast fix for the #352/#354 status labels (#359), and the Sources tab rights/provenance status (#386) are merged. Remaining #305 'Areas to review' items not yet adopted in real screens: Song Workspace layout/information-density, error/empty/loading states, and High-DPI/Windows-11-scaling behavior (unconfirmable without packaged human testing)."
    - number: 193
      relevance: "Standing recurring-defect/root-cause anchor. A human merging/closing work at its CI-green head without waiting for an in-flight automated-review fix has now recurred four times: #361->#362, #383->#384, #385/#386->#387, and now #387->this PR (each PR's P2 findings were never addressed after merge until the next run). Per #193's own operating rule, this is now a confirmed repeated pattern worth root-causing directly rather than only patching each instance -- consider gating this repo's autonomous merge step on automated-review completion, not just green required-workflow checks, so a future scheduled run cannot merge ahead of an in-flight Codex review the way #361, #383, #385/#386, and #387 all did."
    - number: 46
      relevance: "Later optional metadata capability, deferred pending a licensing/product decision (see human_decision_required)."

