name: Windows Desktop

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    name: Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install desktop runtime and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[beat,guitarpro,audio]"
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Verify desktop modules import
        shell: pwsh
        run: |
          python -c "import tkinter; import sounddevice; import rocksmith_cdlc_generator.desktop_shell; import rocksmith_cdlc_generator.timing_review; import rocksmith_cdlc_generator.timing_review_ui; import rocksmith_cdlc_generator.score_preview; import rocksmith_cdlc_generator.arrangement_preview_ui; import rocksmith_cdlc_generator.arrangement_event_selection; import rocksmith_cdlc_generator.arrangement_event_selection_ui; import rocksmith_cdlc_generator.reviewed_positions; import rocksmith_cdlc_generator.reviewed_event_timing; import rocksmith_cdlc_generator.arrangement_event_timing_ui; import rocksmith_cdlc_generator.reviewed_techniques; import rocksmith_cdlc_generator.arrangement_technique_ui; print('desktop technique editor imports OK')"

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name RocksmithCDLCGenerator `
            --collect-submodules rocksmith_cdlc_generator `
            --collect-all librosa `
            --collect-all guitarpro `
            --collect-all _sounddevice_data `
            scripts/windows_desktop_entry.py

      - name: Verify application bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/RocksmithCDLCGenerator/RocksmithCDLCGenerator.exe")) {
            throw "Desktop executable was not produced"
          }
          Get-ChildItem "dist/RocksmithCDLCGenerator" | Select-Object Name, Length

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocksmithCDLCGenerator-Windows
          path: dist/RocksmithCDLCGenerator/
          if-no-files-found: error
          retention-days: 14
