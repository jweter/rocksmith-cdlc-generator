name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,beat]"

      - name: Verify autonomous-development contract
        run: python scripts/check_automation_readiness.py

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -q

      - name: Verify CLI entry point
        run: cdlc --help

  windows-compat:
    name: Windows 3.12 + PSARC bridge
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install package and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,beat]"

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q src tests

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Verify CLI entry point
        shell: pwsh
        run: cdlc --help

      - name: Build pinned Rocksmith2014.NET PSARC bridge
        shell: pwsh
        run: .\scripts\bootstrap_psarc_bridge.ps1
