[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocksmith-cdlc-generator"
version = "0.1.0"
description = "Local-first Rocksmith 2014 CDLC arrangement generation assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3,<2",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
beat = [
    "librosa>=0.11,<0.12",
]
guitarpro = [
    "PyGuitarPro>=0.11,<0.12",
]

[project.scripts]
cdlc = "rocksmith_cdlc_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
