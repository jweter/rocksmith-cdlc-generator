[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocksmith-cdlc-generator"
version = "0.1.0"
description = "Local-first Rocksmith 2014 CDLC arrangement generation assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3,<2",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
beat = [
    "librosa>=0.11,<1.1",
]
guitarpro = [
    "PyGuitarPro>=0.11,<0.12",
]
audio = [
    "sounddevice>=0.5.5,<0.6",
]

[project.scripts]
cdlc = "rocksmith_cdlc_generator.cli:main"
cdlc-desktop = "rocksmith_cdlc_generator.diagnostic_guided_desktop:main"
cdlc-reference = "rocksmith_cdlc_generator.reference_cli:main"
cdlc-sources = "rocksmith_cdlc_generator.source_inventory_cli:main"
cdlc-source-rights = "rocksmith_cdlc_generator.source_rights_cli:main"
cdlc-score-map = "rocksmith_cdlc_generator.score_mapping_cli:main"
cdlc-score-fanout = "rocksmith_cdlc_generator.score_fanout_cli:main"
cdlc-score-composition = "rocksmith_cdlc_generator.score_role_composition_cli:main"
cdlc-shared-timeline = "rocksmith_cdlc_generator.shared_timeline_cli:main"
cdlc-build-shared-guitar = "rocksmith_cdlc_generator.shared_guitar_cli:main"
cdlc-plan = "rocksmith_cdlc_generator.workflow_plan_cli:main"
cdlc-auto = "rocksmith_cdlc_generator.workflow_runner_cli:main"
cdlc-draft = "rocksmith_cdlc_generator.draft_bootstrap_cli:main"
cdlc-eof = "rocksmith_cdlc_generator.eof_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
