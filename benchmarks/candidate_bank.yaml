schema_version: 1
updated_at: 2026-08-10
purpose: >-
  Curated candidate songs for private/local Rocksmith CDLC benchmark development.
  This file stores metadata and research status only. It does not designate any
  copyrighted recording, tab, or CDLC as redistributable or as accepted ground truth.

promotion_policy:
  required_before_trusted_benchmark:
    - verify_not_already_installed_against_current_cfsm_export
    - obtain_lawful_local_audio_source
    - obtain_lawful_structured_reference_or_human_reference
    - review_and_accept_reference_chart
    - select_30_to_90_second_excerpt
    - record_source_hashes_and_tool_versions
  reference_rule: structured_notation_is_candidate_evidence_not_automatic_ground_truth

status_enums:
  structured_reference:
    - verified_strong
    - verified_good
    - provisional
  dlc_library:
    - manual_search_no_exact_match
    - requires_full_cfsm_check
  tier:
    - tier_1_mvp
    - tier_2_generalization
    - tier_3_advanced
    - tier_4_stress
    - reserve

